<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMES HDPS 5S 관리시스템</title><style>:root{--bg:#f4f7fa;--card:#fff;--ink:#10233a;--mut:#66798b;--line:#dce5ec;--navy:#103d70;--blue:#2f80d0;--green:#50a563;--orange:#e9a01c;--red:#df6258;--purple:#7659d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Malgun Gothic',sans-serif;color:var(--ink)}button,select,input{font:inherit}.shell{max-width:1720px;margin:auto;padding:14px 18px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h1{font-size:25px;margin:0}.top p{font-size:12px;color:var(--mut);margin:5px 0}.btn{height:34px;border:1px solid #cbd8e2;background:#fff;border-radius:7px;padding:0 11px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.tabs{display:flex;gap:4px;overflow:auto;background:#e8eef3;border:1px solid #d5e0e8;border-radius:9px;padding:5px;margin-bottom:10px}.tab{border:0;background:transparent;padding:10px 13px;border-radius:6px;font-size:12px;font-weight:900;color:#52697c;white-space:nowrap;cursor:pointer}.tab.on{background:#fff;color:#103d70;box-shadow:0 1px 5px #0002}.panel{display:none}.panel.on{display:block}.filters{display:flex;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:10px}.filters select{height:33px;border:1px solid #ccd8e1;border-radius:6px;padding:0 9px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 7px #1231}.kpi{padding:13px;transition:.2s}.kpi:hover{transform:translateY(-2px);box-shadow:0 7px 18px #1232}.kpi span{font-size:10px;color:var(--mut);font-weight:800}.kpi b{display:block;font-size:24px;margin:5px 0}.kpi small{font-size:9px;color:#718397}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1.05fr .9fr 1.25fr;gap:10px}.card{overflow:hidden;margin-bottom:10px}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #e6edf2}.head h2{font-size:17px;margin:0;font-weight:900}.body{padding:12px 14px}.tbl{width:100%;border-collapse:collapse;font-size:10.5px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #e9eef2;text-align:left;white-space:nowrap}.tbl th{background:#f5f8fa;color:#4e6679;font-weight:900}.tbl tbody tr{cursor:pointer;transition:.15s}.tbl tbody tr:hover{background:#f1f7fc;box-shadow:inset 3px 0 var(--blue)}.badge{display:inline-block;padding:4px 7px;border-radius:12px;font-size:9px;font-weight:900}.good{background:#e9f6ed;color:#3e824d}.warn{background:#fff3df;color:#a86b00}.bad{background:#ffe9e6;color:#b4463f}.info{background:#eaf3ff;color:#2f6fa8}.chart{height:210px;display:flex;align-items:flex-end;gap:14px;padding:25px 12px 28px;border-left:1px solid #d9e2e9;border-bottom:1px solid #d9e2e9}.bar{flex:1;background:linear-gradient(#4d9aeb,#2f80d0);border-radius:5px 5px 0 0;position:relative;animation:rise .7s ease both}.bar em{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);font-style:normal;font-size:10px;font-weight:900}.bar label{position:absolute;top:100%;left:50%;transform:translate(-50%,8px);font-size:9px;white-space:nowrap}.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.evidence{border:1px solid #dfe7ed;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;transition:.2s}.evidence:hover{transform:translateY(-3px);box-shadow:0 8px 20px #1232}.photos{height:105px;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#dfe7ed}.ph{position:relative;overflow:hidden}.ph:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#667783 0 7px,#87969e 7px 11px,#c3a96f 11px 15px,#59666e 15px 22px);opacity:.9}.ph.after:before{background:linear-gradient(135deg,#7fa16d 0 22%,#c8d8c0 22% 26%,#718998 26% 48%,#e0bd58 48% 52%,#9aaf91 52% 75%,#5f7885 75%)}.ph span{position:absolute;top:5px;left:5px;background:#fffddd;padding:2px 5px;border-radius:4px;font-size:8px;font-weight:900}.evtxt{padding:7px;font-size:9px}.evtxt b{display:block;font-size:10px;margin-bottom:3px}.flow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.flow span{padding:7px 9px;border:1px solid #d6e1e9;border-radius:15px;font-size:9px;font-weight:900;background:#fff}.flow i{font-style:normal;color:#7f95a5}.note{background:#eef6ff;border-left:4px solid var(--blue);padding:8px 10px;font-size:10px;color:#486b85}.progress{height:7px;background:#e8eef2;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);animation:grow .8s ease}.actionCards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{padding:11px;border:1px solid #e1e8ed;border-radius:8px;background:#fbfcfd}.action b{font-size:18px}.master{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.master div{padding:13px;border:1px solid #dfe7ed;border-radius:8px;background:#fff}.master b{display:block;margin-bottom:5px}.toast{position:fixed;right:20px;bottom:20px;background:#173b56;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s}.toast.on{opacity:1}@keyframes rise{from{transform:scaleY(.05);transform-origin:bottom;opacity:.3}to{transform:scaleY(1);opacity:1}}@keyframes grow{from{width:0}}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><div class="top"><div><h1>GMES HDPS 5S 관리시스템</h1><p>Audit · 문제점 · 개선조치 · 개선이력 · 신규등록 · 기준정보 통합 운영</p></div><div><button class="btn" onclick="location.href='index.html'">← 고도화 성과</button> <button class="btn">Excel 출력</button></div></div><div class="tabs"><button class="tab on" data-tab="home">5S 활동현황</button><button class="tab" data-tab="audit">5S Audit 관리</button><button class="tab" data-tab="issues">문제점·개선조치</button><button class="tab" data-tab="history">개선이력</button><button class="tab" data-tab="new5s">5S 신규등록</button><button class="tab" data-tab="master">통합기준정보</button></div><div id="content"></div></div><div class="toast" id="toast">저장되었습니다.</div><script>const teams=['중형상부1팀','중형상부2팀','중형하부팀','중형메인팀','중형Att팀','대형상부팀','대형메인팀','대형Att.팀','휠로더Front팀','휠로더메인팀','휠로더리어팀','초대형조립팀','프레임제작팀','Boom제작팀','성능팀','트러블슈팅팀'];const types=['정리','정돈','청소','시각화','위험구역관리','5S고도화'];const raw=Array.from({length:48},(_,i)=>({id:'5S-'+String(260801+i).padStart(6,'0'),date:`2026-08-${String(i%24+1).padStart(2,'0')}`,team:teams[i%teams.length],work:['Main Line','Front Line','Frame 제작','Boom Line','Att. Line'][i%5],type:types[i%6],issue:['불용자재 적치','공구 정위치 미흡','바닥 오염','위치표시 훼손','동선 간섭','찾는 낭비 발생'][i%6],owner:['김책임','이선임','박기장','최반장'][i%4],due:`08.${String(20+i%10).padStart(2,'0')}`,status:['완료','조치중','기한임박','미조치'][i%4],score:88+i%11}));const evidence=Array.from({length:10},(_,i)=>({team:teams[i],type:types[i%6],title:['불용품 제거 및 적치구역 재설정','공구 형적관리 적용','청소도구 정위치화','자재 위치 시각화','Green Zone 동선 개선','정량축소 및 공간확보'][i%6]}));function filters(){return `<div class="filters"><select><option>2026년 08월</option></select><select><option>전체 작업장</option></select><select><option>전체 팀</option>${teams.map(x=>`<option>${x}</option>`)}</select><select><option>전체 5S 유형</option>${types.map(x=>`<option>${x}</option>`)}</select><button class="btn primary" onclick="toast('조회조건을 적용했습니다.')">조회</button><button class="btn" onclick="toast('CSV/Excel 추출 샘플입니다.')">데이터 추출</button></div>`}function kpis(){return `<div class="kpis">${[['Audit 대상','24곳','전월 +2'],['지적 건수','48건','전월 -6'],['조치 완료','36건','완료율 75.0%'],['미조치','12건','집중관리'],['기한임박','4건','7일 이내'],['고도화 연계','3건','후보 발굴']].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`}function table(rows=raw.slice(0,12)){return `<div style="overflow:auto"><table class="tbl"><thead><tr><th>ID</th><th>일자</th><th>작업장</th><th>팀</th><th>5S유형</th><th>문제점</th><th>담당</th><th>기한</th><th>상태</th></tr></thead><tbody>${rows.map(r=>`<tr onclick="toast('${r.id} 상세 데이터를 선택했습니다.')"><td>${r.id}</td><td>${r.date}</td><td>${r.work}</td><td>${r.team}</td><td>${r.type}</td><td>${r.issue}</td><td>${r.owner}</td><td>${r.due}</td><td><span class="badge ${r.status==='완료'?'good':r.status==='기한임박'?'warn':r.status==='미조치'?'bad':'info'}">${r.status}</span></td></tr>`).join('')}</tbody></table></div>`}function gallery(){return `<div class="gallery">${evidence.map((e,i)=>`<div class="evidence" onclick="toast('${e.team} 개선 Evidence를 선택했습니다.')"><div class="photos"><div class="ph"><span>BEFORE</span></div><div class="ph after"><span>AFTER</span></div></div><div class="evtxt"><b>${i+1}. ${e.team} / ${e.type}</b>${e.title}</div></div>`).join('')}</div>`}function chart(){return `<div class="chart">${teams.slice(0,10).map((t,i)=>`<div class="bar" style="height:${45+(i*13)%50}%"><em>${6+i%7}</em><label>${t}</label></div>`).join('')}</div>`}function home(){return filters()+kpis()+`<div class="grid3"><div class="card"><div class="head"><h2>월별 5S Audit 지적 추이</h2><b>동적 Drill-down</b></div><div class="body">${chart()}</div></div><div class="card"><div class="head"><h2>5S 유형별 현황</h2></div><div class="body">${types.map((x,i)=>`<p style="font-size:11px"><b>${x}</b> ${8-i}건</p><div class="progress"><i style="width:${85-i*9}%"></i></div>`).join('')}</div></div><div class="card"><div class="head"><h2>최근 개선 전·후 Evidence</h2><button class="btn" data-open="history">더보기</button></div><div class="body">${gallery()}</div></div></div><div class="card"><div class="head"><h2>5S 활동 현황 Flow</h2></div><div class="body"><div class="flow"><span>Audit 계획</span><i>→</i><span>현장점검</span><i>→</i><span>문제점 등록</span><i>→</i><span>개선계획</span><i>→</i><span>개선실행</span><i>→</i><span>조치확인</span><i>→</i><span>기록/관리</span></div></div></div>`}function audit(){return filters()+kpis()+`<div class="grid2"><div class="card"><div class="head"><h2>팀별 Audit 지적/조치율</h2></div><div class="body">${chart()}</div></div><div class="card"><div class="head"><h2>Audit Action Summary</h2></div><div class="body"><div class="actionCards"><div class="action"><span>금월 예정</span><b>6</b></div><div class="action"><span>완료</span><b>18</b></div><div class="action"><span>기한임박</span><b>4</b></div><div class="action"><span>재Audit</span><b>2</b></div></div><div class="note" style="margin-top:12px">행을 클릭하면 작업장·팀·지적유형 기준 상세 Drill-down을 수행하는 샘플 구조입니다.</div></div></div></div><div class="card"><div class="head"><h2>Audit RAW DATA</h2><span>샘플 48건</span></div><div class="body">${table()}</div></div>`}function issues(){return filters()+`<div class="card"><div class="head"><h2>팀별 문제점 · 개선조치 RAW DATA</h2><button class="btn primary" onclick="toast('개선조치 등록창 샘플')">+ 개선조치 등록</button></div><div class="body">${table(raw.slice(8,28))}</div></div><div class="card"><div class="head"><h2>미조치 / 기한임박 집중관리</h2></div><div class="body">${table(raw.filter(r=>r.status!=='완료').slice(0,10))}</div></div>`}function history(){return filters()+`<div class="card"><div class="head"><h2>현장 개선 전·후 사진 Evidence · 최근 10건</h2><span>샘플 이미지 UI</span></div><div class="body">${gallery()}</div></div><div class="card"><div class="head"><h2>최근 개선이력 RAW DATA</h2></div><div class="body">${table(raw.slice(20,40))}</div></div>`}function new5s(){return `<div class="grid2"><div class="card"><div class="head"><h2>5S 신규활동 등록</h2></div><div class="body"><div class="note">작업장·팀·유형·문제점·개선 전후 Evidence를 필수 입력하는 샘플입니다.</div>${['작업장','생산팀','5S 유형','문제점','개선내용','효과'].map(x=>`<p><b style="font-size:10px">${x}</b><br><input style="width:100%;height:36px;border:1px solid #ccd8e1;border-radius:6px"></p>`).join('')}<button class="btn primary" onclick="toast('신규 5S 활동 샘플을 저장했습니다.')">등록</button></div></div><div class="card"><div class="head"><h2>개선 전·후 Evidence</h2></div><div class="body">${gallery().replaceAll('evidence','evidence')}</div></div></div>`}function master(){return `<div class="card"><div class="head"><h2>통합기준정보</h2><button class="btn primary" onclick="toast('기준정보를 저장했습니다.')">저장</button></div><div class="body"><div class="master"><div><b>생산팀 Master</b>16개 팀 · 표시순서 · 활성여부</div><div><b>작업장 Master</b>공장/라인/작업장/담당팀 Mapping</div><div><b>5S 유형 Master</b>${types.join(' · ')}</div><div><b>Audit 점검항목</b>점검항목 · 배점 · 판정기준</div><div><b>Audit 주기</b>1개월 · 3개월 · 6개월 · 재Audit</div><div><b>알림/기한 기준</b>기한임박 · 미조치 · 담당자 알림</div></div></div></div><div class="card"><div class="head"><h2>생산팀 기준정보 미리보기</h2></div><div class="body">${table(raw.slice(0,16))}</div></div>`}const views={home,audit,issues,history,new5s,master};function openTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));document.getElementById('content').innerHTML=views[id]();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTab(b.dataset.open));history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}const start=location.hash.slice(1);openTab(views[start]?start:'home');</script></body></html>
