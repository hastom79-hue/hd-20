name: HD20 master refresh regression
on:
  push:
    branches: [main]
    paths:
      - 'beginner-navigation.js'
      - 'master-info-modal.js'
      - 'integrated-master-factors.js'
      - 'hd20-subtabs.js'
      - 'index.html'
      - 'tests/master-refresh-smoke.cjs'
      - '.github/workflows/master-refresh-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  master-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run master refresh regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-master-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          node tests/master-refresh-smoke.cjs
