name: HD20 runtime smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file" >/dev/null; then
              echo "::error file=$file::JavaScript syntax check failed"
              failed=1
            fi
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)
          test "$failed" -eq 0

      - name: Verify index script references exist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
          missing = []
          for ref in refs:
              path = ref.split('?', 1)[0]
              if path.startswith(('http://','https://','//')):
                  continue
              if not pathlib.Path(path).is_file():
                  missing.append(path)
          if missing:
              print('Missing script files:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print(f'OK: {len(refs)} index script references resolved')
          PY

      - name: Verify approved reference 2 static boot path
        shell: bash
        run: |
          set -euo pipefail
          test -s approved-landing-v2.css
          test -s approved-landing-v2.js
          grep -q 'approved-landing-v2.css' index.html
          grep -q 'approved-landing-v2.js' index.html
          grep -q 'hd20ApprovedLanding' approved-landing-v2.js
          grep -q 'visual reference #2' approved-landing-v2.css
          echo 'OK: approved reference 2 is loaded directly by index.html'

      - name: Verify dashboard navigation contract
        shell: bash
        run: |
          set -euo pipefail
          for key in dashboard conversion activity workplace audit action master; do
            grep -q "data-key=\"$key\"" index.html
            grep -q "data-key=\\\"$key\\\"\|data-key=\"$key\"" beginner-navigation.js
          done
          if grep -q "innerHTML=.*5S 고도화 성과\|data-nav=\"performance\"" nav-polish.js; then
            echo '::error file=nav-polish.js::Legacy 5-menu recreation detected'
            exit 1
          fi
          echo 'OK: static 7-item navigation shell and canonical controller are present'

      - name: Verify workflow screen contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "id='awActivity'\|id=\"awActivity\"\|'awActivity'" activity-workflow.js
          grep -q "awWorkplace" activity-workflow.js
          grep -q "awAudit" activity-workflow.js
          grep -q "awAction" activity-workflow.js
          grep -q "awRegister" activity-workflow.js
          grep -q "hd20GMES5SAutoImproveRawV1" activity-workflow.js
          echo 'OK: activity/workplace/audit/action/master screen shells are present'

      - name: Verify canonical KPI wiring and parity audit
        shell: bash
        run: |
          set -euo pipefail
          test -s dashboard-kpi-source.js
          grep -q 'window.HD20KPIData' dashboard-kpi-source.js
          grep -q 'HD20KPIData' top-kpi-drilldown.js
          grep -q 'HD20_TOP_KPI_AUDIT' top-kpi-drilldown.js
          grep -q 'gridRows' top-kpi-drilldown.js
          grep -q 'displayParity' top-kpi-drilldown.js
          grep -q 'HD20KPIData' performance-conversion-analysis.js
          if grep -q 'const ACT=' top-kpi-drilldown.js || grep -q 'const WP=' top-kpi-drilldown.js; then
            echo '::error file=top-kpi-drilldown.js::Hardcoded KPI sample arrays detected'
            exit 1
          fi
          echo 'OK: top KPI, approved cards and popup Grid share canonical source contract'

      - name: Verify split CRUD store is retired
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'splitStoreDisabled:true' workflow-crud.js
          if grep -q "hd20WorkflowDataV1" workflow-crud.js; then
            echo '::error file=workflow-crud.js::Deprecated split workflow store is still active'
            exit 1
          fi
          echo 'OK: generic workflow CRUD no longer writes a split operational store'

      - name: Verify lifecycle API for approved dashboard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'window.HD20MaturityFollowup' maturity-seq-action-link.js
          grep -q 'HD20MaturityFollowup' approved-landing-v2.js
          grep -q 'hd20-followup-updated' maturity-seq-action-link.js
          grep -q "1개월 점검" maturity-seq-action-link.js
          grep -q "3개월 AUDIT" maturity-seq-action-link.js
          grep -q "6개월 AUDIT" maturity-seq-action-link.js
          echo 'OK: approved dashboard 1M/3M/6M lifecycle API is wired'

      - name: Verify demo pollution guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HD20_ACTION_DEMO_SEED_DISABLED' action-demo-seed.js
          if grep -q 'commons.wikimedia.org' action-field-photo-gallery.js; then
            echo '::error file=action-field-photo-gallery.js::External demo field photo mapping detected'
            exit 1
          fi
          grep -q 'score:0' audit-global-seed.js
          grep -q "result:'N/A'" audit-global-seed.js
          echo 'OK: action/audit demo pollution guards are present'
