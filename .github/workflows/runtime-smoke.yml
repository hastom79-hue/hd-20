name: HD20 runtime smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null || { echo "::error file=$file::JavaScript syntax check failed"; failed=1; }
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)
          test "$failed" -eq 0

      - name: Verify index references
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'<script[^>]+src=["\']([^"\']+)',html):
            p=ref.split('?',1)[0]
            if not p.startswith(('http://','https://','//')) and not pathlib.Path(p).is_file():
              missing.append(p)
          if missing: sys.exit('Missing script refs: '+str(missing))
          required=['울산캠퍼스 5S 활동관리 시스템','Audit 후 6개월 지속관리','정량축소·정위치 변경을 통한 공간 활용','인당 목표 미설정']
          for x in required:
            if x not in html: sys.exit('Required label missing: '+x)
          retired=['maturity-seq-action-link.js','demo-data-seed.js','action-demo-seed.js','audit-global-seed.js','emergency-ui-stabilizer-v2.js','register-tab-fill.js','audit-admin-import.js','crud-hotfix.js','action-button-hotfix.js']
          for x in retired:
            if x in html: sys.exit('Retired script ref remains: '+x)
          PY

      - name: Verify six-area navigation and advancement maturity IA
        run: |
          set -euo pipefail
          test -s beginner-navigation.js
          for key in dashboard activity advancement audit action master; do
            grep -q "data-key=\\\"$key\\\"" beginner-navigation.js
          done
          ! grep -q 'data-key="maturitymap"' beginner-navigation.js
          grep -q "areas:\['dashboard','activity','advancement','audit','action','master'\]" beginner-navigation.js
          grep -q 'canonical-five-area-v10-early-boot' beginner-navigation.js
          grep -q "\['maturitymap','map','maturity'\]" beginner-navigation.js
          grep -q "go('advancement',nav)" beginner-navigation.js
          test -s hd20-maturity-map-tab.js
          test -s dashboard-section-tabs.js
          ! grep -q "key:'maturity'" dashboard-section-tabs.js
          grep -q "['map','⑥ 유지·이탈 포트폴리오']" hd20-subtabs.js
          test -s hd20-subtabs.js
          grep -q "workplaceVerification={state:'완료'" hd20-subtabs.js
          grep -q "advWorkplaceVerified(x)?'공식심사 대기':'작업장 근거검증 필요'" hd20-subtabs.js
          grep -q "formalReady=candidateOnly.filter" hd20-subtabs.js
          grep -q "function sanitizeStore(v){return Array.isArray(v)?v.filter(x=>!isNonProdRow(x)):v}" supabase-sync.js
          grep -q "row.workplaceVerification={state:'완료',verifiedAt:new Date().toISOString()}" hd20-subtabs.js
          grep -q "\['근거검증',verificationNeeded.length\],\['공식심사',formalReady.length\]" hd20-subtabs.js

      - name: Verify six-column navigation layout
        run: |
          set -euo pipefail
          test -s hd20-five-area.css
          grep -q 'grid-template-columns:repeat(6,minmax(0,1fr))' hd20-five-area.css
          ! grep -q "workplace.classList.add('on')" hd20-five-area-integration.js
          ! grep -q "hd20-six-nav-layout.js" final-layout-polish.js
          grep -q "window.HD20_FIVE_AREA={refresh,areas:\['dashboard','activity','advancement','audit','action','master'\]}" hd20-five-area-integration.js

      - name: Verify auth bootstrap fail-safe
        run: |
          set -euo pipefail
          ! grep -q '<html[^>]*hd20-auth-pending' index.html
          grep -q 'function showBootError' supabase-auth.js
          grep -q '접속 초기화 오류' supabase-auth.js
          grep -q 'async function boot()' supabase-auth.js
          grep -q 'showBootError(e)' supabase-auth.js

      - name: Verify canonical stores and KPI bridge
        run: |
          set -euo pipefail
          grep -q "hd20GMES5SAutoImproveRawV1" dashboard-kpi-source.js
          grep -q "hd20ActionCasesV2" dashboard-kpi-source.js
          grep -q "hd20AuditRandomDrawsV1" dashboard-kpi-source.js
          grep -q "hd20TeamHeadcountMasterV1" dashboard-kpi-source.js
          grep -q 'window.HD20KPIData' dashboard-kpi-source.js
          grep -q 'function renderTrend' dashboard-actions.js

      - name: Verify demo seed is safe and isolated
        run: |
          set -euo pipefail
          test -s demo-seed-data.js
          grep -q "isDemo:true" demo-seed-data.js
          grep -q "source:'demo-seed'" demo-seed-data.js
          grep -q 'emptyArray(ACT)' demo-seed-data.js
          grep -q 'emptyArray(AUD)' demo-seed-data.js
          grep -q 'emptyArray(ACTION)' demo-seed-data.js
          grep -q "if(!localStorage.getItem(HEAD))" demo-seed-data.js
          ! grep -R --include='*.js' --exclude='demo-seed-data.js' --exclude-dir='.git' -n "source:'demo-seed'\|HD20_DEMO_ACTIONS\|HD20_ACTION_DEMO_SEED_DISABLED" .
          ! grep -R --include='*.js' --include='*.html' --exclude-dir='.git' -n 'example\.com\|홍길동\|김현대' .

      - name: Verify validation fixture is explicit opt-in only
        run: |
          set -euo pipefail
          test -s web-validation-fixture.js
          grep -q "const ACTIVE=MODE==='1'" web-validation-fixture.js
          grep -q "if(!ACTIVE)" web-validation-fixture.js
          ! grep -q "파라미터 없이 접속해도 검증 데이터가 자동으로 보임" web-validation-fixture.js
          grep -q "web-validation-fixture.js" index.html
          grep -q "if(__v==='1')" supabase-sync.js
          ! grep -q "if(__v!=='0'&&__v!=='off')" supabase-sync.js
          ! grep -q "demo-seed-data.js" index.html
          ! grep -q "hd20-maturity-map-showcase.js" index.html
          ! grep -q "hd20-field-showcase-bootstrap.js" final-layout-polish.js
          ! grep -q "hd20-maturity-map-showcase.js" final-layout-polish.js
          ! grep -q "maturity-condition-analysis.js" index.html
          ! grep -q "maturity-condition-analysis.js" final-layout-polish.js

      - name: Verify workflow screens
        run: |
          set -euo pipefail
          for key in awActivity awWorkplace awAudit awAction; do grep -q "$key" activity-workflow.js; done
          grep -q '② 활동관리' activity-workflow.js
          grep -q "title.textContent='④ Audit·유지'" hd20-five-area-integration.js
          grep -q "title.textContent='⑤ 개선조치'" hd20-five-area-integration.js

      - name: Verify advancement and audit semantics
        run: |
          set -euo pipefail
          grep -q 'function pickTeams' audit-random-draw.js
          grep -q 'batchId' audit-random-draw.js
          grep -q 'Audit 표본수가 미설정' audit-random-draw.js

      - name: Verify canonical data loss and recovery guards
        run: |
          set -euo pipefail
          grep -q "blocked empty canonical push" supabase-sync.js
          grep -q "remoteEmpty=Array.isArray(clean)&&clean.length===0" supabase-sync.js
          grep -q "production cleanup failed" web-validation-fixture.js
          grep -q "hd20PreRecoverySafetyBackupV1" web-validation-fixture.js
          grep -q "backup-has-no-production-data" web-validation-fixture.js
          grep -q "backup-not-richer-production" web-validation-fixture.js
          grep -q "nonProductionExcluded:true" web-validation-fixture.js
          grep -q "recoveryKind(row)" web-validation-fixture.js
          grep -q "document.querySelector('.app')||document.body" web-validation-fixture.js
          grep -q "id='hd20DataRecoveryNotice'" web-validation-fixture.js
          grep -q "if(cur!==0)return" web-validation-fixture.js
          grep -q "복구 원본 없음" web-validation-fixture.js
          grep -q "currentExcelImport" web-validation-fixture.js
          grep -q "web-validation-fixture.js?v=20261008-explicit-only1" index.html\n          grep -q "development-demo-mode.js?v=20261008-evidence11" index.html

      - name: Verify Supabase auth and sync wiring
        run: |
          set -euo pipefail
          grep -q 'supabase-auth.js' index.html
          grep -q 'supabase-sync.js' index.html
          grep -q "hd20_app_state" supabase-sync.js
          grep -q "canonical_v1" supabase-sync.js
          grep -q "hd20TeamLeaderMasterV1" supabase-sync.js
          grep -q 'DB 동기화' supabase-sync.js

      - name: Verify retired files stay retired
        run: |
          set -euo pipefail
          for f in maturity-seq-action-link.js demo-data-seed.js action-demo-seed.js audit-global-seed.js emergency-ui-stabilizer-v2.js register-tab-fill.js audit-admin-import.js crud-hotfix.js action-button-hotfix.js management.html v2-preview.html; do
            test ! -e "$f"
          done

