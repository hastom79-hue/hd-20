name: HD20 advancement navigation contract
on:
  push:
    branches: [main]
    paths:
      - 'hd20-subtabs.js'
      - 'theme-inspection.js'
      - 'theme-inspection-v5.css'
      - 'supabase-sync.js'
      - 'index.html'
      - '.github/workflows/advancement-judgment-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hd20-subtabs.js'
      - 'theme-inspection.js'
      - 'theme-inspection-v5.css'
      - 'supabase-sync.js'
      - 'index.html'
      - '.github/workflows/advancement-judgment-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advancement-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/adv-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/adv-http.log
          exit 1
      - name: Validate approved advancement navigation
        run: |
          cat > adv-check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          let diagnosticPage;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            diagnosticPage=page;
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('dialog',d=>d.accept());
            await page.route('**/*',route=>{
              const u=new URL(route.request().url());
              if(['127.0.0.1','localhost'].includes(u.hostname))return route.continue();
              if(route.request().resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:''});
              return route.abort();
            });
            await page.goto('http://127.0.0.1:4173/index.html?area=advancement&sub=standard',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.HD20_SUBNAV?.select,{timeout:20000});
            await page.evaluate(()=>document.getElementById('hd20Launcher')?.remove());
            await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="advancement"]')?.click());
            await page.waitForSelector('#hd20Subnav button[data-sub="standard"]',{state:'visible',timeout:12000});
            await page.evaluate(()=>window.HD20_SUBNAV.select('advancement','standard'));
            const nav=await page.locator('#hd20Subnav button').allTextContents();
            assert.equal(nav.length,1,'advancement must expose only the approved tab');
            assert.match(nav[0],/확정사례 관리/);
            assert.equal(await page.locator('#hd20Subnav button[data-sub="judge"]').count(),0,'retired immediate-judgement tab must not return');
            await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="theme"]')?.click());
            await page.waitForSelector('#awTheme .themeTabNav button[data-theme-view="plan"]',{state:'visible',timeout:12000});
            const themeTabs=await page.locator('#awTheme .themeTabNav button').allTextContents();
            assert.deepEqual(themeTabs,['점검계획·취약현황','현장점검 실시','미흡·개선조치 추적','재점검·이력'],'theme workflow tabs');
            const planBoxes=page.locator('#awTheme input[name="themePlanTheme"]');
            assert.equal(await planBoxes.count(),7,'seven 5S theme groups');
            for(let i=1;i<await planBoxes.count();i++)await planBoxes.nth(i).uncheck();
            await page.locator('#awTheme #themeSavePlanBtn').click();
            await page.locator('#awTheme button[data-theme-view="audit"]').click();
            await page.waitForSelector('#awTheme #themeChecklistWrap .themeCheckRow',{state:'visible',timeout:5000});
            const plannedRows=await page.locator('#awTheme #themeChecklistWrap .themeCheckRow').count();
            assert.ok(plannedRows>0&&plannedRows<23,'inspection checklist must follow the saved theme plan');
            await page.locator('#awTheme button[data-theme-view="actions"]').click();
            assert.equal(await page.locator('#awTheme .themePanel[data-theme-panel="actions"]:not([hidden])').count(),1,'action tracking view opens');
            await page.locator('#awTheme button[data-theme-view="history"]').click();
            assert.equal(await page.locator('#awTheme .themePanel[data-theme-panel="history"]:not([hidden])').count(),1,'history view opens');
            assert.deepEqual(errors,[],'browser errors');
            await page.screenshot({path:'advancement-navigation.png',fullPage:true});
            console.log('ADVANCEMENT_NAVIGATION_PASS',JSON.stringify({tabs:nav,retiredJudgeTabAbsent:true}));
            await browser.close();
          })().catch(async e=>{console.error('ADVANCEMENT_NAVIGATION_FAILED',e.stack||String(e));try{await diagnosticPage?.screenshot({path:'advancement-navigation.png',fullPage:true,timeout:5000})}catch(err){console.error('SCREENSHOT_FAILED',String(err))}process.exit(1)});
          NODE
          set -o pipefail
          node adv-check.cjs 2>&1 | tee advancement-navigation.log
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advancement-navigation-evidence
          path: |
            advancement-navigation.png
            advancement-navigation.log
          if-no-files-found: ignore
