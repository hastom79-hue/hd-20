name: HD20 chart evidence browser verification
on:
  push:
    branches: [fix/request-board-source-denominator-20261015, feat/dashboard-v3-integrated-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Static JS parsing
        run: node --check dashboard-section-tabs.js && node --check dashboard-priority-layout.js && node --check hd20-improve-board.js && node --check hd20-request-board.js
      - name: Start local site
        run: python3 -m http.server 4173 >/tmp/hd20-evidence-http.log 2>&1 &
      - name: Verify chart evidence controls in Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#hd20DashboardSectionTabs button[data-dashboard-section="summary"]',{timeout:12000});
            await page.waitForTimeout(1200);
            const v3Nav=await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section]').count();
            if(v3Nav!==5)throw Error('V3 dashboard navigation count mismatch: '+v3Nav);
            await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="summary"]').click();
            if(await page.locator('#hd20DashboardSectionTabs button.active').count()!==1)throw Error('V3 active navigation mismatch');
            const summaryStatus=await page.locator('#hd20DashboardPriority .hd20V3ReadinessMain').count();
            if(summaryStatus!==1)throw Error('V3 operational KPI readiness missing');
            const result={};
            for(const [name,id,nav] of [['improve','hd20ImproveBoard','improve'],['request','hd20RequestBoard','request']]){
              await page.evaluate(k=>{document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="'+k+'"]')?.click();},nav);
              await page.waitForTimeout(650);
              if(!(await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="'+nav+'"]').evaluate(el=>el.classList.contains('active'))))throw Error(name+' dashboard navigation did not activate');
              result[name]=await page.evaluate(id=>{
                const box=document.getElementById(id);
                const evidence=[...(box?.querySelectorAll('[data-evk]')||[])];
                return {exists:!!box,buttons:evidence.length,exportButtons:[...(box?.querySelectorAll('button')||[])].filter(b=>b.textContent.trim()==='엑셀 추출').length};
              },id);
              if(!result[name].exists||result[name].buttons<4||result[name].exportButtons!==result[name].buttons)throw Error(name+' evidence controls mismatch '+JSON.stringify(result[name]));
              result[name].charts=[];
              for(let i=0;i<result[name].buttons;i++){
                const button=page.locator('#'+id+' [data-evk]').nth(i);
                const key=await button.getAttribute('data-evk');
                await button.click({force:true});
                const modal=page.locator('#hd20BoardEvidence.on');
                await modal.waitFor({state:'visible',timeout:5000});
                const modalRows=await modal.locator('tbody tr').count();
                const countLabel=await modal.locator('.evHead span').innerText();
                const expectedRows=Number((countLabel.match(/^([0-9,]+)건/)||[])[1]?.replace(/,/g,''));
                if(!Number.isFinite(expectedRows)||!countLabel.match(/^[0-9,]+건/))throw Error(name+'/'+key+' modal row count unavailable: '+countLabel);
                const modalHeaders=await modal.locator('thead th').allTextContents();
                await modal.locator('[data-ev="close"]').click();
                const downloadPromise=page.waitForEvent('download',{timeout:8000});
                const exportButton=page.locator('#'+id+' [data-evk="'+key+'"] + button').first();
                await exportButton.click({force:true});
                const download=await downloadPromise;
                const fs=require('fs');const raw=fs.readFileSync(await download.path(),'utf8');
                const lines=raw.replace(/^\uFEFF/,'').trimEnd().split(/\r?\n/);
                const csvHeader=lines[0]||'';
                if(!raw.startsWith('\uFEFF')||!download.suggestedFilename().endsWith('.csv'))throw Error(name+'/'+key+' invalid CSV');
                if(name==='request'&&!csvHeader.includes('요청번호'))throw Error(name+'/'+key+' missing request ID header');
                if(modalHeaders.some(h=>!csvHeader.includes(h.trim())))throw Error(name+'/'+key+' modal/CSV headers differ');
                if(lines.length-1!==expectedRows)throw Error(name+'/'+key+' modal/CSV row count mismatch: '+expectedRows+' vs '+(lines.length-1));
                if(modalRows!==Math.min(200,expectedRows||1))throw Error(name+'/'+key+' rendered row count mismatch');
                result[name].charts.push({key,modalRows,csvRows:lines.length-1,filename:download.suggestedFilename()});
              }
            }
            console.log('EVIDENCE_RESULT',JSON.stringify({result,errors}));
            await browser.close();
          })().catch(e=>{console.error('EVIDENCE_FAIL',e);process.exit(1)});
          JS
