name: HD20 chart evidence browser verification
on:
  push:
    branches: [fix/request-board-source-denominator-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Static JS parsing
        run: node --check hd20-improve-board.js && node --check hd20-request-board.js
      - name: Start local site
        run: python3 -m http.server 4173 >/tmp/hd20-evidence-http.log 2>&1 &
      - name: Verify chart evidence controls in Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2500);
            const result={};
            for(const [name,id,nav] of [['improve','hd20ImproveBoard','improve'],['request','hd20RequestBoard','request']]){
              await page.evaluate(k=>{document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="'+k+'"]')?.click();},nav);
              await page.waitForTimeout(650);
              result[name]=await page.evaluate(id=>{
                const box=document.getElementById(id);
                const evidence=[...(box?.querySelectorAll('[data-evk]')||[])];
                return {exists:!!box,buttons:evidence.length,exportButtons:[...(box?.querySelectorAll('button')||[])].filter(b=>b.textContent.trim()==='엑셀 추출').length};
              },id);
              if(result[name].buttons<4||result[name].exportButtons!==result[name].buttons)throw Error(name+' evidence controls mismatch '+JSON.stringify(result[name]));
              const button=page.locator('#'+id+' [data-evk]').first();
              await button.click({force:true});
              await page.waitForTimeout(250);
              const visible=await page.locator('#hd20EvidenceModal.on, #hd20EvidenceRows.on, [id*="Evidence"].on').count();
              result[name].modalVisible=visible;
              await page.keyboard.press('Escape');
              const download=page.waitForEvent('download',{timeout:8000});
              await page.locator('#'+id+' button').filter({hasText:'엑셀 추출'}).first().click({force:true});
              const file=await download;
              result[name].download=file.suggestedFilename();
              if(!result[name].download.endsWith('.csv'))throw Error(name+' non-CSV download');
            }
            console.log('EVIDENCE_RESULT',JSON.stringify({result,errors}));
            await browser.close();
          })().catch(e=>{console.error('EVIDENCE_FAIL',e);process.exit(1)});
          JS
