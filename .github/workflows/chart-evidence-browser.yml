name: HD20 chart evidence browser verification
on:
  push:
    branches: [fix/request-board-source-denominator-20261015, feat/dashboard-v3-integrated-20261016, feat/execution-v4-rebuild-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Static JS parsing
        run: node --check hd20-v3-execution.js && node --check dashboard-section-tabs.js && node --check dashboard-priority-layout.js && node --check hd20-improve-board.js && node --check hd20-request-board.js
      - name: Start local site
        run: python3 -m http.server 4173 >/tmp/hd20-evidence-http.log 2>&1 &
      - name: Verify chart evidence controls in Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#hd20DashboardSectionTabs button[data-dashboard-section="summary"]',{timeout:12000});
            await page.waitForTimeout(1200);
            const v3Nav=await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section]').count();
            if(v3Nav!==5)throw Error('V3 dashboard navigation count mismatch: '+v3Nav);
            await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="summary"]').click();
            if(await page.locator('#hd20DashboardSectionTabs button.active').count()!==1)throw Error('V3 active navigation mismatch');
            const summaryStatus=await page.locator('#hd20DashboardPriority .hd20V3ReadinessMain').count();
            if(summaryStatus!==1)throw Error('V3 operational KPI readiness missing');
            const result={};
            const fs=require('fs');fs.mkdirSync('v3-browser-evidence',{recursive:true});
            const summaryLayout=await page.evaluate(()=>{
              const nav=document.getElementById('hd20DashboardSectionTabs');
              const priority=document.getElementById('hd20DashboardPriority');
              const readiness=priority?.querySelector('.hd20V3Readiness');
              const cards=[...(document.querySelector('.cards')?.children||[])];
              const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().width>0;
              return {navVisible:visible(nav),priorityVisible:visible(priority),readinessVisible:visible(readiness),kpiCards:priority?.querySelectorAll('.hd20HealthKpi').length||0,summaryCards:cards.length,overflow:document.documentElement.scrollWidth>innerWidth+4};
            });
            if(!summaryLayout.navVisible||!summaryLayout.priorityVisible||!summaryLayout.readinessVisible||summaryLayout.kpiCards!==6||summaryLayout.overflow)throw Error('V3 summary layout invalid '+JSON.stringify(summaryLayout));
            fs.writeFileSync('v3-browser-evidence/layout.json',JSON.stringify({summary:summaryLayout},null,2));
            await page.screenshot({path:'v3-browser-evidence/01-summary.png',fullPage:true});
            for(const [name,id,nav] of [['improve','hd20ImproveBoard','improve'],['request','hd20RequestBoard','request']]){
              await page.evaluate(k=>{document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="'+k+'"]')?.click();},nav);
              await page.waitForTimeout(650);
              if(!(await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="'+nav+'"]').evaluate(el=>el.classList.contains('active'))))throw Error(name+' dashboard navigation did not activate');
              result[name]=await page.evaluate(id=>{
                const box=document.getElementById(id);
                const evidence=[...(box?.querySelectorAll('[data-evk]')||[])];
                return {exists:!!box,buttons:evidence.length,exportButtons:[...(box?.querySelectorAll('button')||[])].filter(b=>b.textContent.trim()==='엑셀 추출').length};
              },id);
              if(!result[name].exists||result[name].buttons<4||result[name].exportButtons!==result[name].buttons)throw Error(name+' evidence controls mismatch '+JSON.stringify(result[name]));
              const tabLayout=await page.evaluate(id=>{const el=document.getElementById(id),r=el?.getBoundingClientRect();return {visible:!!el&&getComputedStyle(el).display!=='none'&&r.width>0,panels:el?.querySelectorAll('.ibPanel').length||0,overflow:document.documentElement.scrollWidth>innerWidth+4};},id);
              if(!tabLayout.visible||tabLayout.panels<4||tabLayout.overflow)throw Error(name+' V3 panel layout invalid '+JSON.stringify(tabLayout));
              result[name]={...result[name],layout:tabLayout};
              await page.screenshot({path:'v3-browser-evidence/'+(name==='improve'?'02-improve':'03-request')+'.png',fullPage:true});
              result[name].charts=[];
              const keys=await page.locator('#'+id+' [data-evk]').evaluateAll(els=>els.map(el=>el.dataset.evk));
              if(new Set(keys).size!==keys.length)throw Error(name+' duplicate chart evidence keys: '+keys.join(','));
              for(let i=0;i<result[name].buttons;i++){
                const button=page.locator('#'+id+' [data-evk]').nth(i);
                const key=await button.getAttribute('data-evk');
                await button.click({force:true});
                const modal=page.locator('#hd20BoardEvidence.on');
                await modal.waitFor({state:'visible',timeout:5000});
                const modalRows=await modal.locator('tbody tr').count();
                const countLabel=await modal.locator('.evHead span').innerText();
                const expectedRows=Number((countLabel.match(/^([0-9,]+)건/)||[])[1]?.replace(/,/g,''));
                if(!Number.isFinite(expectedRows)||!countLabel.match(/^[0-9,]+건/))throw Error(name+'/'+key+' modal row count unavailable: '+countLabel);
                const modalHeaders=await modal.locator('thead th').allTextContents();
                await modal.locator('[data-ev="close"]').click();
                const downloadPromise=page.waitForEvent('download',{timeout:8000});
                const exportButton=page.locator('#'+id+' [data-evk="'+key+'"] + button').first();
                await exportButton.click({force:true});
                const download=await downloadPromise;
                const fs=require('fs');const raw=fs.readFileSync(await download.path(),'utf8');
                const lines=raw.replace(/^\uFEFF/,'').trimEnd().split(/\r?\n/);
                const csvHeader=lines[0]||'';
                if(!raw.startsWith('\uFEFF')||!download.suggestedFilename().endsWith('.csv'))throw Error(name+'/'+key+' invalid CSV');
                if(name==='request'&&!csvHeader.includes('요청번호'))throw Error(name+'/'+key+' missing request ID header');
                if(modalHeaders.some(h=>!csvHeader.includes(h.trim())))throw Error(name+'/'+key+' modal/CSV headers differ');
                if(lines.length-1!==expectedRows)throw Error(name+'/'+key+' modal/CSV row count mismatch: '+expectedRows+' vs '+(lines.length-1));
                if(modalRows!==Math.min(200,expectedRows||1))throw Error(name+'/'+key+' rendered row count mismatch');
                result[name].charts.push({key,modalRows,csvRows:lines.length-1,filename:download.suggestedFilename()});
              }
            }
            if(errors.length)throw Error('Browser JS errors: '+errors.join(' | '));
            fs.writeFileSync('v3-browser-evidence/result.json',JSON.stringify({result,errors},null,2));
            const executionCards=await page.evaluate(()=>{const el=document.getElementById('hd20V3Execution');return {exists:!!el,kpis:el?.querySelectorAll('[data-execution-kpi]').length||0,panels:el?.querySelectorAll('.v3exPanel').length||0}});
            if(!executionCards.exists||executionCards.kpis!==6||executionCards.panels<6)throw Error('Approved execution V3 sections missing '+JSON.stringify(executionCards));
            result.executionV3=executionCards;
            const v4Labels=await page.locator('#hd20V3Execution [data-execution-kpi] small').allTextContents();
            const required=['계획 실행 이행률','Audit 수행률','미완료 개선조치','기한 초과 조치','효과 검증 완료율','유지 이탈·재발'];
            if(JSON.stringify(v4Labels)!==JSON.stringify(required))throw Error('V4 KPI contract mismatch '+JSON.stringify(v4Labels));
            result.executionV4={labels:v4Labels};
            // Master integration: policy remains editable but the legacy policy tab is not visible.
            await page.evaluate(()=>window.HD20_NAV?.go?.('master'));
            await page.waitForTimeout(250);
            const masterPolicy=await page.evaluate(()=>{
              const factor=document.querySelector('#masterModal [data-master-tab="integrated-factor"]');
              factor?.click();
              const panel=document.getElementById('hd20OperatingPolicyPanel');
              const legacy=document.querySelector('#masterModal [data-master-tab="policy"]');
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0;
              return {factor:visible(factor),policyPanel:visible(panel),sample:!!panel?.querySelector('[data-op-sample]'),save:!!panel?.querySelector('button'),legacyVisible:visible(legacy)};
            });
            if(!masterPolicy.factor||!masterPolicy.policyPanel||!masterPolicy.sample||!masterPolicy.save||masterPolicy.legacyVisible)throw Error('Integrated master policy regression '+JSON.stringify(masterPolicy));
            result.masterPolicy=masterPolicy;
            await page.evaluate(()=>window.HD20_NAV?.go?.('dashboard'));
            await page.waitForTimeout(180);
            // URL-selected dashboard tab must survive reset (navigation re-entry/pageshow).
            await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="execution"]').click();
            await page.evaluate(()=>window.HD20_DASHBOARD_TABS.reset());
            const restored=await page.evaluate(()=>window.HD20_DASHBOARD_TABS.active());
            if(restored!=='execution')throw Error('V4 dashboard URL section reset failed: '+restored);
            result.sectionRestore=restored;
            const legacyBridgeVisible=await page.evaluate(()=>{const el=document.getElementById('hd20OperationalBridge');return !!el&&getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0});
            if(legacyBridgeVisible)throw Error('Legacy operational bridge duplicated in V4');
            // Verify tab ownership: only the selected section's main target is visible.
            const ownership=[['summary','#hd20DashboardPriority'],['improve','#hd20ImproveBoard'],['request','#hd20RequestBoard'],['execution','#hd20V3Execution'],['analysis','#hd20OpsTrend']];
            result.tabIsolation={};
            for(const [key] of ownership){
              await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="'+key+'"]').click();
              await page.waitForTimeout(120);
              const states=await page.evaluate(entries=>Object.fromEntries(entries.map(([name,selector])=>{
                const el=document.querySelector(selector);
                if(!el)return [name,'missing'];
                const css=getComputedStyle(el),rect=el.getBoundingClientRect();
                return [name,css.display!=='none'&&css.visibility!=='hidden'&&rect.width>0&&rect.height>0];
              })),ownership);
              if(states[key]!==true)throw Error('V3 '+key+' target not visible '+JSON.stringify(states));
              for(const [other] of ownership){if(other!==key&&states[other]===true)throw Error('V3 tab isolation leak '+key+' -> '+other+' '+JSON.stringify(states));}
              result.tabIsolation[key]=states;
            }
            // Verify specialist tabs are reachable without mutating operational data.
            result.specialist={};
            for(const [key,selector,file] of [['execution','#hd20V3Execution','04-execution'],['analysis','#hd20OpsTrend','05-analysis']]){
              await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section="'+key+'"]').click();
              await page.waitForTimeout(500);
              const state=await page.evaluate(sel=>{
                const el=document.querySelector(sel);
                const r=el?.getBoundingClientRect();
                return {exists:!!el,visible:!!el&&getComputedStyle(el).display!=='none'&&r.width>0,overflow:document.documentElement.scrollWidth>innerWidth+4};
              },selector);
              if(!state.exists||!state.visible||state.overflow)throw Error('V3 specialist '+key+' layout invalid '+JSON.stringify(state));
              result.specialist[key]=state;
              await page.screenshot({path:'v3-browser-evidence/'+file+'.png',fullPage:true});
            }
            fs.writeFileSync('v3-browser-evidence/result.json',JSON.stringify({result,errors},null,2));
            console.log('EVIDENCE_RESULT',JSON.stringify({result,errors}));
            await browser.close();
          })().catch(e=>{console.error('EVIDENCE_FAIL',e);process.exit(1)});
          JS

      - name: Upload V3 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-v3-browser-evidence
          path: v3-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
