name: HD-20 Live Browser Navigation E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/pages-browser-smoke.py'
      - '.github/workflows/pages-browser-e2e.yml'
permissions:
  contents: read
jobs:
  readonly-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Validate Python syntax
        run: python -m py_compile tests/pages-browser-smoke.py
      - name: Run live read-only browser smoke
        env:
          HD20_PAGES_URL: https://hastom79-hue.github.io/hd-20/
          HD20_E2E_EMAIL: ${{ secrets.HD20_E2E_EMAIL }}
        run: |
          if [ -z "$HD20_E2E_EMAIL" ]; then
            echo "Authenticated navigation E2E: NOT RUN (HD20_E2E_EMAIL not set)" >> "$GITHUB_STEP_SUMMARY"
            echo "Public auth gate is tested, but do not report navigation E2E as PASS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Authorized company-mail test identity configured: will test navigation." >> "$GITHUB_STEP_SUMMARY"
          fi
          python tests/pages-browser-smoke.py
