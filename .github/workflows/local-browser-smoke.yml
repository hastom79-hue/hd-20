name: HD-20 Local Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'beginner-navigation.js'
      - 'audit-as-is-to-be-manager.js'
      - 'hd20-subtabs.js'
      - 'tests/local-browser-smoke.py'
      - '.github/workflows/local-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test runtime
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Check test syntax
        run: python -m py_compile tests/local-browser-smoke.py
      - name: Run local read-only E2E
        env:
          HD20_LOCAL_URL: http://127.0.0.1:8765/
        run: |
          set -eu
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/hd20-loopback.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/local-browser-smoke.py
