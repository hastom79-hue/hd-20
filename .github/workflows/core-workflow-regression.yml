name: HD-20 Core Workflow Regression
on:
  push:
    branches: [main]
    paths:
      - 'audit-as-is-to-be-manager.js'
      - 'action-register-modal.js'
      - 'activity-register-modal.js'
      - 'activity-workflow.js'
      - 'action-mail-workflow.js'
      - 'audit-closed-loop-workflow.js'
      - 'hd20-cross-tab-sync.js'
      - 'master-workspace-v2.js'
      - 'operating-policy-master.js'
      - 'hd20-subtabs.js'
      - 'beginner-navigation.js'
      - 'landing-launcher.js'
      - 'retention-recheck-integrity-guard.js'
      - 'retention-draw-integrity-guard.js'
      - 'theme-inspection.js'
      - 'tests/tobe-unique-action-id-smoke.cjs'
      - 'tests/tobe-persistence-rollback-smoke.cjs'
      - 'tests/tobe-latest-evidence-smoke.cjs'
      - 'tests/tobe-search-debounce-smoke.cjs'
      - 'tests/tobe-modal-lifecycle-smoke.cjs'
      - 'tests/tobe-completion-chronology-smoke.cjs'
      - 'tests/tobe-completion-state-smoke.cjs'
      - 'tests/tobe-source-conflict-smoke.cjs'
      - 'tests/retention-recheck-integrity-smoke.cjs'
      - 'tests/retention-persisted-link-smoke.cjs'
      - 'tests/retention-history-consistency-smoke.cjs'
      - 'tests/retention-recheck-click-smoke.cjs'
      - 'tests/retention-followup-dedup-rollback-smoke.cjs'
      - 'tests/retention-recheck-transaction-smoke.cjs'
      - 'tests/retention-draw-integrity-smoke.cjs'
      - 'tests/retention-verdict-origin-smoke.cjs'
      - 'tests/retention-verdict-persistence-smoke.cjs'
      - 'tests/retention-evaluator-identity-smoke.cjs'
      - 'tests/retention-draw-schedule-smoke.cjs'
      - 'tests/theme-row-click-regression.cjs'
      - 'tests/theme-persisted-audit-record-smoke.cjs'
      - 'tests/theme-duplicate-active-action-smoke.cjs'
      - 'tests/theme-reused-action-provenance-smoke.cjs'
      - 'tests/theme-persisted-relink-smoke.cjs'
      - 'tests/activity-navigation-late-overview-smoke.cjs'
      - 'tests/launcher-registration-subtab-retry-smoke.cjs'
      - 'tests/audit-subtab-click-guard-smoke.cjs'
      - 'tests/pages-workflow-structure-smoke.cjs'
      - '.github/workflows/core-workflow-regression.yml'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check audit-as-is-to-be-manager.js
          node --check hd20-subtabs.js
          node --check beginner-navigation.js
          node --check landing-launcher.js
          node --check retention-recheck-integrity-guard.js
          node --check retention-draw-integrity-guard.js
          node --check theme-inspection.js
          for file in \
            tests/tobe-unique-action-id-smoke.cjs \
            tests/tobe-persistence-rollback-smoke.cjs \
            tests/tobe-latest-evidence-smoke.cjs \
            tests/tobe-search-debounce-smoke.cjs \
            tests/tobe-modal-lifecycle-smoke.cjs \
            tests/tobe-completion-chronology-smoke.cjs \
            tests/tobe-completion-state-smoke.cjs \
            tests/tobe-source-conflict-smoke.cjs \
            tests/retention-recheck-integrity-smoke.cjs \
            tests/retention-persisted-link-smoke.cjs \
            tests/retention-history-consistency-smoke.cjs \
            tests/retention-recheck-click-smoke.cjs \
            tests/retention-followup-dedup-rollback-smoke.cjs \
            tests/retention-recheck-transaction-smoke.cjs \
            tests/retention-draw-integrity-smoke.cjs \
            tests/retention-verdict-origin-smoke.cjs \
            tests/retention-verdict-persistence-smoke.cjs \
            tests/retention-evaluator-identity-smoke.cjs \
            tests/retention-draw-schedule-smoke.cjs \
            tests/theme-row-click-regression.cjs \
            tests/theme-persisted-audit-record-smoke.cjs \
            tests/theme-duplicate-active-action-smoke.cjs \
            tests/theme-reused-action-provenance-smoke.cjs \
            tests/theme-persisted-relink-smoke.cjs \
            tests/activity-navigation-late-overview-smoke.cjs \
            tests/launcher-registration-subtab-retry-smoke.cjs \
            tests/audit-subtab-click-guard-smoke.cjs \
            tests/pages-workflow-structure-smoke.cjs
          do
            node --check "$file"
          done
      - name: Execute 28 core workflow regressions
        run: |
          set -e
          node tests/tobe-unique-action-id-smoke.cjs
          node tests/tobe-persistence-rollback-smoke.cjs
          node tests/tobe-latest-evidence-smoke.cjs
          node tests/tobe-search-debounce-smoke.cjs
          node tests/tobe-modal-lifecycle-smoke.cjs
          node tests/tobe-completion-chronology-smoke.cjs
          node tests/tobe-completion-state-smoke.cjs
          node tests/tobe-source-conflict-smoke.cjs
          node tests/retention-recheck-integrity-smoke.cjs
          node tests/retention-persisted-link-smoke.cjs
          node tests/retention-history-consistency-smoke.cjs
          node tests/retention-recheck-click-smoke.cjs
          node tests/retention-followup-dedup-rollback-smoke.cjs
          node tests/retention-recheck-transaction-smoke.cjs
          node tests/retention-draw-integrity-smoke.cjs
          node tests/retention-verdict-origin-smoke.cjs
          node tests/retention-verdict-persistence-smoke.cjs
          node tests/retention-evaluator-identity-smoke.cjs
          node tests/retention-draw-schedule-smoke.cjs
          node tests/theme-row-click-regression.cjs
          node tests/theme-persisted-audit-record-smoke.cjs
          node tests/theme-duplicate-active-action-smoke.cjs
          node tests/theme-reused-action-provenance-smoke.cjs
          node tests/theme-persisted-relink-smoke.cjs
          node tests/activity-navigation-late-overview-smoke.cjs
          node tests/launcher-registration-subtab-retry-smoke.cjs
          node tests/audit-subtab-click-guard-smoke.cjs
          node tests/pages-workflow-structure-smoke.cjs
