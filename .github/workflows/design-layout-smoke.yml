name: HD20 design layout smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify five-area desktop, mobile and modal layout
        run: |
          python3 -m http.server 4173 >/tmp/hd20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{name:'desktop',width:1440,height:1000},{name:'desktop-125pct-equivalent',width:1152,height:800},{name:'tablet',width:900,height:900},{name:'mobile',width:375,height:812}];
            const tabs=['dashboard','activity','advancement','audit','action'];
            const expectedKpis=['공식 판정 완료율','평균 판정 Lead Time','고도화 수준','Audit 후 6개월 유지율','Audit 부적합 재발률','기한 내 개선조치 완료율'];
            const advancementLevels=['1개 조건 충족 영역','2개 이상 충족 영역','3개 모두 충족 영역'];
            for(const vp of cases){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('dialog',d=>d.accept());
              await page.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});return route.abort('blockedbyclient')});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:20000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardPriority'),{},{timeout:20000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardSectionTabs'),{},{timeout:20000});
              const cssContract=await page.evaluate(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>new URL(x.href).pathname.split('/').pop()));
              const expectedCss=['styles.css','hd20-overhaul.css','hd20-five-area.css','dashboard-priority-groups.css','workflow-area-density.css','maturity-condition-analysis.css','hd20-subtabs.css','hd20-ops-v2.css','supabase-auth.css'];
              if(JSON.stringify(cssContract)!==JSON.stringify(expectedCss)) throw new Error(`${vp.name}: stylesheet contract=${JSON.stringify(cssContract)}`);
              if(cssContract.some(x=>/mobile-runtime-restore|hotfix|polish/i.test(x))) throw new Error(`${vp.name}: retired stylesheet leaked ${JSON.stringify(cssContract)}`);
              const navCount=await page.locator('.beginnerNav button[data-key]').count(); if(navCount!==5) throw new Error(`${vp.name}: nav count=${navCount}`);
              for(const key of tabs){
                await page.evaluate(k=>document.querySelector(`.beginnerNav button[data-key="${k}"]`)?.click(),key); await page.waitForTimeout(350);
                const state=await page.evaluate((key)=>{const de=document.documentElement,body=document.body;const active=document.querySelector('.beginnerNav button.active')?.dataset.key||'';const visible=[...document.querySelectorAll('.awScreen.on,#performanceConversionAnalysis.on')].filter(el=>getComputedStyle(el).display!=='none');const headers=visible.reduce((n,el)=>n+el.querySelectorAll(':scope > .hd20AreaHeader').length,0);const shown=sel=>{const el=document.querySelector(sel);return !!el&&!el.hidden&&getComputedStyle(el).display!=='none'&&el.getClientRects().length>0};const critical=[...document.querySelectorAll('.beginnerNav button,.hd20AreaHeader,.awHero,.awCard,.card,#hd20DashboardPriority,#hd20OperationalBridge,#hd20MaturityConditionAnalysis')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length).map(el=>{const r=el.getBoundingClientRect();return {tag:el.id||el.className||el.tagName,left:r.left,right:r.right,width:r.width,height:r.height}});return {key,active,scrollY:window.scrollY,scrollWidth:Math.max(de.scrollWidth,body.scrollWidth),clientWidth:de.clientWidth,headers,priority:shown('#hd20DashboardPriority'),bridge:shown('#hd20OperationalBridge'),labels:[...document.querySelectorAll('.hd20DashboardSectionLabel')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length>0).length,activity:shown('#awActivity .awGrid'),advancement:shown('#awWorkplace'),maturity:shown('#hd20MaturityConditionAnalysis .mcaLevelRail'),auditExecution:shown('#awAudit .auditDraw')||shown('#awAudit .auditClosedLoop')||shown('#awAudit .awCard'),auditHero:shown('#awAudit > .awHero'),action:shown('#awAction .amGrid'),actionHero:shown('#awAction > .awHero'),critical};},key);
                if(state.active!==key) throw new Error(`${vp.name}/${key}: active=${state.active}`); if(vp.width>=1152){const content=state.critical.filter(r=>!String(r.tag).includes('beginnerNav'));if(content.length){const left=Math.min(...content.map(r=>r.left)),right=Math.max(...content.map(r=>r.right)),span=right-left;if(span<vp.width*.68)throw new Error(`${vp.name}/${key}: one-sided desktop layout span=${Math.round(span)} viewport=${vp.width}`);}} if(state.scrollY>2) throw new Error(`${vp.name}/${key}: tab switch scrollY=${state.scrollY}`); if(state.scrollWidth>state.clientWidth+2) throw new Error(`${vp.name}/${key}: horizontal overflow ${state.scrollWidth}>${state.clientWidth}`);
                const bad=state.critical.find(r=>r.width<=0||r.height<=0||r.left<-2||r.right>vp.width+2); if(bad) throw new Error(`${vp.name}/${key}: critical box out of viewport ${JSON.stringify(bad)}`); if(['activity','advancement'].includes(key)&&state.headers!==1) throw new Error(`${vp.name}/${key}: area header count=${state.headers}`); if(['audit','action'].includes(key)&&state.headers!==0) throw new Error(`${vp.name}/${key}: duplicate area header count=${state.headers}`); if(key==='activity'&&!state.activity) throw new Error(`${vp.name}/activity: activity grid missing`);
                if(key==='advancement'){if(!state.advancement||!state.maturity) throw new Error(`${vp.name}/advancement: workplace/maturity layer missing`);const levelLabels=await page.locator('#hd20MaturityConditionAnalysis .mcaLevelRail article b').allTextContents();for(const label of advancementLevels)if(!levelLabels.includes(label))throw new Error(`${vp.name}/advancement: missing level ${label}`);}
                if(key==='audit'&&(!state.auditExecution||!state.auditHero)) throw new Error(`${vp.name}/audit: active audit execution/hero missing`); if(key==='action'&&(!state.action||!state.actionHero)) throw new Error(`${vp.name}/action: action case/hero missing`);
                if(key==='dashboard'){if(!state.priority||state.bridge)throw new Error(`${vp.name}/dashboard-summary: visibility contract priority=${state.priority} bridge=${state.bridge}`);const count=await page.locator('#hd20DashboardPriority .hd20HealthKpi').count();if(count!==6)throw new Error(`${vp.name}/dashboard: operational KPI count=${count}`);const labels=await page.locator('#hd20DashboardPriority .hd20HealthKpiBody small').allTextContents();for(const label of expectedKpis)if(!labels.includes(label))throw new Error(`${vp.name}/dashboard: missing KPI ${label}`);}else if(state.priority||state.bridge||state.labels)throw new Error(`${vp.name}/${key}: dashboard-only layer leaked`);
              }
              await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="dashboard"]')?.click());
              await page.waitForFunction(()=>!!document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="execution"]'),{},{timeout:10000});
              await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="execution"]')?.click()); await page.waitForTimeout(200);
              const execution=await page.evaluate(()=>{const shown=sel=>{const el=document.querySelector(sel);return !!el&&getComputedStyle(el).display!=='none'&&el.getClientRects().length>0};return {active:window.HD20_DASHBOARD_TABS?.active?.(),priority:shown('#hd20DashboardPriority'),bridge:shown('#hd20OperationalBridge')};});
              if(execution.active!=='execution'||execution.priority||!execution.bridge) throw new Error(`${vp.name}: execution dashboard contract ${JSON.stringify(execution)}`);
              await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="standard"]')?.click()); await page.waitForTimeout(200);
              const standard=await page.evaluate(()=>{const grid=document.querySelector('.bottomGrid');const kids=[...grid.children].filter(el=>getComputedStyle(el).display!=='none');const gr=grid.getBoundingClientRect();const boxes=kids.map(el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}});const chain=[];for(let el=grid;el&&chain.length<8;el=el.parentElement){const s=getComputedStyle(el),r=el.getBoundingClientRect();chain.push({tag:el.id||el.className||el.tagName,display:s.display,visibility:s.visibility,hidden:!!el.hidden,className:String(el.className||''),width:r.width,height:r.height});}const allKids=[...grid.children].map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return {tag:el.id||el.className||el.tagName,display:s.display,visibility:s.visibility,hidden:!!el.hidden,className:String(el.className||''),width:r.width,height:r.height};});return {active:window.HD20_DASHBOARD_TABS?.active?.(),gridWidth:gr.width,viewport:innerWidth,boxes,chain,allKids};});
              console.log('STANDARD_VISIBILITY_DETAIL',JSON.stringify({vp:vp.name,...standard}));
              if(standard.active!=='standard'||standard.boxes.length!==2) throw new Error(`${vp.name}: standard dashboard contract ${JSON.stringify(standard)}`);
              if(vp.width>1100){const [a,b]=standard.boxes;if(Math.abs(a.width-b.width)>4||a.width<standard.gridWidth*.45||b.width<standard.gridWidth*.45)throw new Error(`${vp.name}: standard dashboard unbalanced ${JSON.stringify(standard)}`);}else if(standard.boxes.some(b=>b.width<standard.gridWidth-4))throw new Error(`${vp.name}: standard dashboard mobile/tablet width ${JSON.stringify(standard)}`);
              await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]')?.click()); await page.waitForTimeout(200);
              const maturity=await page.evaluate(()=>{const el=document.getElementById('hd20MaturityMapTab');return {active:window.HD20_DASHBOARD_TABS?.active?.(),nav:window.HD20_NAV?.active?.(),visible:!!el&&!el.hidden&&getComputedStyle(el).display!=='none',standalone:!!document.querySelector('.beginnerNav button[data-key="maturitymap"]')};}); if(maturity.active!=='maturity'||maturity.nav!=='dashboard'||!maturity.visible||maturity.standalone) throw new Error(`${vp.name}: maturity dashboard contract ${JSON.stringify(maturity)}`);
              const hasMasterModal=await page.evaluate(()=>!!document.querySelector('#masterModal .modalBox')); if(hasMasterModal){await page.evaluate(()=>document.getElementById('openMaster')?.click()); await page.waitForTimeout(150); const modal=await page.evaluate(()=>{const overlay=document.querySelector('#masterModal'),box=document.querySelector('#masterModal .modalBox');const r=box?.getBoundingClientRect();const s=overlay?getComputedStyle(overlay):null;return {visible:!!overlay&&s.display!=='none'&&overlay.getClientRects().length>0,left:r?.left??-1,right:r?.right??-1,top:r?.top??-1,bottom:r?.bottom??-1,width:r?.width??0,height:r?.height??0,viewportW:innerWidth,viewportH:innerHeight};}); if(!modal.visible||modal.width<=0||modal.height<=0||modal.left<-2||modal.right>modal.viewportW+2||modal.top<-2||modal.bottom>modal.viewportH+2) throw new Error(`${vp.name}/modal: invalid ${JSON.stringify(modal)}`);} if(errors.length) throw new Error(`${vp.name}: page errors: ${errors.join(' | ')}`); await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE