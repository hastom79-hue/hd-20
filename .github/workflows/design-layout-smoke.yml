name: HD20 design layout smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify five-area desktop, mobile and modal layout
        run: |
          python3 -m http.server 4173 >/tmp/hd20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'desktop',width:1440,height:1000},
              {name:'desktop-125pct-equivalent',width:1152,height:800},
              {name:'tablet',width:900,height:900},
              {name:'mobile',width:375,height:812}
            ];
            const tabs=['dashboard','activity','advancement','audit','action'];
            const expectedKpis=['공식 판정 완료율','평균 판정 Lead Time','고도화 수준','Audit 후 6개월 유지율','Audit 부적합 재발률','기한 내 개선조치 완료율'];
            for(const vp of cases){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('dialog',d=>d.accept());
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
              const cssContract=await page.evaluate(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>new URL(x.href).pathname.split('/').pop()));
              const expectedCss=['styles.css','hd20-overhaul.css','hd20-five-area.css','dashboard-priority-groups.css','workflow-area-density.css','maturity-condition-analysis.css'];
              if(JSON.stringify(cssContract)!==JSON.stringify(expectedCss)) throw new Error(`${vp.name}: stylesheet contract=${JSON.stringify(cssContract)}`);
              if(cssContract.some(x=>/mobile-runtime-restore|hotfix|polish/i.test(x))) throw new Error(`${vp.name}: retired stylesheet leaked ${JSON.stringify(cssContract)}`);
              const navCount=await page.locator('.beginnerNav button[data-key]').count();
              if(navCount!==5) throw new Error(`${vp.name}: nav count=${navCount}`);
              for(const key of tabs){
                await page.locator(`.beginnerNav button[data-key="${key}"]`).click();
                await page.waitForTimeout(450);
                const state=await page.evaluate((key)=>{
                  const de=document.documentElement,body=document.body;
                  const active=document.querySelector('.beginnerNav button.active')?.dataset.key||'';
                  const visible=[...document.querySelectorAll('.awScreen.on,#performanceConversionAnalysis.on')].filter(el=>getComputedStyle(el).display!=='none');
                  const headers=visible.reduce((n,el)=>n+el.querySelectorAll(':scope > .hd20AreaHeader').length,0);
                  const shown=sel=>{const el=document.querySelector(sel);return !!el&&getComputedStyle(el).display!=='none'&&el.getClientRects().length>0};
                  const critical=[...document.querySelectorAll('.beginnerNav button,.hd20AreaHeader,.awHero,.awCard,.card,#hd20DashboardPriority,#hd20OperationalBridge')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length).map(el=>{const r=el.getBoundingClientRect();return {tag:el.id||el.className||el.tagName,left:r.left,right:r.right,width:r.width,height:r.height}});
                  return {key,active,scrollY:window.scrollY,scrollWidth:Math.max(de.scrollWidth,body.scrollWidth),clientWidth:de.clientWidth,headers,priority:shown('#hd20DashboardPriority'),bridge:shown('#hd20OperationalBridge'),labels:[...document.querySelectorAll('.hd20DashboardSectionLabel')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length>0).length,activity:shown('#awActivity .awGrid'),advancement:shown('#awWorkplace'),audit:shown('#awAudit .awAuditLane'),action:shown('#awAction .amGrid'),critical};
                },key);
                if(state.active!==key) throw new Error(`${vp.name}/${key}: active=${state.active}`);
                if(state.scrollY>2) throw new Error(`${vp.name}/${key}: tab switch scrollY=${state.scrollY}`);
                if(state.scrollWidth>state.clientWidth+2) throw new Error(`${vp.name}/${key}: horizontal overflow ${state.scrollWidth}>${state.clientWidth}`);
                const bad=state.critical.find(r=>r.width<=0||r.height<=0||r.left<-2||r.right>vp.width+2);
                if(bad) throw new Error(`${vp.name}/${key}: critical box out of viewport ${JSON.stringify(bad)}`);
                if(key!=='dashboard' && state.headers!==1) throw new Error(`${vp.name}/${key}: area header count=${state.headers}`);
                if(key==='activity'&&!state.activity) throw new Error(`${vp.name}/activity: activity grid missing`);
                if(key==='advancement'&&!state.advancement) throw new Error(`${vp.name}/advancement: workplace layer missing`);
                if(key==='audit'){
                  if(!state.audit) throw new Error(`${vp.name}/audit: audit lifecycle lane missing`);
                  const flow=await page.locator('#awAudit>.awAuditLane').evaluate(el=>getComputedStyle(el,'::before').content);
                  if(!flow.includes('Audit 실시(D-Day)')||!flow.includes('+6개월 지속관리')||!flow.includes('종료평가')) throw new Error(`${vp.name}/audit: lifecycle semantic contract=${flow}`);
                }
                if(key==='action'){
                  if(!state.action) throw new Error(`${vp.name}/action: action case grid missing`);
                  const flow=await page.locator('#awAction>.amHeroNote').evaluate(el=>getComputedStyle(el,'::before').content);
                  for(const term of ['BEFORE','문제정의','개선조치','AFTER','효과검증','재발관리']) if(!flow.includes(term)) throw new Error(`${vp.name}/action: missing ${term} in flow ${flow}`);
                }
                if(key==='dashboard'){
                  if(!state.priority||!state.bridge) throw new Error(`${vp.name}/dashboard: dashboard priority/detail layer missing`);
                  const count=await page.locator('#hd20DashboardPriority .hd20HealthKpi').count();
                  if(count!==6) throw new Error(`${vp.name}/dashboard: operational KPI count=${count}`);
                  const labels=await page.locator('#hd20DashboardPriority .hd20HealthKpiBody small').allTextContents();
                  for(const label of expectedKpis) if(!labels.includes(label)) throw new Error(`${vp.name}/dashboard: missing KPI ${label}`);
                }else if(state.priority||state.bridge||state.labels){
                  throw new Error(`${vp.name}/${key}: dashboard-only layer leaked priority=${state.priority} bridge=${state.bridge} labels=${state.labels}`);
                }
              }
              await page.locator('#openMaster').click();
              await page.waitForTimeout(150);
              const modal=await page.evaluate(()=>{const overlay=document.querySelector('#masterModal'),box=document.querySelector('#masterModal .modalBox');const r=box?.getBoundingClientRect();const s=overlay?getComputedStyle(overlay):null;return {visible:!!overlay&&s.display!=='none'&&overlay.getClientRects().length>0,left:r?.left??-1,right:r?.right??-1,top:r?.top??-1,bottom:r?.bottom??-1,width:r?.width??0,height:r?.height??0,viewportW:innerWidth,viewportH:innerHeight};});
              if(!modal.visible) throw new Error(`${vp.name}/modal: master modal not visible`);
              if(modal.width<=0||modal.height<=0||modal.left<-2||modal.right>modal.viewportW+2||modal.top<-2||modal.bottom>modal.viewportH+2) throw new Error(`${vp.name}/modal: box out of viewport ${JSON.stringify(modal)}`);
              await page.locator('#closeMaster').click();
              if(errors.length) throw new Error(`${vp.name}: page errors: ${errors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE