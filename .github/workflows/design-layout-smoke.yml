name: HD20 design layout smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify six-area desktop, mobile and modal layout
        run: |
          python3 -m http.server 4173 >/tmp/hd20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{name:'desktop',width:1440,height:1000},{name:'desktop-125pct-equivalent',width:1152,height:800},{name:'tablet',width:900,height:900},{name:'mobile',width:375,height:812}];
            const tabs=['dashboard','activity','advancement','audit','action','master'];
            const expectedKpis=['공식 판정 완료율','평균 판정 Lead Time','고도화 수준','Audit 후 6개월 유지율','Audit 부적합 재발률','기한 내 개선조치 완료율'];
            const advancementLevels=['1개 조건 충족 영역','2개 이상 충족 영역','3개 모두 충족 영역'];
            for(const vp of cases){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('dialog',d=>d.accept());
              await page.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});return route.abort('blockedbyclient')});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:20000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardPriority'),{},{timeout:20000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardSectionTabs'),{},{timeout:20000});
              const cssContract=await page.evaluate(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>new URL(x.href).pathname.split('/').pop()));
              const expectedCss=['styles.css','hd20-overhaul.css','hd20-five-area.css','dashboard-priority-groups.css','workflow-area-density.css','hd20-subtabs.css','hd20-ops-v2.css','supabase-auth.css','hd22-theme.css','print-styles.css'];
              if(JSON.stringify(cssContract)!==JSON.stringify(expectedCss)) throw new Error(`${vp.name}: stylesheet contract=${JSON.stringify(cssContract)}`);
              if(cssContract.some(x=>/mobile-runtime-restore|hotfix|polish/i.test(x))) throw new Error(`${vp.name}: retired stylesheet leaked ${JSON.stringify(cssContract)}`);
              const navCount=await page.locator('.beginnerNav button[data-key]').count(); if(navCount!==6) throw new Error(`${vp.name}: nav count=${navCount}`);
              for(const key of tabs){
                await page.evaluate(k=>document.querySelector(`.beginnerNav button[data-key="${k}"]`)?.click(),key); await page.waitForTimeout(350);
                const state=await page.evaluate((key)=>{const de=document.documentElement,body=document.body;const active=document.querySelector('.beginnerNav button.active')?.dataset.key||'';const visible=[...document.querySelectorAll('.awScreen.on,#performanceConversionAnalysis.on')].filter(el=>getComputedStyle(el).display!=='none');const headers=visible.reduce((n,el)=>n+el.querySelectorAll(':scope > .hd20AreaHeader').length,0);const shown=sel=>{const el=document.querySelector(sel);return !!el&&!el.hidden&&getComputedStyle(el).display!=='none'&&el.getClientRects().length>0};const critical=[...document.querySelectorAll('.beginnerNav button,.hd20AreaHeader,.awHero,.awCard,.card,.mmtMapCard,.mmtKpi,#hd20DashboardPriority,#hd20OperationalBridge')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length).map(el=>{const r=el.getBoundingClientRect();return {tag:el.id||el.className||el.tagName,left:r.left,right:r.right,width:r.width,height:r.height}});return {key,active,scrollY:window.scrollY,scrollWidth:Math.max(de.scrollWidth,body.scrollWidth),clientWidth:de.clientWidth,headers,priority:shown('#hd20DashboardPriority'),bridge:shown('#hd20OperationalBridge'),labels:[...document.querySelectorAll('.hd20DashboardSectionLabel')].filter(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length>0).length,activity:shown('#awActivity .awGrid'),advancement:shown('#hd20AdvJudgeOperational'),legacyAdvancement:shown('#awWorkplace'),auditExecution:shown('#awAudit .auditDraw')||shown('#awAudit .auditClosedLoop')||shown('#awAudit .awCard'),auditHero:shown('#awAudit > .awHero'),action:shown('#awAction .amGrid'),actionHero:shown('#awAction > .awHero'),critical};},key);
                if(state.active!==key) throw new Error(`${vp.name}/${key}: active=${state.active}`); const navState=await page.evaluate(()=>[...document.querySelectorAll('.beginnerNav button[data-key]')].map(b=>{const r=b.getBoundingClientRect(),s=b.querySelector('small');return{key:b.dataset.key,left:r.left,right:r.right,width:r.width,desc:(s?.innerText||'').trim(),visible:getComputedStyle(b).display!=='none'}})); if(navState.length!==6||navState.some(n=>!n.visible||!n.desc||n.width<=0||n.left<-2||n.right>vp.width+2)) throw new Error(`${vp.name}/${key}: top navigation invalid ${JSON.stringify(navState)}`); if(vp.width>=1152){const content=state.critical.filter(r=>!String(r.tag).includes('beginnerNav'));if(content.length){const left=Math.min(...content.map(r=>r.left)),right=Math.max(...content.map(r=>r.right)),span=right-left;if(span<vp.width*.68)throw new Error(`${vp.name}/${key}: one-sided desktop layout span=${Math.round(span)} viewport=${vp.width}`);}} if(state.scrollY>2) throw new Error(`${vp.name}/${key}: tab switch scrollY=${state.scrollY}`); if(state.scrollWidth>state.clientWidth+2) throw new Error(`${vp.name}/${key}: horizontal overflow ${state.scrollWidth}>${state.clientWidth}`); const rails=await page.evaluate(()=>[...document.querySelectorAll('.hd20ProcessFlow')].filter(e=>getComputedStyle(e).display!=='none'&&e.getClientRects().length).map(e=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,overflowX:getComputedStyle(e).overflowX}))); if(vp.width>=1152&&rails.some(r=>r.scrollWidth>r.clientWidth+2)) throw new Error(`${vp.name}/${key}: workflow rail internal overflow ${JSON.stringify(rails)}`);
                const bad=state.critical.find(r=>r.width<=0||r.height<=0||r.left<-2||r.right>vp.width+2); if(bad) throw new Error(`${vp.name}/${key}: critical box out of viewport ${JSON.stringify(bad)}`); if(['activity','advancement','audit','action'].includes(key)&&state.headers!==0) throw new Error(`${vp.name}/${key}: legacy area header count=${state.headers}`); if(key==='activity'&&!state.activity) throw new Error(`${vp.name}/activity: activity grid missing`);
                if(key==='advancement'){if(!shown('#hd20MaturityMapTab')||!shown('#hd20MaturityMapTab .mmtMapCard')) throw new Error(`${vp.name}/advancement: portfolio-first map missing`);if(state.legacyAdvancement) throw new Error(`${vp.name}/advancement: legacy workplace layer visible`);}
                if(key==='audit'&&(!state.auditExecution||!state.auditHero)) throw new Error(`${vp.name}/audit: active audit execution/hero missing`); if(key==='action'&&(!state.action||!state.actionHero)) throw new Error(`${vp.name}/action: action case/hero missing`);
                if(key==='dashboard'){if(!state.priority||state.bridge)throw new Error(`${vp.name}/dashboard-summary: visibility contract priority=${state.priority} bridge=${state.bridge}`);const count=await page.locator('#hd20DashboardPriority .hd20HealthKpi').count();if(count!==6)throw new Error(`${vp.name}/dashboard: operational KPI count=${count}`);const labels=await page.locator('#hd20DashboardPriority .hd20HealthKpiBody small').allTextContents();for(const label of expectedKpis)if(!labels.includes(label))throw new Error(`${vp.name}/dashboard: missing KPI ${label}`);}else if(state.priority||state.bridge||state.labels)throw new Error(`${vp.name}/${key}: dashboard-only layer leaked`);
              }
              await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="dashboard"]')?.click());
              await page.waitForFunction(()=>!!document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="execution"]'),{},{timeout:10000});
              await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="execution"]')?.click()); await page.waitForTimeout(200);
              const execution=await page.evaluate(()=>{const shown=sel=>{const el=document.querySelector(sel);return !!el&&getComputedStyle(el).display!=='none'&&el.getClientRects().length>0};return {active:window.HD20_DASHBOARD_TABS?.active?.(),priority:shown('#hd20DashboardPriority'),bridge:shown('#hd20OperationalBridge')};});
              if(execution.active!=='execution'||execution.priority||!execution.bridge) throw new Error(`${vp.name}: execution dashboard contract ${JSON.stringify(execution)}`);
              const dashKeys=await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section]').evaluateAll(xs=>xs.map(x=>x.dataset.dashboardSection));
              if(JSON.stringify(dashKeys)!==JSON.stringify(['summary','improve','request','execution','analysis'])) throw new Error(`${vp.name}: dashboard groups=${JSON.stringify(dashKeys)}`);
              const retiredLabel=await page.evaluate(()=>[...document.querySelectorAll('.hd20DashboardSectionLabel')].some(el=>/STANDARD\s*&\s*TREND|판정기준\s*·?\s*고도화\s*추이/.test(el.textContent||'')));
              if(retiredLabel) throw new Error(`${vp.name}: retired STANDARD & TREND dashboard label remains`);
              await page.evaluate(()=>window.HD20_NAV?.go?.('maturity')); await page.waitForTimeout(250);
              const maturity=await page.evaluate(()=>{const el=document.getElementById('hd20MaturityMapTab'),st=window.HD20_SUBNAV?.state?.();return {nav:window.HD20_NAV?.active?.(),area:st?.area,sub:st?.sub,visible:!!el&&!el.hidden&&getComputedStyle(el).display!=='none'};});
              if(maturity.nav!=='advancement'||maturity.area!=='advancement'||maturity.sub!=='map'||!maturity.visible) throw new Error(`${vp.name}: advancement maturity contract ${JSON.stringify(maturity)}`);
              const hasMasterModal=await page.evaluate(()=>!!document.querySelector('#masterModal .masterInfoBox')); if(hasMasterModal){await page.evaluate(()=>document.getElementById('openMaster')?.click()); await page.waitForTimeout(150); const modal=await page.evaluate(()=>{const overlay=document.querySelector('#masterModal'),box=document.querySelector('#masterModal .masterInfoBox');const r=box?.getBoundingClientRect();const s=overlay?getComputedStyle(overlay):null;return {visible:!!overlay&&s.display!=='none'&&overlay.getClientRects().length>0,left:r?.left??-1,right:r?.right??-1,top:r?.top??-1,bottom:r?.bottom??-1,width:r?.width??0,height:r?.height??0,viewportW:innerWidth,viewportH:innerHeight};}); if(!modal.visible||modal.width<=0||modal.height<=0||modal.left<-2||modal.right>modal.viewportW+2||modal.top<-2||modal.bottom>modal.viewportH+2) throw new Error(`${vp.name}/modal: invalid ${JSON.stringify(modal)}`);} if(errors.length) throw new Error(`${vp.name}: page errors: ${errors.join(' | ')}`); await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE