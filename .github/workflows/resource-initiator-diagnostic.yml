name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace.cjs <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const cdp=await page.context().newCDPSession(page), req=new Map();
            await cdp.send('Network.enable');
            cdp.on('Network.requestWillBeSent',e=>req.set(e.requestId,{url:e.request.url,initiator:e.initiator}));
            cdp.on('Network.responseReceived',e=>{
              if(e.response.status===404){const x=req.get(e.requestId);console.log('404',x?.url||e.response.url);console.log(JSON.stringify(x?.initiator||{},null,2))}
            });
            await page.route('**/*',route=>{
              const req=route.request(),u=new URL(req.url());
              if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
              if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
              return route.abort('blockedbyclient');
            });
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:30000});
            await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
            await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
            await page.waitForTimeout(1000);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node trace.cjs
