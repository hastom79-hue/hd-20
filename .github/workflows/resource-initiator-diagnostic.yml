name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace.cjs <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"?]+)(?:\?[^"}]*)?"/g)].map(x=>x[1]).filter(x=>!x.startsWith('http'));
          const mid=Math.ceil(scripts.length/2), q1=Math.ceil(mid/2);
          const modes=[
            {name:'nav-only',allow:i=>false},
            {name:'first-quarter',allow:i=>i>=0&&i<q1},
            {name:'second-quarter',allow:i=>i>=q1&&i<mid}
          ];
          console.log('SCRIPT_PARTITIONS','total='+scripts.length,'mid='+mid,'q1='+q1,'q1Last='+scripts[q1-1],'q2First='+scripts[q1],'q2Last='+scripts[mid-1]);
          (async()=>{
            for(const mode of modes){
              const browser=await chromium.launch({headless:true});
              try{
                const page=await browser.newPage();
                const local=[];
                page.on('response',r=>{if(/\.js(?:\?|$)/.test(r.url())&&r.url().includes('127.0.0.1'))local.push(r.url().split('/').pop())});
                page.on('pageerror',e=>console.log('PAGE_ERROR',mode.name,e.message));
                await page.route('**/*',async route=>{
                  const r=route.request(),u=new URL(r.url());
                  if(u.hostname!=='127.0.0.1'&&u.hostname!=='localhost'){
                    if(r.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                    return route.abort('blockedbyclient');
                  }
                  if(r.resourceType()==='script'){
                    const p=u.pathname.split('/').pop();
                    if(p!=='beginner-navigation.js'){
                      const i=scripts.indexOf(p);
                      if(!mode.allow(i))return route.fulfill({status:200,contentType:'application/javascript',body:'/* quarter bisect stub */'});
                    }
                  }
                  return route.continue();
                });
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
                const started=Date.now();
                let stage='none';
                try{await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:4000});stage='nav-dom';await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:4000});stage='nav-api';await page.waitForFunction(()=>window.HD20_NAV.ready(),{},{timeout:4000});stage='nav-ready'}catch(e){stage+='-timeout'}
                console.log('BISECT_RESULT',mode.name,stage,'ms='+String(Date.now()-started),'scripts='+local.length,'last='+String(local.slice(-8)));
                await page.close().catch(()=>{});
              } finally {await Promise.race([browser.close().catch(()=>{}),new Promise(r=>setTimeout(r,2000))]);}
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          timeout 55s node trace.cjs
