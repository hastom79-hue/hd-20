name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace.cjs <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
            .map(x=>x[1].split('?')[0])
            .filter(x=>!/^https?:\/\//i.test(x));
          const total=scripts.length;
          const q=Math.ceil(total/4);
          const ranges=[0,q,Math.min(q*2,total),Math.min(q*3,total),total];
          const inQ=(i,n)=>i>=ranges[n-1]&&i<ranges[n];
          const modes=[
            {name:'nav-only',allow:i=>false},
            {name:'q1',allow:i=>inQ(i,1)},
            {name:'q2',allow:i=>inQ(i,2)},
            {name:'q3',allow:i=>inQ(i,3)},
            {name:'q4',allow:i=>inQ(i,4)},
            {name:'q1+q2',allow:i=>inQ(i,1)||inQ(i,2)},
            {name:'q1+q3',allow:i=>inQ(i,1)||inQ(i,3)},
            {name:'q1+q4',allow:i=>inQ(i,1)||inQ(i,4)},
            {name:'q2+q3',allow:i=>inQ(i,2)||inQ(i,3)},
            {name:'q2+q4',allow:i=>inQ(i,2)||inQ(i,4)},
            {name:'q3+q4',allow:i=>inQ(i,3)||inQ(i,4)},
            {name:'all',allow:i=>i>=0}
          ];
          console.log('SCRIPT_PARTITIONS','total='+total,'ranges='+ranges.join(','));
          for(let n=1;n<=4;n++) console.log('QUARTER',n,'first='+scripts[ranges[n-1]],'last='+scripts[ranges[n]-1]);
          (async()=>{
            for(const mode of modes){
              const browser=await chromium.launch({headless:true});
              try{
                const page=await browser.newPage();
                const real=[];
                page.on('pageerror',e=>console.log('PAGE_ERROR',mode.name,e.message));
                await page.route('**/*',async route=>{
                  const r=route.request(),u=new URL(r.url());
                  if(u.hostname!=='127.0.0.1'&&u.hostname!=='localhost'){
                    if(r.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                    return route.abort('blockedbyclient');
                  }
                  if(r.resourceType()==='script'){
                    const p=u.pathname.split('/').pop();
                    if(p!=='beginner-navigation.js'){
                      const i=scripts.indexOf(p);
                      if(!mode.allow(i))return route.fulfill({status:200,contentType:'application/javascript',body:'/* cross bisect stub */'});
                      real.push(p);
                    }
                  }
                  return route.continue();
                });
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
                const started=Date.now();
                let stage='none';
                try{
                  await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:5000});stage='nav-dom';
                  await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:5000});stage='nav-api';
                  await page.waitForFunction(()=>window.HD20_NAV.ready(),{},{timeout:5000});stage='nav-ready';
                }catch(e){stage+='-timeout'}
                console.log('BISECT_RESULT',mode.name,stage,'ms='+String(Date.now()-started),'real='+real.length,'last='+String(real.slice(-6)));
                await page.close().catch(()=>{});
              } finally {await Promise.race([browser.close().catch(()=>{}),new Promise(r=>setTimeout(r,2000))]);}
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          timeout 110s node trace.cjs
