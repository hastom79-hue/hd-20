name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace-one.cjs <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const mode=process.argv[2];
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
            .map(x=>x[1].split('?')[0]).filter(x=>!/^https?:\/\//i.test(x));
          const q1=scripts.slice(0,16).filter(x=>x!=='beginner-navigation.js');
          const q2=scripts.slice(16,32), q3=scripts.slice(32,48);
          const c=q1.slice(10);
          const groups={};
          for(let i=0;i<c.length;i++) for(let j=i+1;j<c.length;j++) for(let k=j+1;k<c.length;k++){
            const triple=c[i]+'+'+c[j]+'+'+c[k];
            groups[triple+'+q2']=new Set([c[i],c[j],c[k],...q2]);
            groups[triple+'+q3']=new Set([c[i],c[j],c[k],...q3]);
          }
          const allow=groups[mode];
          if(!allow) throw new Error('unknown mode '+mode);
          console.log('TRIPLE_ALLOW',mode,'q1c='+c.filter(x=>allow.has(x)).join(','),'count='+allow.size);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage(); const real=[];
            page.on('pageerror',e=>console.log('PAGE_ERROR',mode,e.message));
            await page.route('**/*',async route=>{
              const r=route.request(),u=new URL(r.url());
              if(u.hostname!=='127.0.0.1'&&u.hostname!=='localhost'){
                if(r.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* external stub */'});
                return route.abort('blockedbyclient');
              }
              if(r.resourceType()==='script'){
                const p=u.pathname.split('/').pop();
                if(p!=='beginner-navigation.js'&&!allow.has(p))return route.fulfill({status:200,contentType:'application/javascript',body:'/* q1c triple isolate stub */'});
                if(p!=='beginner-navigation.js')real.push(p);
              }
              return route.continue();
            });
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:8000});
            const started=Date.now(); let stage='none';
            try{
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:2500});stage='nav-dom';
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:2500});stage='nav-api';
              await page.waitForFunction(()=>window.HD20_NAV.ready(),{},{timeout:2500});stage='nav-ready';
            }catch(e){stage+='-timeout'}
            console.log('TRIPLE_RESULT',mode,stage,'ms='+String(Date.now()-started),'real='+real.length);
            await Promise.race([browser.close().catch(()=>{}),new Promise(r=>setTimeout(r,500))]);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          mapfile -t modes < <(node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(x=>x[1].split('?')[0]).filter(x=>!/^https?:\/\//i.test(x));
          const c=scripts.slice(0,16).filter(x=>x!=='beginner-navigation.js').slice(10);
          for(let i=0;i<c.length;i++) for(let j=i+1;j<c.length;j++) for(let k=j+1;k<c.length;k++){
            console.log(c[i]+'+'+c[j]+'+'+c[k]+'+q2');
            console.log(c[i]+'+'+c[j]+'+'+c[k]+'+q3');
          }
          NODE
          )
          echo "TRIPLE_MODE_COUNT=${#modes[@]}"
          for mode in "${modes[@]}"; do
            echo "=== TRIPLE MODE $mode ==="
            timeout --kill-after=2s 14s node trace-one.cjs "$mode" || echo "TRIPLE_HARD_TIMEOUT $mode exit=$?"
          done
