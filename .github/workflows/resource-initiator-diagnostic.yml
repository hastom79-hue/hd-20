name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace.cjs <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const mode of ['nav-only','first-half','second-half','all']){
                const page=await browser.newPage();
                const local=[];
                page.on('response',r=>{if(/\.js(?:\?|$)/.test(r.url())&&r.url().includes('127.0.0.1'))local.push(r.url().split('/').pop())});
                page.on('pageerror',e=>console.log('PAGE_ERROR',mode,e.message));
                await page.route('**/*',async route=>{
                  const r=route.request(),u=new URL(r.url());
                  if(u.hostname!=='127.0.0.1'&&u.hostname!=='localhost'){
                    if(r.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                    return route.abort('blockedbyclient');
                  }
                  if(r.resourceType()==='script'){
                    const p=u.pathname.split('/').pop();
                    if(p!=='beginner-navigation.js'){
                      const scripts=[...require('fs').readFileSync('index.html','utf8').matchAll(/<script src="([^"?]+)(?:\?[^"}]*)?"/g)].map(x=>x[1]).filter(x=>!x.startsWith('http'));
                      const i=scripts.indexOf(p),mid=Math.ceil(scripts.length/2);
                      const allow=mode==='all'||(mode==='first-half'&&i>=0&&i<mid)||(mode==='second-half'&&i>=mid);
                      if(!allow)return route.fulfill({status:200,contentType:'application/javascript',body:'/* bisect stub */'});
                    }
                  }
                  return route.continue();
                });
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:30000});
                const started=Date.now();
                let stage='none';
                try{await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:8000});stage='nav-dom';await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:8000});stage='nav-api';await page.waitForFunction(()=>window.HD20_NAV.ready(),{},{timeout:8000});stage='nav-ready'}catch(e){stage+='-timeout'}
                console.log('BISECT_RESULT',mode,stage,'ms='+String(Date.now()-started),'scripts='+local.length,'last='+String(local.slice(-5)));
                await page.close().catch(()=>{});
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          timeout 90s node trace.cjs
