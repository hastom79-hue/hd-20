name: HD20 resource initiator diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - run: |
          cat > trace.cjs <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const cdp=await page.context().newCDPSession(page), req=new Map();
              await cdp.send('Network.enable');
              cdp.on('Network.requestWillBeSent',e=>req.set(e.requestId,{url:e.request.url,initiator:e.initiator,type:e.type}));
              cdp.on('Network.responseReceived',e=>{
                const x=req.get(e.requestId),u=x?.url||e.response.url;
                if((x?.type==='Script'||/\.js(?:\?|$)/.test(u))&&(u.includes('127.0.0.1')||u.includes('localhost'))) console.log('LOCAL_SCRIPT_RESPONSE',e.response.status,u);
                if(e.response.status===404){console.log('404',u);console.log(JSON.stringify(x?.initiator||{},null,2))}
              });
              page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
              await page.route('**/*',route=>{
                const r=route.request(),u=new URL(r.url());
                if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
                if(r.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                return route.abort('blockedbyclient');
              });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:30000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForTimeout(1000);
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          timeout 45s node trace.cjs
