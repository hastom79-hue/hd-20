name: HD20 current IA smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-current-ia-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-current-ia-http.log; exit 1
      - name: Validate canonical five areas and dashboard groups
        run: |
          cat > hd20-current-ia.cjs <<'NODE'
          const { chromium }=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('response',r=>{if(r.status()===404&&!/favicon\.ico$/i.test(new URL(r.url()).pathname))errors.push('404: '+r.url())});
              page.on('dialog',d=>d.accept());
              await page.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});return route.abort('blockedbyclient')});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>window.HD20_NAV&&window.HD20_DASHBOARD_TABS&&document.getElementById('hd20DashboardSectionTabs'),{},{timeout:25000});
              const expected=['dashboard','activity','advancement','audit','action'];
              const keys=await page.locator('.beginnerNav button[data-key]').evaluateAll(xs=>xs.map(x=>x.dataset.key));
              assert(JSON.stringify(keys)===JSON.stringify(expected),'canonical top nav mismatch: '+JSON.stringify(keys));
              assert((await page.locator('.beginnerNav button.active').getAttribute('data-key'))==='dashboard','dashboard not initial tab');
              const groupKeys=await page.locator('#hd20DashboardSectionTabs button').evaluateAll(xs=>xs.map(x=>x.dataset.dashboardSection));
              assert(JSON.stringify(groupKeys)===JSON.stringify(['summary','execution','maturity','standard','field']),'dashboard group mismatch: '+JSON.stringify(groupKeys));
              const groupState=async()=>page.evaluate(()=>({active:window.HD20_DASHBOARD_TABS.active(),priority:!document.querySelector('#hd20DashboardPriority')?.classList.contains('hd20DashboardSectionHidden'),cards:!document.querySelector('.cards')?.classList.contains('hd20DashboardSectionHidden'),showcase:!document.querySelector('#hd20FieldShowcaseBootstrap')?.classList.contains('hd20DashboardSectionHidden'),main:!document.querySelector('.mainGrid')?.classList.contains('hd20DashboardSectionHidden'),bridge:!document.querySelector('#hd20OperationalBridge')?.classList.contains('hd20DashboardSectionHidden'),bottom:!document.querySelector('.bottomGrid')?.classList.contains('hd20DashboardSectionHidden')}));
              let s=await groupState();assert(s.active==='summary'&&s.priority&&s.cards&&!s.showcase&&!s.main&&!s.bridge&&!s.bottom,'summary isolation failed: '+JSON.stringify(s));
              await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('execution',{scroll:false}));s=await groupState();assert(s.active==='execution'&&!s.priority&&!s.cards&&!s.showcase&&s.main&&s.bridge&&!s.bottom,'execution isolation failed: '+JSON.stringify(s));
              await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('maturity',{scroll:false}));s=await groupState();assert(s.active==='maturity','maturity dashboard tab failed: '+JSON.stringify(s));
              await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('standard',{scroll:false}));s=await groupState();assert(s.active==='standard'&&!s.priority&&!s.cards&&!s.showcase&&!s.main&&!s.bridge&&s.bottom,'standard isolation failed: '+JSON.stringify(s));
              await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('field',{scroll:false}));s=await groupState();assert(s.active==='field'&&!s.priority&&!s.cards&&s.showcase&&!s.main&&!s.bridge&&!s.bottom,'field isolation failed: '+JSON.stringify(s));
              for(const key of expected.slice(1)){await page.evaluate(k=>window.HD20_NAV.go(k),key);await page.waitForTimeout(120);assert((await page.locator('.beginnerNav button.active').getAttribute('data-key'))===key,key+' navigation failed')}
              await page.evaluate(()=>window.HD20_NAV.go('dashboard'));await page.waitForTimeout(120);s=await groupState();assert(s.active==='summary','dashboard return did not reset summary');
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth);assert(overflow<=4,`horizontal overflow ${overflow}px @ ${viewport.width}`);assert(errors.length===0,'Page errors: '+errors.join(' | '));
              console.log(`PASS ${viewport.width}: five-area IA + 5 dashboard groups`);await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node hd20-current-ia.cjs
