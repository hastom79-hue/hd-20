name: HD-20 GitHub Pages deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hd20-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HD-20
        uses: actions/checkout@v4
      - name: Verify deployment source
        run: |
          test -f index.html
          test -f hd20-subtabs.js
          test -f audit-as-is-to-be-manager.js
          test -f hd20-action-notification-routing.js
          grep -q 'audit-as-is-to-be-manager.js?v=' index.html
          grep -q 'hd20-subtabs.js?v=' index.html
          grep -q 'beginner-navigation.js?v=' index.html
          grep -q 'action-register-modal.js?v=' index.html
          test -f DEVELOPMENT_LOG.md
          test -f hd20-subtabs.css
          test -f activity-register-modal.js
          node --check activity-register-modal.js
          grep -Fq "if(overlay.classList.contains('on'))return" activity-register-modal.js
          grep -Fq "if(overlay.isConnected&&overlay.classList.contains('on'))" activity-register-modal.js
          grep -Fq "function hide(){if(!overlay.classList.contains('on'))return;clearTimeout(modalFocusTimer)" activity-register-modal.js
          grep -Fq "other?.classList.contains('on')?'hidden':''" activity-register-modal.js
          test -f action-register-modal.js
          test -f landing-launcher.js
          grep -Fq 'hd20-subtabs.css?v=' index.html
          grep -Fq 'document.body.appendChild(m)' action-register-modal.js
          grep -Fq 'body>#hd20ActionRegisterModal.on' hd20-subtabs.css
          grep -Fq '2026-11-03 — 개선활동관리 4개 조회/등록 하위탭 연동 및 팝업 표시 안정화' DEVELOPMENT_LOG.md
          # Ensure approved 4 improvement + 3 Audit menu contract is bundled.
          grep -Fq "['overview','① 통합조회']" hd20-subtabs.js
          grep -Fq "['tobe','④ 개선조치등록·관리']" hd20-subtabs.js
          grep -Fq "['checklist','③ Audit 점검항목']" hd20-subtabs.js
          node --check audit-as-is-to-be-manager.js
          grep -Fq "'확정완료'" audit-as-is-to-be-manager.js
          grep -Fq 'search.oninput=e=>' audit-as-is-to-be-manager.js
          grep -Fq 'clearTimeout(searchDebounce)' audit-as-is-to-be-manager.js
          grep -Fq 'restored.focus({preventScroll:true})' audit-as-is-to-be-manager.js
          grep -Fq "window.HD20_NAV?.active?.()!=='activity'||document.getElementById('awActivity')?.dataset.subview!=='tobe'" audit-as-is-to-be-manager.js
          grep -Fq 'if(saving||!overlay.isConnected)return' audit-as-is-to-be-manager.js
          grep -Fq "button.setAttribute('aria-busy','true')" audit-as-is-to-be-manager.js
          grep -Fq 'function installImprovementSubnavGuard()' hd20-subtabs.js
          grep -Fq "['self','② 자율개선조회']" hd20-subtabs.js
          grep -Fq "['request','③ 개선요청조회']" hd20-subtabs.js
          grep -Fq 'function renderOverview(mode=' landing-launcher.js
          grep -Fq "const preferredActivity=area==='activity'" hd20-subtabs.js
          node --check hd20-subtabs.js
          grep -Fq "host.isConnected&&window.HD20_NAV?.active?.()==='audit'&&root.dataset.subview==='ongoing'" hd20-subtabs.js
          grep -Fq "['retention','retention-recheck'].includes(e.detail?.source)" hd20-subtabs.js
          ! grep -Fq "if(sub==='tobe')window.HD20ToBeManager?.render?.()" hd20-subtabs.js
          grep -Fq "e.detail?.area==='activity'&&e.detail?.sub==='tobe'" audit-as-is-to-be-manager.js
          grep -Fq "draw.sourceStage!=='RETENTION-RANDOM'" hd20-subtabs.js
          grep -Fq "String(draw.initialAuditor||draw.auditor||'')!==String(evaluator)" hd20-subtabs.js
          grep -Fq 'registeredBy:rows[n].evaluator,registrant:rows[n].evaluator' hd20-subtabs.js
          grep -Fq 'recheckEvaluator:currentEmail()||rows[n].evaluator' hd20-subtabs.js
          grep -Fq "String(rows[n].followupActionId||'')!==String(latestHistory.id)" hd20-subtabs.js
          grep -Fq 'const usedIds=new Set(rows.map(x=>String(x.id||' hd20-subtabs.js
          grep -Fq 'while(usedIds.has(id))' hd20-subtabs.js
          grep -Fq '5S모듈 메일 초안 열기' hd20-subtabs.js
          grep -Fq "notificationStatus:'미발송'" hd20-subtabs.js
          grep -Fq "source:'retention-draw',drawn:chosen.length" hd20-subtabs.js
          grep -Fq "savedRetentionBefore=localStorage.getItem('hd20RetentionRandomChecksV1')" hd20-subtabs.js
          grep -Fq "retentionRestored=restore('hd20RetentionRandomChecksV1',savedRetentionBefore)" hd20-subtabs.js
          grep -Fq 'hd20LnThreeTabs{display:none!important}' landing-launcher.js
          grep -Fq 'landing-launcher.js?v=' index.html
          grep -Fq 'activity-register-modal.js?v=' index.html
          grep -Fq 'action-mail-workflow.js?v=' index.html
          grep -Fq "const formRoot=document.getElementById('hd20ActionRegisterModal')||a" action-mail-workflow.js
          grep -Fq "document.getElementById('hd20ActionRegisterModal')||a" action-mail-workflow.js
          grep -Fq '개선요청 등록·임시저장 — 최상위 팝업 위치 변경에 따른 저장 로직 복원' DEVELOPMENT_LOG.md
          node --check action-mail-workflow.js
          grep -Fq "if(window.HD20_NAV?.active?.()!=='action')return;try{renderCases(a)}" action-mail-workflow.js
          node --check action-register-modal.js
          grep -Fq "if(e.detail?.via===false)return;localStorage.removeItem('hd20ActionPopupDraftV1')" action-register-modal.js
          grep -Fq "if(!m||m.classList.contains('on'))return" action-register-modal.js
          grep -Fq "if(m.isConnected&&m.classList.contains('on'))" action-register-modal.js
          grep -Fq "if(!m||!m.classList.contains('on'))return;clearTimeout(modalFocusTimer)" action-register-modal.js
          grep -Fq "other?.classList.contains('on')?'hidden':''" action-register-modal.js
          grep -Fq "root.dataset.hd20ActionModalReady==='1'" action-register-modal.js
          grep -Fq "document.getElementById('hd20ActionRegisterModal')" action-register-modal.js
          grep -Fq 'document.body.appendChild(overlay)' activity-register-modal.js
          grep -Fq 'html body>#awRegisterModal.on' hd20-subtabs.css
          grep -Fq '자율개선 등록 모달의 상위 화면 숨김 영향 제거' DEVELOPMENT_LOG.md
          test -f activity-workflow.js
          grep -Fq 'activity-workflow.js?v=' index.html
          grep -Fq 'window.HD20_ACTIVITY_REGISTER=' activity-workflow.js
          grep -Fq 'window.HD20_ACTIVITY_REGISTER()' activity-register-modal.js
          grep -Fq '자율개선 등록 버튼 저장 불능 원인 제거' DEVELOPMENT_LOG.md
          node --check activity-workflow.js
          node --check activity-register-modal.js
          grep -Fq 'master-workspace-v2.js?v=' index.html
          grep -Fq 'master-workspace-v2.css?v=' index.html
          node --check master-workspace-v2.js
          grep -Fq "const complete=links>=10&&!!box.querySelector(':scope > .hmSourceRegistry')" master-workspace-v2.js
          grep -Fq "existing.remove()" master-workspace-v2.js
          grep -Fq "if(!box.isConnected||!root.classList.contains('on'))return" master-workspace-v2.js
          grep -Fq "window.HD20_NAV.go('dashboard')" master-workspace-v2.js
          grep -Fq "box.querySelectorAll(':scope > .hmSourceRegistry').forEach(node=>node.remove())" master-workspace-v2.js
          ! grep -Fq           grep -Fq 'function clickWhenReady(findFn,modalId,area,tries=0,lastClickAt=-1)' landing-launcher.js
          grep -Fq "clickWhenReady(()=>document.getElementById('hd20ActionRegisterBtn')" landing-launcher.js
          grep -Fq "snapshotActivities.forEach((x,i)=>" landing-launcher.js
          grep -Fq "localActions.forEach((x,i)=>" landing-launcher.js
          grep -Fq "['self','request','tobe'].includes(currentSub)" landing-launcher.js
          grep -Fq 'const refreshVisibleLookup=()=>' landing-launcher.js
          grep -Fq '2026-11-03 후속 안정화 — 최초 진입과 검색 입력 보호' DEVELOPMENT_LOG.md
          ! grep -Fq 'data-ln-tab=' landing-launcher.js
          grep -Fq '통합조회 과거 3개 중복 탭 DOM 제거' DEVELOPMENT_LOG.md
          grep -Fq "document.querySelector('#awRegisterModal.on,#hd20ActionRegisterModal.on')" landing-launcher.js
          grep -Fq '등록 팝업 실행 중 조회목록 재렌더 방지' DEVELOPMENT_LOG.md
          test -f dashboard-work-kpi-migration.js
          grep -Fq 'dashboard-work-kpi-migration.js?v=' index.html
          grep -Fq 'hd20DwmBarValue' dashboard-work-kpi-migration.js
          grep -Fq 'bottom:calc(100% + 4px)' dashboard-work-kpi-migration.js
          grep -Fq '운영 종합진단·집중관리 추이 월별 막대 데이터레이블 위치 개선' DEVELOPMENT_LOG.md
          grep -Fq 'right:calc(50% - 4px)' dashboard-work-kpi-migration.js
          grep -Fq 'left:calc(50% - 4px)' dashboard-work-kpi-migration.js
          grep -Fq '차트 막대 끝 레이블 간 겹침 방지 보완' DEVELOPMENT_LOG.md
          node --check dashboard-work-kpi-migration.js
          grep -Fq '2026-11-04 shared non-dashboard search layout' hd20-subtabs.css
          grep -Fq '#masterModal #hd20MasterWorkspace .hmTitle' master-workspace-v2.css
          grep -Fq 'landing-launcher.js?v=' index.html
          grep -Fq 'hd20-subtabs.css?v=' index.html
          grep -Fq 'master-workspace-v2.css?v=' index.html
          grep -Fq '운영탭 공통 검색조건 레이아웃 정리' DEVELOPMENT_LOG.md
          node --check landing-launcher.js
          node --check beginner-navigation.js
          node --check hd20-action-notification-routing.js
      - name: Verify static and fallback script assets exist
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const loader=fs.readFileSync('final-layout-polish.js','utf8');
          const assets=new Set();
          for(const match of html.matchAll(/<(?:script|link)\b[^>]*?(?:src|href)=["']([^"']+)/g)){
            const path=match[1].split('?')[0];
            if(/^[\w./-]+\.(?:js|css)$/.test(path))assets.add(path);
          }
          for(const match of loader.matchAll(/['"]([\w./-]+\.js)\?v=/g))assets.add(match[1]);
          const missing=[...assets].filter(path=>!fs.existsSync(path));
          if(missing.length){console.error('Missing referenced assets:',missing);process.exit(1)}
          console.log('PASS: '+assets.size+' static and fallback assets exist');
          NODE
      - name: Check cross-tab and master workflow JavaScript syntax
        run: |
          set -eu
          node --check hd20-cross-tab-sync.js
          node --check audit-retention-workflow-visual.js
          node --check audit-random-draw.js
          node --check audit-closed-loop-workflow.js
          grep -Fq "if(linked.length>1)throw new Error" audit-closed-loop-workflow.js
          grep -Fq "source&&source!==String(draw.id)" audit-closed-loop-workflow.js
          grep -Fq 'previousAudit=localStorage.getItem(DRAW_KEY),previousAction=localStorage.getItem(ACTION_KEY)' audit-closed-loop-workflow.js
          grep -Fq 'for(const [key,raw] of [[DRAW_KEY,previousAudit],[ACTION_KEY,previousAction]])' audit-closed-loop-workflow.js
          node --check operating-policy-master.js
          node --check integrated-master-factors.js
          node --check hd20-ulsan-workplace-master.js
          node --check workflow-crud.js
          node --check table-enhance-suite.js
          node --check theme-inspection.js
          node --check master-workspace-v2.js
          node --check final-layout-polish.js
      - name: Test registration popup scroll-lock handoff
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          for(const kind of ['activity','action']){
            const path=kind==='activity'?'activity-register-modal.js':'action-register-modal.js';
            const source=fs.readFileSync(path,'utf8');
            const begin=source.indexOf(kind==='activity'?'function hide(){':'function close(){');
            const end=source.indexOf(kind==='activity'?"\nwindow.addEventListener('hd20-activity-register-success'":'\nfunction setup()',begin);
            assert(begin>=0&&end>begin,'popup close function not found: '+path);
            for(const otherOpen of [true,false]){
              const own={opened:true,setAttribute(){}};
              own.classList={contains:()=>own.opened,remove:()=>{own.opened=false}};
              const other={classList:{contains:()=>otherOpen}};
              const document={body:{style:{overflow:'hidden'}},getElementById:id=>id==='awActivity'?{dataset:{subview:'none'}}:other};
              const nav={HD20_NAV:{active:()=> 'dashboard'}};
              const fn=new Function('document','window','overlay','        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const cases=[
            {path:'activity-register-modal.js',begin:'function show(){',end:'/* 사용자 지적:',type:'activity'},
            {path:'action-register-modal.js',begin:'function open(){',end:'/* 사용자 지적:',type:'action'}
          ];
          for(const item of cases){
            const src=fs.readFileSync(item.path,'utf8');
            const begin=src.indexOf(item.begin),end=src.indexOf(item.end,begin);
            assert(begin>=0&&end>begin,item.path+' popup function missing');
            const body=src.slice(begin,end);
            let sideEffects=0,storageReads=0;
            const opened={classList:{contains:()=>true}};
            const fn=item.type==='activity'
              ?new Function('overlay','document','removeRedundantGuide','restore','formCard','        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('audit-as-is-to-be-manager.js','utf8');
          const begin=src.indexOf("const search=host.querySelector('[data-tobe-search]');");
          const end=src.indexOf("\nhost.querySelector('[data-tobe-reset]')",begin);
          assert(begin>=0&&end>begin,'TO-BE input handler not found');
          const handlerSource=src.slice(begin,end);
          for(const active of [true,false]){
            let scheduled,renderCount=0,focused=0;
            const input={value:'test',focus:()=>focused++,setSelectionRange:()=>{}};
            const host={isConnected:true,querySelector:()=>input};
            const doc={getElementById:id=>id==='hd20AsIsToBeManager'?host:{dataset:{subview:active?'tobe':'self'}}};
            const nav={HD20_NAV:{active:()=>active?'activity':'master'}};
            const make=new Function('host','document','window','ID','setTimeout','clearTimeout','render','filt',
              'let searchDebounce=null;\n'+handlerSource+'\nreturn search.oninput;');
            const oninput=make(host,doc,nav,'hd20AsIsToBeManager',fn=>{scheduled=fn;return 1},()=>{},()=>renderCount++,{text:''});
            oninput({target:input});
            scheduled();
            assert.equal(renderCount,active?1:0,'inactive tab must not render');
            assert.equal(focused,active?1:0,'inactive tab must not steal focus');
          }
          console.log('PASS: active/inactive TO-BE delayed search behavior');
          NODE
      - name: Test TO-BE and retention completed-state agreement
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const manager=fs.readFileSync('audit-as-is-to-be-manager.js','utf8');
          const retention=fs.readFileSync('hd20-subtabs.js','utf8');
          const extract=(source,marker)=>{
            const begin=source.indexOf(marker);
            assert(begin>=0,'completion predicate not found: '+marker);
            const end=source.indexOf(';',begin);
            return new Function('return '+source.slice(begin+marker.length,end))();
          };
          const managerDone=extract(manager,'const done=');
          const retentionPredicateStart=retention.indexOf("const done=x=>['완료','개선완료','조치완료','종결','확정완료'");
          assert(retentionPredicateStart>=0,'retention candidate completion predicate not found');
          const retentionDone=extract(retention.slice(retentionPredicateStart),'const done=');
          for(const status of ['완료','개선완료','조치완료','종결','확정완료','종료','종결완료','조치대기','진행중']){
            const sample={status,id:'IMP-VALID-1',completed:false};
            assert.equal(managerDone(sample),retentionDone(sample),'completion mismatch: '+status);
          }
          console.log('PASS: TO-BE management and retention sample completion statuses agree');
          NODE
      - name: Test retention redraw only on active Audit maintenance tab
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('hd20-subtabs.js','utf8');
          const begin=src.indexOf("if(!host.dataset.rsActionSync){host.dataset.rsActionSync='1';window.addEventListener('hd20-action-updated'");
          const end=src.indexOf("\n if(!document.getElementById('hd20RetentionSamplingStyle'))",begin);
          assert(begin>=0&&end>begin,'retention action refresh hook missing');
          for(const area of ['audit','activity']){
            for(const sub of ['ongoing','draw']){
              let onAction,draws=0;
              const host={dataset:{},isConnected:true};
              const root={dataset:{subview:sub}};
              const nav={HD20_NAV:{active:()=>area},addEventListener:(event,handler)=>{assert.equal(event,'hd20-action-updated');onAction=handler}};
              new Function('host','root','window','render',src.slice(begin,end))(host,root,nav,()=>draws++);
              onAction();
              assert.equal(draws,area==='audit'&&sub==='ongoing'?1:0,'unexpected retention redraw: '+area+'/'+sub);
            }
          }
          console.log('PASS: inactive Audit retention panel skips action redraw');
          NODE
      - name: Test retention Audit bridge duplicate and identity safeguards
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const source=fs.readFileSync('hd20-subtabs.js','utf8');
          const start=source.indexOf('const existingDraws=audits.filter(');
          const end=source.indexOf('  if(!draw){draw=',start);
          assert(start>=0&&end>start,'Audit bridge verification missing');
          const sourceCode=source.slice(start,end);
          const base={id:'RET-AUDIT-RET-1',sourceCaseId:'IMP-1',sourceStage:'RETENTION-RANDOM',initialAuditor:'auditor@hd.com',team:'조립팀',workplace:'1라인'};
          const cases=[
            ['new',[],false],
            ['existing',[base],false],
            ['duplicate',[base,{...base}],true],
            ['wrong original',[{...base,sourceCaseId:'IMP-2'}],true],
            ['wrong auditor',[{...base,initialAuditor:'foreign@hd.com'}],true],
            ['wrong team',[{...base,team:'타팀'}],true],
            ['wrong workplace',[{...base,workplace:'2라인'}],true]
          ];
          for(const [name,audits,blocked] of cases){
            let wasBlocked=false;
            const fn=new Function('audits','drawId','r','evaluator','unlock','window',sourceCode+'return draw');
            fn(audits,base.id,{caseId:'IMP-1',team:'조립팀',workplace:'1라인'},'auditor@hd.com',
              ()=>{wasBlocked=true},{alert:()=>{}});
            assert.equal(wasBlocked,blocked,'bridge safeguard: '+name);
          }
          console.log('PASS: seven Audit bridge duplicate/origin checks');
          NODE
      - name: Test retention recheck requires unique unclosed case
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('hd20-subtabs.js','utf8');
          const start=s.indexOf("const box=btn.closest('[data-rs-id]'),id=box?.dataset.rsId,rows=load('hd20RetentionRandomChecksV1'),matching=");
          const end=s.indexOf(" if(btn.disabled||box.dataset.rsSaving==='1')return;",start);
          assert(start>=0&&end>start,'recheck unique-ID guard missing');
          const block=s.slice(start,end);
          for(const [name,rows,id,allow] of [
            ['unique',[{id:'RET-1',result:'부적합'}],'RET-1',true],
            ['duplicate',[{id:'RET-1',result:'부적합'},{id:'RET-1',result:'부적합'}],'RET-1',false],
            ['missing',[{id:'RET-2',result:'부적합'}],'RET-1',false],
            ['closed',[{id:'RET-1',result:'부적합',closedAt:'2026-11-01'}],'RET-1',false]
          ]){
            const check=new Function('btn','load','window',block+'\nreturn true;');
            const result=check({closest:()=>({dataset:{rsId:id}})},()=>rows,{alert:()=>{}});
            assert.equal(result===true,allow,'recheck validation failed: '+name);
          }
          console.log('PASS: unique, duplicate, missing and closed retention records');
          NODE
      - name: Test retention recheck follow-up linkage safeguards
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('hd20-subtabs.js','utf8');
          const start=src.indexOf('const existingFollowups=actions.filter(');
          const end=src.indexOf('  if(!next){next=',start);
          assert(start>=0&&end>start,'recheck follow-up guard missing');
          const snippet=src.slice(start,end);
          const base={id:'AUTO-RETENTION-RECHECK-R1-2',sourceCaseId:'R1',sourceStage:'RETENTION-RECHECK',previousActionId:'A1',initialAuditor:'inspect@hd.com',originCaseId:'IMP-1'};
          const scenarios=[
            ['fresh',[],false],
            ['same ID',[base],true],
            ['same link with other ID',[{...base,id:'OTHER'}],true],
            ['duplicate',[base,{...base,id:'OTHER'}],true],
            ['foreign auditor',[{...base,initialAuditor:'foreign@hd.com'}],true],
            ['foreign original',[{...base,originCaseId:'OTHER'}],true],
            ['foreign ID collision',[{...base,sourceCaseId:'R2'}],true]
          ];
          for(const [name,actions,blocked] of scenarios){
            const btn={disabled:true},box={dataset:{rsSaving:'1'},querySelectorAll:()=>[btn]};
            new Function('actions','idNext','rows','n','action','box','window',snippet+';return next;')(
              actions,base.id,[{id:'R1',evaluator:'inspect@hd.com',caseId:'IMP-1'}],0,{id:'A1'},box,{alert:()=>{}});
            assert.equal(box.dataset.rsSaving==='',blocked,name);
          }
          console.log('PASS: seven recheck follow-up duplication and provenance scenarios');
          NODE
      - name: Test retention self-events do not redraw twice
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
