name: HD20 browser smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hd20-http.log 2>&1 &
          echo $! > /tmp/hd20-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hd20-http.log
          exit 1

      - name: Execute main-dashboard browser contract
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
            const pageErrors=[];
            const consoleErrors=[];
            page.on('pageerror', e=>pageErrors.push(String(e)));
            page.on('console', msg=>{ if(msg.type()==='error') consoleErrors.push(msg.text()); });
            let failure=null;
            try{
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForSelector('.beginnerNav',{timeout:10000});
              await page.waitForSelector('.hd20ApprovedLanding',{timeout:10000});
              await page.waitForTimeout(700);

              const diag=await page.evaluate(()=>{
                const info=sel=>{
                  const el=document.querySelector(sel); if(!el)return null;
                  const cs=getComputedStyle(el),r=el.getBoundingClientRect();
                  return {display:cs.display,visibility:cs.visibility,opacity:cs.opacity,width:r.width,height:r.height,top:r.top,left:r.left};
                };
                const heading=document.querySelector('.hd20ALPanel h3')?.textContent?.trim()||'';
                return {
                  body:info('body'), app:info('.app'), landing:info('.hd20ApprovedLanding'), nav:info('.beginnerNav'),
                  navCount:document.querySelectorAll('.beginnerNav button[data-key]').length,
                  kpiCount:document.querySelectorAll('.hd20ALKpi').length,
                  metricCount:document.querySelectorAll('.hd20ALMetric').length,
                  heading,
                  audit:window.HD20_APPROVED_LANDING_AUDIT||null,
                  bodyClasses:document.body.className,
                  appClasses:document.querySelector('.app')?.className||''
                };
              });
              diag.pageErrors=pageErrors;
              diag.consoleErrors=consoleErrors;
              fs.writeFileSync('artifacts/main-dashboard-diagnostics.json',JSON.stringify(diag,null,2));

              const visible=x=>x&&x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity)!==0&&x.width>0&&x.height>0;
              if(!visible(diag.body)) throw new Error('body not visible: '+JSON.stringify(diag.body));
              if(!visible(diag.app)) throw new Error('app not visible: '+JSON.stringify(diag.app));
              if(!visible(diag.landing)) throw new Error('approved landing not visible: '+JSON.stringify(diag.landing));
              if(diag.navCount!==7) throw new Error(`Expected 7 nav buttons, got ${diag.navCount}`);
              if(diag.kpiCount!==5) throw new Error(`Expected 5 KPI cards, got ${diag.kpiCount}`);
              if(diag.metricCount!==6) throw new Error(`Expected 6 operating metrics, got ${diag.metricCount}`);
              if(!diag.heading.includes('판정기준') || diag.heading.includes('인정기준')) throw new Error(`Terminology mismatch: ${diag.heading}`);
              if(!diag.audit || diag.audit.valid!==true) throw new Error('Approved landing self-audit failed: '+JSON.stringify(diag.audit));
              if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
              console.log('HD20 MAIN DASHBOARD BROWSER PASS',diag);
            }catch(e){failure=e;console.error('HD20 MAIN DASHBOARD BROWSER FAIL',e);}
            finally{
              try{await page.screenshot({path:'artifacts/main-dashboard.png',fullPage:true});}catch(e){console.error('screenshot failed',e)}
              if(!fs.existsSync('artifacts/main-dashboard-diagnostics.json')){
                fs.writeFileSync('artifacts/main-dashboard-diagnostics.json',JSON.stringify({failure:String(failure),pageErrors,consoleErrors},null,2));
              }
              await browser.close();
            }
            if(failure)process.exit(1);
          })();
          NODE
          node hd20-browser-smoke.cjs

      - name: Upload main-dashboard browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-main-dashboard-browser-evidence
          path: artifacts/
          if-no-files-found: warn
