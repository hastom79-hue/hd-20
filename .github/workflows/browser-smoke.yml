name: HD20 browser smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-http.log; exit 1
      - name: Execute browser contracts
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const evidence={};let failure=null;
            const expected=['dashboard','activity','advancement','audit','action'];
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}}),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));page.on('dialog',d=>d.accept());
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForSelector('.beginnerNav');await page.waitForSelector('.hd20ApprovedLanding');await page.waitForTimeout(700);
              const main=await page.evaluate(()=>({nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),kpi:document.querySelectorAll('.hd20ALKpi').length,metric:document.querySelectorAll('.hd20ALMetric').length,landing:!!document.querySelector('.hd20ApprovedLanding'),bridge:!!document.getElementById('hd20OperationalBridge'),text:document.body.innerText}));
              if(JSON.stringify(main.nav)!==JSON.stringify(expected))throw new Error('Main nav mismatch '+JSON.stringify(main.nav));
              if(main.kpi!==5||main.metric!==6||!main.landing||!main.bridge)throw new Error('Main dashboard contract mismatch');
              if(/1개월 점검|3개월 AUDIT|6개월 AUDIT/.test(main.text))throw new Error('Legacy Audit label on main');
              if(errors.length)throw new Error('Main page errors '+errors.join(' | '));
              for(const key of ['activity','advancement','audit','action','dashboard']){await page.click(`.beginnerNav button[data-key="${key}"]`);await page.waitForTimeout(120)}
              evidence.main={nav:main.nav,kpi:main.kpi,metric:main.metric};
              await page.screenshot({path:'artifacts/main-dashboard.png',fullPage:true});

              await page.evaluate(()=>{
                localStorage.removeItem('hd20AuditRandomDrawsV1');
                localStorage.removeItem('hd20ActionCasesV2');
                localStorage.setItem('hd20OperatingPolicyV1',JSON.stringify({auditRisk:{enabled:false,weights:null,sampleCount:3},improvementDeadline:{minDays:7,maxDays:14,defaultDays:7}}));
              });
              await page.reload({waitUntil:'networkidle'});await page.click('.beginnerNav button[data-key="audit"]');
              await page.waitForSelector('.auditDraw [data-draw="pick"]',{timeout:10000});await page.click('.auditDraw [data-draw="pick"]');
              await page.waitForFunction(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]');return d.length>=3&&d[0].batchId},{},{timeout:10000});
              await page.waitForSelector('#hd20AuditBatchExecution select[data-abe-select] option',{timeout:10000});
              const before=await page.evaluate(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),id=d[0]?.batchId,b=d.filter(x=>x.batchId===id);return{batchId:id,count:b.length,uniqueTeams:new Set(b.map(x=>x.team)).size,teams:b.map(x=>x.team),options:document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length}});
              if(before.count!==3||before.uniqueTeams!==3||before.options!==3)throw new Error('Batch extraction contract '+JSON.stringify(before));
              await page.fill('.auditClosedLoop [data-cl-date]','2026-09-02');await page.selectOption('.auditClosedLoop [data-cl-result]',{label:'적합'});await page.fill('.auditClosedLoop [data-cl-workplace]','E2E Audit Workplace');await page.fill('.auditClosedLoop [data-cl-auditor]','E2E Tester');await page.click('.auditClosedLoop [data-cl-save]');
              await page.waitForFunction(()=>JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').filter(x=>x.auditDate).length===1,{},{timeout:10000});
              await page.waitForFunction(()=>document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length===2,{},{timeout:10000});
              const after=await page.evaluate(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),c=d.filter(x=>x.auditDate);return{completed:c.length,auditDate:c[0]?.auditDate||null,auditResult:c[0]?.auditResult||null,pendingOptions:document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length}});
              if(after.completed!==1||after.auditDate!=='2026-09-02'||after.auditResult!=='적합'||after.pendingOptions!==2)throw new Error('Batch execution contract '+JSON.stringify(after));
              evidence.auditBatch={before,after};await page.screenshot({path:'artifacts/audit-batch-execution.png',fullPage:true});

              const hp=await browser.newPage({viewport:{width:1440,height:1000}}),hpErrors=[];hp.on('pageerror',e=>hpErrors.push(String(e)));
              await hp.goto('http://127.0.0.1:4173/hdps-dashboard.html',{waitUntil:'networkidle',timeout:30000});await hp.waitForSelector('#hpKpis .hpKpi');await hp.waitForSelector('#hpActionRows .hpActionRow');
              const hdps=await hp.evaluate(()=>({nav:[...document.querySelectorAll('.hpNav button[data-hp-nav]')].map(x=>x.dataset.hpNav),kpi:document.querySelectorAll('#hpKpis .hpKpi').length,actions:document.querySelectorAll('#hpActionRows .hpActionRow').length,labels:[...document.querySelectorAll('#hpKpis .hpKpi small')].map(x=>x.textContent.trim()),actionLabels:[...document.querySelectorAll('#hpActionRows .hpActionRow > span:first-child')].map(x=>x.textContent.trim()),text:document.body.innerText}));
              if(JSON.stringify(hdps.nav)!==JSON.stringify(expected)||hdps.kpi!==6||hdps.actions!==4)throw new Error('HDPS dashboard contract mismatch');
              if(!hdps.labels.includes('Audit 후 6개월 유지율'))throw new Error('HDPS six-month KPI missing');
              for(const l of ['Audit 실시 대기','Audit 후 6개월 관리중','개선조치 미완료','개선조치 기한경과'])if(!hdps.actionLabels.includes(l))throw new Error('HDPS action label missing '+l);
              if(/1개월 점검|3개월 Audit|6개월 Audit|1·3·6개월/.test(hdps.text))throw new Error('Legacy lifecycle on HDPS dashboard');
              if(hpErrors.length)throw new Error('HDPS page errors '+hpErrors.join(' | '));
              evidence.hdps={nav:hdps.nav,kpi:hdps.kpi,actions:hdps.actions};await hp.screenshot({path:'artifacts/hdps-dashboard.png',fullPage:true});await hp.close();
              fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify(evidence,null,2));console.log('HD20 BROWSER CONTRACTS PASS',evidence);
            }catch(e){failure=e;fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify({...evidence,failure:String(e)},null,2));console.error(e)}finally{await browser.close()}
            if(failure)process.exit(1);
          })();
          NODE
          node --check hd20-browser-smoke.cjs
          node hd20-browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-five-area-browser-evidence
          path: artifacts/
          if-no-files-found: warn
