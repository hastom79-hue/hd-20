              page.on('pageerror',e=>{const detail={message:String(e),stack:e?.stack||'',name:e?.name||''};errors.push(detail);console.error('PAGE_ERROR_DETAIL',JSON.stringify(detail));});
              page.on('dialog',d=>d.accept());
              page.on('request',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.localRequests.push(u.pathname)});
              page.on('requestfinished',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.finished.push(u.pathname)});
              await page.route('**/*',route=>{
                const req=route.request(),u=new URL(req.url());
                if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
                if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                return route.abort('blockedbyclient');
              });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:10000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardPriority'),{},{timeout:15000});
              await page.waitForFunction(()=>!!document.getElementById('hd20OperationalBridge'),{},{timeout:15000});
              await page.waitForTimeout(500);
              const main=await page.evaluate(()=>({readyState:document.readyState,nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),bodyVisible:getComputedStyle(document.body).visibility!=='hidden',authPending:document.documentElement.classList.contains('hd20-auth-pending'),priority:document.querySelectorAll('#hd20DashboardPriority').length,bridge:!!document.getElementById('hd20OperationalBridge'),kpi:document.querySelectorAll('.cards .kpi').length,metric:document.querySelectorAll('.hd20HealthKpi').length,legacyLanding:document.querySelectorAll('.hd20ApprovedLanding').length,text:document.body.innerText}));
