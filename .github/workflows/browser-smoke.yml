name: HD20 browser smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-http.log; exit 1
      - name: Execute browser boot and five-area contracts
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const evidence={localRequests:[],finished:[]}; let failure=null,errors=[];
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              page.on('pageerror',e=>{const detail={message:String(e),stack:e?.stack||'',name:e?.name||''};errors.push(detail);console.error('PAGE_ERROR_DETAIL',JSON.stringify(detail));});
              page.on('dialog',d=>d.accept());
              page.on('request',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.localRequests.push(u.pathname)});
              page.on('requestfinished',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.finished.push(u.pathname)});
              await page.route('**/*',route=>{
                const req=route.request(),u=new URL(req.url());
                if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
                if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                return route.abort('blockedbyclient');
              });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:10000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardPriority'),{},{timeout:15000});
              /* 최근 추가된 "랜딩 런처" 팝업이 첫 로드 시 떠서 이후 클릭을 가로채는 문제 발견
                 (#hd20Launcher가 pointer-events를 intercept) — CI가 이 기능을 전혀 몰라 추가. */
              await page.evaluate(()=>{document.querySelector('[data-ln="skip"]')?.click()||document.getElementById('hd20Launcher')?.remove()});
              await page.waitForTimeout(300);
              await page.waitForFunction(()=>!!document.getElementById('hd20OperationalBridge'),{},{timeout:15000});
              await page.waitForTimeout(500);
              const main=await page.evaluate(()=>({readyState:document.readyState,nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),bodyVisible:getComputedStyle(document.body).visibility!=='hidden',authPending:document.documentElement.classList.contains('hd20-auth-pending'),priority:document.querySelectorAll('#hd20DashboardPriority').length,bridge:!!document.getElementById('hd20OperationalBridge'),kpi:document.querySelectorAll('.cards .kpi').length,metric:document.querySelectorAll('#hd20DashboardPriority .hd20HealthTrendCard').length,legacyLanding:document.querySelectorAll('.hd20ApprovedLanding').length,text:document.body.innerText}));
              const expected=['dashboard','activity','audit','theme','action','advancement','master'];
              if(JSON.stringify(main.nav)!==JSON.stringify(expected))throw new Error('Main nav mismatch '+JSON.stringify(main));
              if(!main.bodyVisible||main.authPending||main.priority!==1||!main.bridge)throw new Error('Boot contract mismatch '+JSON.stringify(main));
              if(main.kpi!==5||main.metric!==6||main.legacyLanding!==0)throw new Error('Main dashboard contract mismatch '+JSON.stringify({kpi:main.kpi,metric:main.metric,legacyLanding:main.legacyLanding}));
              const retired=await page.evaluate(()=>({workflow:!!document.querySelector('.beginnerHint'),opsMetrics:!!document.querySelector('#hd20OpsMetrics'),standardTrend:[...document.querySelectorAll('.hd20DashboardSectionLabel')].some(el=>/STANDARD\s*&\s*TREND|판정기준\s*·?\s*고도화\s*추이/.test(el.textContent||''))}));
              if(retired.workflow||retired.opsMetrics||retired.standardTrend)throw new Error('Retired dashboard chrome remains '+JSON.stringify(retired));
              if(/1개월 점검|3개월 AUDIT|6개월 AUDIT/.test(main.text))throw new Error('Legacy Audit label on main');
              if(errors.length)throw new Error('Main page errors '+JSON.stringify(errors));
              await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="advancement"]')?.click());await page.waitForTimeout(300);
              /* 다른 세션이 "고도화·표준화 탭은 대시보드 드릴다운으로 흡수"를 이미 완료해, advancement
                 메인 버튼 자체가 숨겨지는 것이 현재 정상 상태임 — 버튼을 클릭해 들어가는 화면 검증은
                 더 이상 유효한 사용자 흐름이 아니므로 제거하고, 버튼이 DOM에 존재하는지만 확인. */
              const advBtn=await page.evaluate(()=>{const b=document.querySelector('.beginnerNav button[data-key="advancement"]');return{exists:!!b,hidden:!b||getComputedStyle(b).display==='none'}});
              if(!advBtn.exists)throw new Error('Advancement button missing from DOM '+JSON.stringify(advBtn));
              evidence.advancement=advBtn;
              for(const key of ['activity','audit','action','dashboard']){await page.evaluate(k=>document.querySelector(`.beginnerNav button[data-key="${k}"]`)?.click(),key);await page.waitForTimeout(120)}
              const validation=await browser.newPage({viewport:{width:1440,height:1000}});
              validation.on('dialog',d=>d.accept());
              await validation.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});return route.abort('blockedbyclient')});
              await validation.goto('http://127.0.0.1:4173/index.html?validation=1',{waitUntil:'commit',timeout:15000});
              await validation.waitForFunction(()=>!!window.HD20KPIData&&!!document.getElementById('hd20ValidationBanner'),{},{timeout:20000});
              /* validation 페이지도 별도 newPage이므로 랜딩 런처 팝업을 별도로 닫아야 함(그렇지
                 않으면 이후 모든 getByRole(...).click() 호출이 #hd20Launcher에 가로막혀 타임아웃). */
              await validation.evaluate(()=>{document.querySelector('[data-ln="skip"]')?.click()||document.getElementById('hd20Launcher')?.remove()});
              await validation.waitForTimeout(300);
              const validationState=await validation.evaluate(()=>{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');const a=read('hd20GMES5SAutoImproveRawV1'),u=read('hd20AuditRandomDrawsV1'),x=read('hd20ActionCasesV2'),snap=window.HD20KPIData.snapshot?.()||{},teams=[...new Set(a.map(r=>r.team).filter(Boolean))],auditTeams=[...new Set(u.map(r=>r.team).filter(Boolean))],actionTeams=[...new Set(x.map(r=>r.team).filter(Boolean))];return{a:a.length,u:u.length,x:x.length,teams:teams.length,auditTeams:auditTeams.length,actionTeams:actionTeams.length,kpiActivities:(snap.activities||[]).length,kpiCandidates:(snap.candidates||[]).length,kpiConfirmed:(snap.newSecured||[]).length,kpiAuditRows:window.HD20KPIData?.sixMonthRetention?.()??null,kpiActionRows:window.HD20KPIData?.actionCases?.().length??0,kpiOperational:window.HD20KPIData?.operational?.(snap)||null,kpiPeople:snap.headcount??null,banner:document.getElementById('hd20ValidationBanner')?.innerText||'',isolated:window.HD20_VALIDATION_ISOLATED===true}});
              console.log('VALIDATION_STATE',JSON.stringify(validationState));if(validationState.a<800||validationState.u<300||validationState.x<600||validationState.teams!==17||validationState.auditTeams!==17||validationState.actionTeams!==17||validationState.kpiActivities<800)throw new Error('Validation data/team coverage contract mismatch '+JSON.stringify(validationState));
              /* 전체 스크립트 defer 전환(로딩 성능 개선) 이후, HD20_DASHBOARD_TABS 같은 지연 로드
                 스크립트의 전역 노출이 비동기적으로 늦어질 수 있음 — apply() 호출 전에 반드시 준비될
                 때까지 기다려야 함(고정 대기 시간에 의존하면 타이밍에 따라 간헐적으로 실패함). */
              await validation.waitForFunction(()=>!!window.HD20_DASHBOARD_TABS?.apply,{},{timeout:15000});
              await validation.evaluate(()=>{window.HD20_NAV?.go?.('dashboard');window.HD20_DASHBOARD_TABS?.apply?.('map',{scroll:false})});
              await validation.waitForFunction(()=>{const r=document.getElementById('hd20MaturityMapTab');if(!(r&&!r.hidden))return false;const data=r.querySelectorAll('.mmtDot,.mmtTeam,table tbody tr,[data-row-id],[data-case-id]');return data.length>0||((r.innerText||'').trim().length>300)},{},{timeout:30000});
              validationState.maturity=await validation.evaluate(()=>({dots:document.querySelectorAll('#hd20MaturityMapTab .mmtDot').length,teams:document.querySelectorAll('#hd20MaturityMapTab .mmtTeam').length}));
              const coverage={dashboard:{}};
              await validation.evaluate(()=>window.HD20_NAV?.go?.('dashboard'));await validation.waitForTimeout(120);
              for(const key of ['summary','improve','request','map']){await validation.evaluate(k=>document.querySelector(`#hd20DashboardSectionTabs button[data-dashboard-section="${k}"]`)?.click(),key);await validation.waitForTimeout(180);coverage.dashboard[key]=await validation.evaluate(()=>{const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const nodes=[...document.querySelectorAll('.app section,.app .card,.app .cards,.app .mainGrid,.app .bottomGrid')].filter(vis);const data=[...document.querySelectorAll('.app .metric,.app .kpiCard,.app .mmtDot,.app .mmtTeam,.app table tbody tr,.app [data-case-id],.app [data-row-id]')].filter(vis);const de=document.documentElement,b=document.body;return{visible:nodes.length,visibleData:data.length,text:(document.querySelector('.app')?.innerText||'').trim().length,overflow:Math.max(de.scrollWidth,b.scrollWidth)-de.clientWidth}})}
              coverage.areas={};
              /* activity 영역은 최근 UX 변경으로 클릭 시 서브탭 체계 대신 "통합조회" 화면(body.
                 hd20InquiryActive)이 기본으로 뜨도록 바뀌어, 서브탭 바가 의도적으로 숨겨짐(실측
                 확인: dashboard를 거치지 않고 activity를 바로 클릭해도 동일) — 깊은 서브탭 검증
                 대상에서 제외하고 통합조회 화면 자체를 별도로 가볍게 확인. */
              const areaSubs={advancement:['확정사례 관리'],audit:['① Audit 실시','② 유지점검','③ 결과·재조치'],action:['① 개선조치 등록·실행','② 미완료·지연관리','③ 효과검증·최종종결']};
              await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="activity"]')?.click());
              await page.waitForTimeout(500);
              const activityInquiry=await page.evaluate(()=>({inquiryActive:document.body.classList.contains('hd20InquiryActive'),hasRegisterBtn:[...document.querySelectorAll('button')].some(b=>b.textContent.includes('신규등록'))}));
              if(!activityInquiry.inquiryActive||!activityInquiry.hasRegisterBtn)throw new Error('Activity inquiry screen contract '+JSON.stringify(activityInquiry));
              coverage.activityInquiry=activityInquiry;
              for(const [area,subs] of Object.entries(areaSubs)){await validation.evaluate(a=>document.querySelector(`.beginnerNav button[data-key="${a}"]`)?.click(),area);await validation.waitForFunction(()=>!!document.querySelector('#hd20PurposePanel'),{},{timeout:45000});coverage.areas[area]={};for(const sub of subs){await validation.getByRole('button',{name:sub,exact:true}).click();await validation.waitForTimeout(120);coverage.areas[area][sub]=await validation.evaluate(()=>{const p=document.querySelector('#hd20PurposePanel'),root=document.querySelector('.hd20AreaOn,.on');const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const dataNodes=[...document.querySelectorAll('table tbody tr,.awCard,.metric,.kpiCard,.actionCard,.mmtBarRow,.mmtKpi,.bottomGrid > .card,[data-case-id],[data-row-id]')].filter(vis);return{contract:p?.dataset.contract||'',purposeText:(p?.innerText||'').trim().length,visibleTables:[...document.querySelectorAll('table')].filter(t=>t.offsetParent!==null&&t.rows.length>1).length,visibleData:dataNodes.length,bodyText:(document.body.innerText||'').trim().length}})}}
              // Advancement body ownership: exactly one current owner, never legacy awWorkplace.
              /* "① 3대요건 즉시판정" 서브탭 및 고도화 맵 연동이 제거되어 advancement 영역에는 standard 하나만 남음 — 소유권 검증 범위를 실제 구조에 맞게 축소. */
              const advOwners={standard:'#hd20AdvStandardOperational'};
              coverage.advancementOwnership={};
              await validation.evaluate(()=>window.HD20_NAV?.go?.('advancement'));await validation.waitForTimeout(180);
              for(const [sub,selector] of Object.entries(advOwners)){await validation.evaluate(s=>window.HD20_SUBNAV?.select?.('advancement',s),sub);await validation.waitForTimeout(180);coverage.advancementOwnership[sub]=await validation.evaluate(({sub,selector,all})=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return !e.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const owner=document.querySelector(selector);return{sub,expectedVisible:vis(owner),visibleOwners:Object.entries(all).filter(([,sel])=>vis(document.querySelector(sel))).map(([k])=>k),legacyVisible:vis(document.getElementById('awWorkplace'))}}, {sub,selector,all:advOwners});}
              console.log('ADV_TREND_VISIBILITY_DIAGNOSTIC',JSON.stringify(await validation.evaluate(()=>{const el=document.querySelector('.bottomGrid');const chain=[];for(let p=el;p&&chain.length<7;p=p.parentElement){const s=getComputedStyle(p),r=p.getBoundingClientRect();chain.push({tag:p.tagName,id:p.id,classes:p.className,hidden:p.hidden,display:s.display,visibility:s.visibility,width:r.width,height:r.height})}return {chain,children:el?[...el.children].map(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return {tag:x.tagName,classes:x.className,hidden:x.hidden,display:s.display,visibility:s.visibility,height:r.height,inlineStyle:x.getAttribute('style'),descendants:[...x.querySelectorAll(':scope > *')].map(y=>{const q=getComputedStyle(y),z=y.getBoundingClientRect();return {tag:y.tagName,classes:y.className,hidden:y.hidden,display:q.display,height:z.height,style:y.getAttribute('style')}})}}):[],bodyClasses:document.body.className,activeNav:window.HD20_NAV?.active?.(),activeSub:window.HD20_SUBNAV?.active?.()}})));for(const [sub,v] of Object.entries(coverage.advancementOwnership))if(!v.expectedVisible||v.visibleOwners.length!==1||v.visibleOwners[0]!==sub||v.legacyVisible)throw new Error('Advancement ownership mismatch '+JSON.stringify(v));
              const bad=[];console.log('DASHBOARD_COVERAGE',JSON.stringify(coverage.dashboard));for(const [k,v] of Object.entries(coverage.dashboard))if(v.visible<1||v.text<100||v.overflow>2)bad.push('dashboard.'+k);/* hd20-subtabs.js의 renderPurpose()가 area==='audit'||area==='action'일 때는 "화면 안내" 패널을
