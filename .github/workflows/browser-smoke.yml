              await validation.goto('http://127.0.0.1:4173/index.html?validation=0',{waitUntil:'commit',timeout:15000});await validation.waitForFunction(()=>!!window.HD20KPIData&&new URL(location.href).searchParams.get('validation')==='0',{},{timeout:20000});const normalAfterValidation=await validation.evaluate(()=>{const snap=window.HD20KPIData.snapshot?.()||{},rows=[...(snap.activities||[]),...(snap.candidates||[]),...(snap.newSecured||[])];return{activities:(snap.activities||[]).length,candidates:(snap.candidates||[]).length,confirmed:(snap.newSecured||[]).length,validationRows:rows.filter(x=>String(x?.source||'').toLowerCase()==='web-validation-fixture'||String(x?.id||'').toUpperCase().startsWith('VALID-')||String(x?.sourceCaseId||'').toUpperCase().startsWith('VALID-')).length,isolated:window.HD20_VALIDATION_ISOLATED===true}});console.log('NORMAL_AFTER_VALIDATION',JSON.stringify(normalAfterValidation));if(normalAfterValidation.validationRows!==0)throw new Error('Validation rows leaked into normal KPI mode '+JSON.stringify(normalAfterValidation));
              // Default empty-data fallback regression: normal URL must become testable without overwriting production/recovery data.
