name: HD20 browser smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-http.log; exit 1
      - name: Execute browser boot and five-area contracts
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const evidence={localRequests:[],finished:[]}; let failure=null;
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}}),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('dialog',d=>d.accept());
              page.on('request',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.localRequests.push(u.pathname)});
              page.on('requestfinished',r=>{const u=new URL(r.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')evidence.finished.push(u.pathname)});
              await page.route('**/*',route=>{
                const req=route.request(),u=new URL(req.url());
                if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
                if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
                return route.abort('blockedbyclient');
              });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:10000});
              await page.waitForFunction(()=>!!document.getElementById('hd20DashboardPriority'),{},{timeout:15000});
              await page.waitForFunction(()=>!!document.getElementById('hd20OperationalBridge'),{},{timeout:15000});
              await page.waitForTimeout(500);
              const main=await page.evaluate(()=>({readyState:document.readyState,nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),bodyVisible:getComputedStyle(document.body).visibility!=='hidden',authPending:document.documentElement.classList.contains('hd20-auth-pending'),priority:document.querySelectorAll('#hd20DashboardPriority').length,bridge:!!document.getElementById('hd20OperationalBridge'),kpi:document.querySelectorAll('.cards .kpi').length,metric:document.querySelectorAll('.hd20HealthKpi').length,legacyLanding:document.querySelectorAll('.hd20ApprovedLanding').length,text:document.body.innerText}));
              const expected=['dashboard','activity','advancement','audit','action'];
              if(JSON.stringify(main.nav)!==JSON.stringify(expected))throw new Error('Main nav mismatch '+JSON.stringify(main));
              if(!main.bodyVisible||main.authPending||main.priority!==1||!main.bridge)throw new Error('Boot contract mismatch '+JSON.stringify(main));
              if(main.kpi!==5||main.metric!==6||main.legacyLanding!==0)throw new Error('Main dashboard contract mismatch '+JSON.stringify({kpi:main.kpi,metric:main.metric,legacyLanding:main.legacyLanding}));
              if(/1개월 점검|3개월 AUDIT|6개월 AUDIT/.test(main.text))throw new Error('Legacy Audit label on main');
              if(errors.length)throw new Error('Main page errors '+errors.join(' | '));
              await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="advancement"]')?.click());
              await page.waitForFunction(()=>document.getElementById('performanceConversionAnalysis')?.classList.contains('on'),{},{timeout:10000});
              const advancement=await page.evaluate(()=>{const el=document.getElementById('performanceConversionAnalysis'),text=el?.innerText||'';return{visible:!!el?.classList.contains('on'),hasSeparation:text.includes('조건 충족 수준과 공식 판정은 분리'),hasActor:text.includes('생산혁신팀 + 5S 모듈 판정'),hasFakeOwner:text.includes('생산혁신팀 메인 담당자'),hasAutoConfirm:/2개 이상.*확정|조건 충족.*자동.*확정/.test(text)}});
              if(!advancement.visible||!advancement.hasSeparation||!advancement.hasActor||advancement.hasFakeOwner||advancement.hasAutoConfirm)throw new Error('Advancement semantic contract '+JSON.stringify(advancement));
              evidence.advancement=advancement;
              for(const key of ['activity','audit','action','dashboard']){await page.evaluate(k=>document.querySelector(`.beginnerNav button[data-key="${k}"]`)?.click(),key);await page.waitForTimeout(120)}
              await page.waitForFunction(()=>!!document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]'),{},{timeout:10000});
              await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]')?.click());await page.waitForTimeout(250);
              const maturity=await page.evaluate(()=>{const el=document.getElementById('hd20MaturityMapTab');return {active:window.HD20_DASHBOARD_TABS?.active?.(),navActive:window.HD20_NAV?.active?.(),mapVisible:!!el&&!el.hidden&&getComputedStyle(el).display!=='none',standaloneNav:!!document.querySelector('.beginnerNav button[data-key="maturitymap"]'),urlTab:new URL(location.href).searchParams.get('tab')}});
              if(maturity.active!=='maturity'||maturity.navActive!=='dashboard'||!maturity.mapVisible||maturity.standaloneNav||maturity.urlTab==='maturitymap')throw new Error('Maturity bridge mismatch '+JSON.stringify(maturity));
              evidence.main={readyState:main.readyState,nav:main.nav,bodyVisible:main.bodyVisible,authPending:main.authPending,priority:main.priority,bridge:main.bridge,kpi:main.kpi,metric:main.metric,legacyLanding:main.legacyLanding};evidence.maturity=maturity;evidence.pageErrors=errors;
              await page.screenshot({path:'artifacts/main-dashboard.png',fullPage:true});
              fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify(evidence,null,2));
              console.log('HD20 BROWSER BOOT/FIVE-AREA PASS',evidence);
            }catch(e){failure=e;evidence.failure=String(e);fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify(evidence,null,2));console.error('BOOT TRACE',JSON.stringify({requested:evidence.localRequests.slice(-12),finished:evidence.finished.slice(-12)},null,2));console.error(e)}finally{await browser.close()}
            if(failure)process.exit(1);
          })();
          NODE
          node --check hd20-browser-smoke.cjs
          node hd20-browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-five-area-browser-evidence
          path: artifacts/
          if-no-files-found: warn
