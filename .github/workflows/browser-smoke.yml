name: HD20 browser smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-http.log; exit 1
      - name: Execute five-area browser contract
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1000});const errors=[];page.on('pageerror',e=>errors.push(String(e)));let failure=null;
          try{await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});await page.waitForSelector('.beginnerNav',{timeout:10000});await page.waitForSelector('.hd20ApprovedLanding',{timeout:10000});await page.waitForTimeout(1000);
          const d=await page.evaluate(()=>({nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),kpi:document.querySelectorAll('.hd20ALKpi').length,metric:document.querySelectorAll('.hd20ALMetric').length,landing:!!document.querySelector('.hd20ApprovedLanding'),bridge:!!document.getElementById('hd20OperationalBridge'),audit:window.HD20_APPROVED_LANDING_AUDIT||null}));
          if(JSON.stringify(d.nav)!==JSON.stringify(['dashboard','activity','advancement','audit','action']))throw new Error('Five-area nav mismatch '+JSON.stringify(d.nav));if(d.kpi!==5)throw new Error('KPI count '+d.kpi);if(d.metric!==6)throw new Error('metric count '+d.metric);if(!d.landing)throw new Error('landing missing');if(!d.bridge)throw new Error('operational bridge missing');if(errors.length)throw new Error(errors.join(' | '));fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify(d,null,2));
          for(const key of ['activity','advancement','audit','action','dashboard']){await page.click(`.beginnerNav button[data-key="${key}"]`);await page.waitForTimeout(150);}
          console.log('HD20 FIVE AREA BROWSER PASS',d)}catch(e){failure=e;console.error(e)}finally{try{await page.screenshot({path:'artifacts/main-dashboard.png',fullPage:true})}catch{}await browser.close()}if(failure)process.exit(1)})();
          NODE
          node hd20-browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-five-area-browser-evidence
          path: artifacts/
          if-no-files-found: warn
