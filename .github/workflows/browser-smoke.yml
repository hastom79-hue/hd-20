name: HD20 browser smoke

on:
  push:
    branches: [main, hd20-overhaul-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-http.log; exit 1
      - name: Execute browser contracts
        run: |
          mkdir -p artifacts
          cat > hd20-browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const evidence={};let failure=null;
            const expectedMain=['dashboard','activity','advancement','audit','action'];
            const expectedHdps=['dashboard','activity','advancement','audit','action'];
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}}),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));page.on('dialog',d=>d.accept());
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForSelector('.beginnerNav');await page.waitForSelector('#hd20DashboardPriority');await page.waitForSelector('#hd20OperationalBridge');await page.waitForTimeout(700);
              const main=await page.evaluate(()=>({nav:[...document.querySelectorAll('.beginnerNav button[data-key]')].map(x=>x.dataset.key),kpi:document.querySelectorAll('.cards .kpi').length,metric:document.querySelectorAll('.hd20HealthKpi').length,priority:document.querySelectorAll('#hd20DashboardPriority').length,legacyLanding:document.querySelectorAll('.hd20ApprovedLanding').length,bridge:!!document.getElementById('hd20OperationalBridge'),text:document.body.innerText}));
              if(JSON.stringify(main.nav)!==JSON.stringify(expectedMain))throw new Error('Main nav mismatch '+JSON.stringify(main.nav));
              if(main.kpi!==5||main.metric!==6||main.priority!==1||main.legacyLanding!==0||!main.bridge)throw new Error('Main dashboard contract mismatch '+JSON.stringify(main));
              if(/1개월 점검|3개월 AUDIT|6개월 AUDIT/.test(main.text))throw new Error('Legacy Audit label on main');
              if(errors.length)throw new Error('Main page errors '+errors.join(' | '));

              await page.click('.beginnerNav button[data-key="advancement"]');
              await page.waitForSelector('#performanceConversionAnalysis.on',{timeout:10000});
              const advancement=await page.evaluate(()=>{const el=document.getElementById('performanceConversionAnalysis'),text=el?.innerText||'';return{visible:!!el?.classList.contains('on'),text,hasSeparation:text.includes('조건 충족 수준과 공식 판정은 분리'),hasActor:text.includes('생산혁신팀 + 5S 모듈 판정'),hasFakeOwner:text.includes('생산혁신팀 메인 담당자'),hasAutoConfirm:/2개 이상.*확정|조건 충족.*자동.*확정/.test(text)}});
              if(!advancement.visible||!advancement.hasSeparation||!advancement.hasActor||advancement.hasFakeOwner||advancement.hasAutoConfirm)throw new Error('Advancement semantic contract '+JSON.stringify(advancement));
              evidence.advancement={visible:advancement.visible,hasSeparation:advancement.hasSeparation,hasActor:advancement.hasActor,hasFakeOwner:advancement.hasFakeOwner,hasAutoConfirm:advancement.hasAutoConfirm};
              await page.screenshot({path:'artifacts/advancement-canonical.png',fullPage:true});

              for(const key of ['activity','audit','action','dashboard']){await page.click(`.beginnerNav button[data-key="${key}"]`);await page.waitForTimeout(120)}
              await page.waitForSelector('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]',{timeout:10000});
              await page.click('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]');await page.waitForTimeout(180);
              const maturity=await page.evaluate(()=>({active:window.HD20_DASHBOARD_TABS?.active?.(),navActive:window.HD20_NAV?.active?.(),mapVisible:!!document.getElementById('hd20MaturityMapTab')&&!document.getElementById('hd20MaturityMapTab').classList.contains('hd20DashboardSectionHidden'),standaloneNav:!!document.querySelector('.beginnerNav button[data-key="maturitymap"]'),urlTab:new URL(location.href).searchParams.get('tab')}));
              if(maturity.active!=='maturity'||maturity.navActive!=='dashboard'||!maturity.mapVisible||maturity.standaloneNav||maturity.urlTab==='maturitymap')throw new Error('Dashboard maturity contract '+JSON.stringify(maturity));
              evidence.maturity=maturity;
              await page.click('#hd20DashboardSectionTabs button[data-dashboard-section="summary"]');await page.waitForTimeout(120);
              evidence.main={nav:main.nav,kpi:main.kpi,metric:main.metric,priority:main.priority,legacyLanding:main.legacyLanding};
              await page.screenshot({path:'artifacts/main-dashboard.png',fullPage:true});

              await page.evaluate(()=>{
                localStorage.removeItem('hd20ActionCasesV2');
                localStorage.setItem('hd20OperatingPolicyV1',JSON.stringify({auditRisk:{enabled:false,weights:null,sampleCount:3},improvementDeadline:{minDays:7,maxDays:14,defaultDays:7}}));
              });
              await page.reload({waitUntil:'networkidle'});await page.click('.beginnerNav button[data-key="action"]');
              await page.waitForFunction(()=>!!window.HD20ActionAuditLinkage&&!!document.getElementById('amDraft'),{},{timeout:10000});
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('hd20-audit-to-action',{detail:{auditDrawId:'E2E-LINK-1',sourceStage:'AUDIT-CHECKLIST',team:'성능팀',problem:'[5S Audit 미흡] E2E linkage'}})));
              await page.fill('#amDate','2026-09-02');await page.fill('#amDue','');await page.fill('#amWorkplace','E2E Link Workplace');await page.fill('#amProblem','[5S Audit 미흡] E2E linkage');await page.click('#amDraft');
              await page.waitForFunction(()=>JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').some(x=>x.sourceCaseId==='E2E-LINK-1'),{},{timeout:10000});
              const linkAuto=await page.evaluate(()=>{const x=JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').find(v=>v.sourceCaseId==='E2E-LINK-1');return{sourceCaseId:x?.sourceCaseId,auditDrawId:x?.auditDrawId,due:x?.due,registeredAt:x?.registeredAt,policy:x?.autoDuePolicyState,days:x?.autoDueDays}});
              if(linkAuto.sourceCaseId!=='E2E-LINK-1'||linkAuto.auditDrawId!=='E2E-LINK-1'||linkAuto.due!=='2026-09-09'||linkAuto.registeredAt!=='2026-09-02'||linkAuto.policy!=='자동지정'||linkAuto.days!==7)throw new Error('Audit action auto-deadline linkage '+JSON.stringify(linkAuto));

              await page.evaluate(()=>localStorage.setItem('hd20OperatingPolicyV1',JSON.stringify({auditRisk:{enabled:false,weights:null,sampleCount:3},improvementDeadline:{minDays:7,maxDays:14,defaultDays:null}})));
              await page.fill('#amDue','');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('hd20-audit-to-action',{detail:{auditDrawId:'E2E-LINK-2',sourceStage:'AUDIT-CHECKLIST',team:'성능팀',problem:'[5S Audit 미흡] E2E no policy'}})));
              await page.fill('#amDate','2026-09-02');await page.fill('#amWorkplace','E2E No Policy Workplace');await page.fill('#amProblem','[5S Audit 미흡] E2E no policy');await page.click('#amDraft');
              await page.waitForFunction(()=>JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').some(x=>x.sourceCaseId==='E2E-LINK-2'),{},{timeout:10000});
              const linkUnset=await page.evaluate(()=>{const x=JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').find(v=>v.sourceCaseId==='E2E-LINK-2');return{sourceCaseId:x?.sourceCaseId,due:x?.due||'',policy:x?.autoDuePolicyState}});
              if(linkUnset.sourceCaseId!=='E2E-LINK-2'||linkUnset.due!==''||linkUnset.policy!=='정책미설정')throw new Error('Audit action unset-policy linkage '+JSON.stringify(linkUnset));
              evidence.auditActionLink={auto:linkAuto,unset:linkUnset};await page.screenshot({path:'artifacts/audit-action-linkage.png',fullPage:true});

              await page.evaluate(()=>{
                localStorage.removeItem('hd20AuditRandomDrawsV1');
                localStorage.removeItem('hd20ActionCasesV2');
                localStorage.setItem('hd20OperatingPolicyV1',JSON.stringify({auditRisk:{enabled:false,weights:null,sampleCount:3},improvementDeadline:{minDays:7,maxDays:14,defaultDays:7}}));
              });
              await page.reload({waitUntil:'networkidle'});await page.click('.beginnerNav button[data-key="audit"]');
              await page.waitForSelector('.auditDraw [data-draw="pick"]',{timeout:10000});await page.click('.auditDraw [data-draw="pick"]');
              await page.waitForFunction(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]');return d.length>=3&&d[0].batchId},{},{timeout:10000});
              await page.waitForFunction(()=>document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length===3,{},{timeout:10000});
              const before=await page.evaluate(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),id=d[0]?.batchId,b=d.filter(x=>x.batchId===id);return{batchId:id,count:b.length,uniqueTeams:new Set(b.map(x=>x.team)).size,teams:b.map(x=>x.team),options:document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length}});
              if(before.count!==3||before.uniqueTeams!==3||before.options!==3)throw new Error('Batch extraction contract '+JSON.stringify(before));
              await page.fill('.auditClosedLoop [data-cl-date]','2026-09-02');await page.selectOption('.auditClosedLoop [data-cl-result]',{label:'적합'});await page.fill('.auditClosedLoop [data-cl-workplace]','E2E Audit Workplace');await page.fill('.auditClosedLoop [data-cl-auditor]','E2E Tester');await page.click('.auditClosedLoop [data-cl-save]');
              await page.waitForFunction(()=>JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').filter(x=>x.auditDate).length===1,{},{timeout:10000});
              await page.waitForFunction(()=>document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length===2,{},{timeout:10000});
              const after=await page.evaluate(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),c=d.filter(x=>x.auditDate);return{completed:c.length,auditDate:c[0]?.auditDate||null,auditResult:c[0]?.auditResult||null,pendingOptions:document.querySelectorAll('#hd20AuditBatchExecution select[data-abe-select] option').length}});
              if(after.completed!==1||after.auditDate!=='2026-09-02'||after.auditResult!=='적합'||after.pendingOptions!==2)throw new Error('Batch execution contract '+JSON.stringify(after));
              evidence.auditBatch={before,after};await page.screenshot({path:'artifacts/audit-batch-execution.png',fullPage:true});

              await page.evaluate(()=>{
                const draws=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]');
                draws.unshift({id:'E2E-CLOSE-1',team:'성능팀',date:'2026-01-31T00:00:00.000Z',auditDate:'2026-02-01',auditResult:'적합',workplace:'E2E Close Workplace',auditor:'E2E Tester'});
                localStorage.setItem('hd20AuditRandomDrawsV1',JSON.stringify(draws));
                const actions=JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]');
                actions.unshift({id:'E2E-ACTION-CLOSE-1',sourceCaseId:'E2E-CLOSE-1',team:'성능팀',registeredAt:'2026-02-02',due:'2026-02-09',status:'완료',action:'E2E close action',effectState:'유효',effectVerified:true,recurrence:false,recurrenceState:'미발생'});
                localStorage.setItem('hd20ActionCasesV2',JSON.stringify(actions));
              });
              await page.reload({waitUntil:'networkidle'});await page.click('.beginnerNav button[data-key="audit"]');
              await page.waitForSelector('#hd20AuditCloseEvaluation [data-ace-case]',{timeout:10000});
              await page.waitForFunction(()=>[...document.querySelectorAll('#hd20AuditCloseEvaluation [data-ace-case] option')].some(o=>o.value==='E2E-CLOSE-1'),{},{timeout:10000});
              await page.selectOption('#hd20AuditCloseEvaluation [data-ace-case]','E2E-CLOSE-1');
              await page.selectOption('#hd20AuditCloseEvaluation [data-ace-result]',{label:'미흡'});
              await page.fill('#hd20AuditCloseEvaluation [data-ace-note]','E2E 종료평가 미흡 근거');
              await page.click('#hd20AuditCloseEvaluation [data-ace-save]');
              await page.waitForFunction(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').find(x=>x.id==='E2E-CLOSE-1');return d?.finalEvaluation==='미흡'&&d?.finalEvaluationNote==='E2E 종료평가 미흡 근거'},{},{timeout:10000});
              const closeSaved=await page.evaluate(()=>{const d=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').find(x=>x.id==='E2E-CLOSE-1');return{result:d?.finalEvaluation,note:d?.finalEvaluationNote,at:d?.finalEvaluationAt||null,riskReference:d?.finalEvaluationRiskReference}});
              if(closeSaved.result!=='미흡'||closeSaved.note!=='E2E 종료평가 미흡 근거'||closeSaved.riskReference!==true)throw new Error('Close evaluation save contract '+JSON.stringify(closeSaved));
              await page.waitForFunction(()=>{const t=document.querySelector('.hd20CaseTraceAudit')?.innerText||'';return t.includes('E2E-CLOSE-1')&&t.includes('종료평가 · 미흡')&&t.includes('E2E 종료평가 미흡 근거')},{},{timeout:10000});
              const traceClose=await page.evaluate(()=>{const t=document.querySelector('.hd20CaseTraceAudit')?.innerText||'';return{hasCase:t.includes('E2E-CLOSE-1'),hasWeak:t.includes('종료평가 · 미흡'),hasNote:t.includes('E2E 종료평가 미흡 근거')}});
              await page.screenshot({path:'artifacts/audit-close-evaluation.png',fullPage:true});
              await page.click('.beginnerNav button[data-key="dashboard"]');
              await page.waitForFunction(()=>{const t=document.getElementById('hd20OperationalBridge')?.innerText||'';return t.includes('종료평가 · 미흡')},{},{timeout:10000});
              const dashboardClose=await page.evaluate(()=>{const t=document.getElementById('hd20OperationalBridge')?.innerText||'';return{hasPending:t.includes('종료평가 대기'),hasMaintain:t.includes('종료평가 · 유지'),hasWeak:t.includes('종료평가 · 미흡'),text:t}});
              if(!dashboardClose.hasPending||!dashboardClose.hasMaintain||!dashboardClose.hasWeak)throw new Error('Close evaluation dashboard contract '+JSON.stringify(dashboardClose));
              evidence.auditClose={closeSaved,traceClose,dashboard:{hasPending:dashboardClose.hasPending,hasMaintain:dashboardClose.hasMaintain,hasWeak:dashboardClose.hasWeak}};
              await page.screenshot({path:'artifacts/dashboard-close-evaluation.png',fullPage:true});

              const hp=await browser.newPage({viewport:{width:1440,height:1000}}),hpErrors=[];hp.on('pageerror',e=>hpErrors.push(String(e)));
              await hp.goto('http://127.0.0.1:4173/hdps-dashboard.html',{waitUntil:'networkidle',timeout:30000});await hp.waitForSelector('#hpKpis .hpKpi');await hp.waitForSelector('#hpActionRows .hpActionRow');
              const hdps=await hp.evaluate(()=>({nav:[...document.querySelectorAll('.hpNav button[data-hp-nav]')].map(x=>x.dataset.hpNav),kpi:document.querySelectorAll('#hpKpis .hpKpi').length,actions:document.querySelectorAll('#hpActionRows .hpActionRow').length,labels:[...document.querySelectorAll('#hpKpis .hpKpi small')].map(x=>x.textContent.trim()),actionLabels:[...document.querySelectorAll('#hpActionRows .hpActionRow > span:first-child')].map(x=>x.textContent.trim()),text:document.body.innerText}));
              if(JSON.stringify(hdps.nav)!==JSON.stringify(expectedHdps)||hdps.kpi!==6||hdps.actions!==4)throw new Error('HDPS dashboard contract mismatch');
              if(!hdps.labels.includes('Audit 후 6개월 유지율'))throw new Error('HDPS six-month KPI missing');
              for(const l of ['Audit 실시 대기','Audit 후 6개월 관리중','개선조치 미완료','개선조치 기한경과'])if(!hdps.actionLabels.includes(l))throw new Error('HDPS action label missing '+l);
              if(/1개월 점검|3개월 Audit|6개월 Audit|1·3·6개월/.test(hdps.text))throw new Error('Legacy lifecycle on HDPS dashboard');
              if(hpErrors.length)throw new Error('HDPS page errors '+hpErrors.join(' | '));
              evidence.hdps={nav:hdps.nav,kpi:hdps.kpi,actions:hdps.actions};await hp.screenshot({path:'artifacts/hdps-dashboard.png',fullPage:true});await hp.close();
              fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify(evidence,null,2));console.log('HD20 BROWSER CONTRACTS PASS',evidence);
            }catch(e){failure=e;fs.writeFileSync('artifacts/diagnostics.json',JSON.stringify({...evidence,failure:String(e)},null,2));console.error(e)}finally{await browser.close()}
            if(failure)process.exit(1);
          })();
          NODE
          node --check hd20-browser-smoke.cjs
          node hd20-browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd20-five-area-browser-evidence
          path: artifacts/
          if-no-files-found: warn
