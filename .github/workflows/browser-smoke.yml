              const emptyDefaultState=await emptyDefault.evaluate(()=>{const read=k=>JSON.parse(localStorage.getItem(k)||'[]'),snap=window.HD20KPIData.snapshot?.()||{},a=read('hd20GMES5SAutoImproveRawV1'),teams=[...new Set(a.map(r=>r.team).filter(Boolean))];return{demo:window.HD20_DEMO_MODE===true,fallback:window.HD20_DEFAULT_FIXTURE_FALLBACK===true,a:a.length,u:read('hd20AuditRandomDrawsV1').length,x:read('hd20ActionCasesV2').length,teams:teams.length,kpiActivities:(snap.activities||[]).length,kpiCandidates:(snap.candidates||[]).length,kpiConfirmed:(snap.newSecured||[]).length,kpiActionRows:window.HD20KPIData?.actionCases?.().length??0,kpiOperational:!!window.HD20KPIData?.operational?.(snap),attrition:a.filter(r=>r.attrition===true).length,confirmedAttrition:a.filter(r=>r.confirmed===true&&r.judgeState==='확정'&&r.attrition===true).length,sourceOk:a.every(r=>r?.source==='demo-seed'),banner:document.getElementById('hd20DemoFlag')?.innerText||'',visibleKpis:[...document.querySelectorAll('.cards .kpi b')].map(e=>e.textContent.trim()),visibleMap:document.querySelector('#hd20MaturityMapTab')?.innerText?.slice(0,300)||''}});console.log('EMPTY_NORMAL_DEMO',JSON.stringify(emptyDefaultState));if(!emptyDefaultState.demo||emptyDefaultState.fallback||emptyDefaultState.a<1||emptyDefaultState.u<1||emptyDefaultState.x<1||emptyDefaultState.teams!==19||emptyDefaultState.kpiActivities<1||emptyDefaultState.attrition<1||emptyDefaultState.confirmedAttrition<1||emptyDefaultState.kpiActionRows<1||!emptyDefaultState.kpiOperational||!emptyDefaultState.sourceOk||!emptyDefaultState.banner)throw new Error('Normal team-master demo failed '+JSON.stringify(emptyDefaultState));if(emptyDefaultState.kpiCandidates===0)console.warn('DEMO_ADVANCEMENT_NO_EXPLICIT_CRITERIA: demo source loaded, no eligible enhancement candidates; do not invent approvals');if(emptyDefaultState.kpiConfirmed>emptyDefaultState.kpiCandidates)throw new Error('Official enhancement count exceeds eligible candidates '+JSON.stringify(emptyDefaultState));if(emptyDefaultState.visibleKpis.length<4||emptyDefaultState.visibleKpis.every(x=>/^0(?:건|곳|%)?$/.test(x)||x==='—'))throw new Error('Rendered KPI cards stayed at zero '+JSON.stringify(emptyDefaultState));await emptyDefault.reload({waitUntil:'domcontentloaded',timeout:30000}).catch(async e=>{if(!/ERR_ABORTED/.test(String(e)))throw e;await emptyDefault.waitForTimeout(250)});await emptyDefault.waitForFunction(()=>window.HD20_DEMO_MODE===true&&window.HD20KPIData?.snapshot?.().activities?.length>0,{},{timeout:20000});const refreshed=await emptyDefault.evaluate(()=>({a:JSON.parse(localStorage.getItem('hd20GMES5SAutoImproveRawV1')||'[]').length,kpis:[...document.querySelectorAll('.cards .kpi b')].map(e=>e.textContent.trim()),banner:!!document.getElementById('hd20DemoFlag')}));console.log('DEMO_REFRESH_VISIBLE',JSON.stringify(refreshed));if(refreshed.a<1||!refreshed.banner||refreshed.kpis.length<4||refreshed.kpis.every(x=>/^0(?:건|곳|%)?$/.test(x)||x==='—'))throw new Error('Demo refresh reverted visible KPIs to zero '+JSON.stringify(refreshed));await emptyDefault.close();
