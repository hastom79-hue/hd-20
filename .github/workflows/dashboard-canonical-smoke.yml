name: HD20 dashboard canonical smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify static canonical dashboard contract
        run: |
          python3 - <<'PY'
          import pathlib,sys
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          for x in ['approved-landing-v2.js','approved-landing-v2.css']:
              if x in html: sys.exit(f'duplicate landing runtime remains: {x}')
          final=pathlib.Path('final-layout-polish.js').read_text(encoding='utf-8')
          for x in ['dashboard-priority-layout.js','dashboard-operational-bridge.js','dashboard-section-tabs.js']:
              if x not in final: sys.exit(f'canonical dashboard module missing: {x}')
          nav=pathlib.Path('beginner-navigation.js').read_text(encoding='utf-8')
          if '.hd20ApprovedLanding' in nav: sys.exit('navigation still depends on retired approved landing')
          if "go('dashboard',nav)" not in nav: sys.exit('dashboard boot contract missing')
          if "searchParams.get('tab')" in nav: sys.exit('stale tab query restore must not control initial boot')
          tabs=pathlib.Path('dashboard-section-tabs.js').read_text(encoding='utf-8')
          for key in ["key:'summary'","key:'execution'","key:'maturity'","key:'standard'","key:'field'"]:
              if key not in tabs: sys.exit(f'dashboard grouping missing: {key}')
          if "let active='summary'" not in tabs or "function reset(){active='summary'" not in tabs: sys.exit('dashboard subtab reset contract missing')
          bridge=pathlib.Path('dashboard-operational-bridge.js').read_text(encoding='utf-8')
          for duplicate in ['개선조치 미완료','기한경과','3조건 모두 충족','2조건 충족']:
              if duplicate in bridge: sys.exit(f'duplicate bridge metric remains: {duplicate}')
          PY
      - name: Serve
        run: python3 -m http.server 4173 >/tmp/hd20-http.log 2>&1 &
      - name: Verify rendered dashboard hierarchy and grouping
        timeout-minutes: 5
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const viewport of [{width:1440,height:1000},{width:375,height:812}]){
                const page=await browser.newPage({viewport}),errors=[];
                const mark=(label)=>console.log('CANONICAL_STAGE',`${viewport.width}x${viewport.height}`,label,Date.now());
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(/beginner-navigation\.js/.test(r.url()))console.log('NAV_RESPONSE',r.status(),r.url())});
                await page.addInitScript(()=>{window.__HD20_CANONICAL_INIT=true});
                await page.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:''});return route.abort('blockedbyclient')});
                mark('before-goto');
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'commit',timeout:30000});
                mark('after-goto');
                const wait=async(label,fn)=>{mark('wait-'+label+'-start');try{await page.waitForFunction(fn,{},{timeout:10000});mark('wait-'+label+'-pass')}catch(e){console.log('BOOT_TIMEOUT',label,'url='+page.url(),'closed='+page.isClosed(),'errors='+errors.join(' | '));throw new Error(`boot stage ${label} timeout; pageErrors=${errors.join(' | ')}`)}};
                await wait('execution-context',()=>window.__HD20_CANONICAL_INIT===true);
                await wait('beginnerNav',()=>!!document.querySelector('.beginnerNav'));
                await wait('HD20_NAV',()=>!!window.HD20_NAV);
                await wait('HD20_DASHBOARD_TABS',()=>!!window.HD20_DASHBOARD_TABS);
                await wait('dashboard-nav-button',()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'));
                await wait('dashboard-priority',()=>!!document.getElementById('hd20DashboardPriority'));
                await wait('operational-bridge',()=>!!document.getElementById('hd20OperationalBridge'));
                mark('state-start');
                const state=()=>page.evaluate(()=>({approved:document.querySelectorAll('.hd20ApprovedLanding').length,priority:document.querySelectorAll('#hd20DashboardPriority').length,health:document.querySelectorAll('#hd20DashboardPriority .hd20HealthKpi').length,bridge:document.querySelectorAll('#hd20OperationalBridge').length,cards:document.querySelectorAll('.cards .kpi').length,active:document.querySelector('.beginnerNav button.active')?.dataset.key||'',subActive:window.HD20_DASHBOARD_TABS?.active?.()||'',subCount:document.querySelectorAll('#hd20DashboardSectionTabs button').length,showcaseHidden:document.querySelector('#hd20FieldShowcaseBootstrap')?.classList.contains('hd20DashboardSectionHidden')||false,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth}));
                let s=await state();mark('state-pass');assert(!errors.length,'page errors: '+errors.join(' | '));assert(s.approved===0&&s.priority===1&&s.health===6&&s.bridge===1&&s.cards===5,'canonical dashboard invalid: '+JSON.stringify(s));assert(s.active==='dashboard'&&s.subActive==='summary'&&s.subCount===5&&s.showcaseHidden,'initial grouping invalid: '+JSON.stringify(s));assert(s.overflow<=2,`horizontal overflow ${s.overflow}px`);
                mark('maturity-start');await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('maturity',{scroll:false}));await page.waitForTimeout(150);let maturity=await page.evaluate(()=>{const el=document.getElementById('hd20MaturityMapTab');return {active:window.HD20_DASHBOARD_TABS.active(),nav:window.HD20_NAV.active(),visible:!!el&&!el.hidden&&getComputedStyle(el).display!=='none',standalone:!!document.querySelector('.beginnerNav button[data-key="maturitymap"]')};});mark('maturity-pass');assert(maturity.active==='maturity'&&maturity.nav==='dashboard'&&maturity.visible&&!maturity.standalone,'maturity grouping failed: '+JSON.stringify(maturity));
                mark('field-start');await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('field',{scroll:false}));await page.waitForTimeout(150);let field=await page.evaluate(()=>({active:window.HD20_DASHBOARD_TABS.active(),showcase:!document.querySelector('#hd20FieldShowcaseBootstrap')?.classList.contains('hd20DashboardSectionHidden'),cards:!document.querySelector('.cards')?.classList.contains('hd20DashboardSectionHidden'),main:!document.querySelector('.mainGrid')?.classList.contains('hd20DashboardSectionHidden'),bottom:!document.querySelector('.bottomGrid')?.classList.contains('hd20DashboardSectionHidden')}));mark('field-pass');assert(field.active==='field'&&field.showcase&&!field.cards&&!field.main&&!field.bottom,'field grouping failed: '+JSON.stringify(field));
                mark('execution-start');await page.evaluate(()=>window.HD20_DASHBOARD_TABS.apply('execution',{scroll:false}));await page.waitForTimeout(150);let execution=await page.evaluate(()=>({main:!document.querySelector('.mainGrid')?.classList.contains('hd20DashboardSectionHidden'),bridge:!document.querySelector('#hd20OperationalBridge')?.classList.contains('hd20DashboardSectionHidden'),showcase:!document.querySelector('#hd20FieldShowcaseBootstrap')?.classList.contains('hd20DashboardSectionHidden')}));mark('execution-pass');assert(execution.main&&execution.bridge&&!execution.showcase,'execution grouping failed: '+JSON.stringify(execution));
                mark('nav-roundtrip-start');await page.evaluate(()=>window.HD20_NAV.go('activity'));await page.waitForTimeout(150);await page.evaluate(()=>window.HD20_NAV.go('dashboard'));await page.waitForTimeout(150);assert((await page.evaluate(()=>window.HD20_DASHBOARD_TABS.active()))==='summary','dashboard return did not reset summary');mark('nav-roundtrip-pass');
                await page.close();mark('viewport-pass');
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS