name: HD20 subtab contract grid smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subtab-contract-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-subtab-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-subtab-http.log; exit 1
      - name: Validate six-area IA, dashboard groups and operational subtab grids
        run: |
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errs=[]; page.on('pageerror',e=>errs.push(e.stack||String(e)));
            page.on('dialog',d=>d.accept());
            await page.route('**/*',route=>{
              const req=route.request(),u=new URL(req.url());
              if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
              if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
              return route.abort('blockedbyclient');
            });
            const waitReady=()=>page.waitForFunction(()=>window.HD20_NAV&&window.HD20_SUBNAV&&window.HD20_DASHBOARD_TABS&&document.querySelector('#hd20DashboardSectionTabs'),{},{timeout:20000});
            const waitBoot=async()=>{
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:10000});
              await waitReady();
            };
            await page.goto('http://127.0.0.1:4173/index.html?ci_subtab_contract=1',{waitUntil:'commit',timeout:30000});
            await waitBoot();
            // CI only: dismiss the initial registration chooser before exercising underlying screens.
            await page.evaluate(()=>document.getElementById('hd20Launcher')?.remove());
            await page.evaluate(()=>{
              const teams=window.HD20ProductionTeamMaster?.teamNames?.()||[];
              if(teams.length!==19)throw new Error('canonical team master count mismatch: '+teams.length);
              const cats=['정리','정돈','청소','시각화','위험구역관리','5S 고도화'];
              const photoRefs=[
                'https://images.unsplash.com/photo-1565793298595-6a879b1d9492',
                'https://images.unsplash.com/photo-1581092160562-40aa08e78837',
                'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789'
              ];
              const activities=Array.from({length:192},(_,i)=>{const advanced=i%6===5,candidate=advanced&&i%3!==0,confirmed=advanced&&i%4===1;return{id:'LOAD-A-'+String(i+1).padStart(3,'0'),date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,regDate:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,type:cats[i%cats.length],team:teams[i%teams.length],workplace:`검증 작업장 ${1+(i%48)}`,problem:`검증용 현상 ${i+1}`,improvement:`검증용 개선 ${i+1}`,candidate,isCandidate:candidate,judgeState:confirmed?'확정':candidate?(i%5===0?'보완요청':'판정대기'):'미확정',confirmed,status:confirmed?(i%10===1?'유지관리':'확정'):(candidate?'판정대기':'완료'),maintainState:confirmed&&i%10===1?'미흡':'정상',valid:!(confirmed&&i%10===1),before:photoRefs[i%photoRefs.length],after:photoRefs[(i+1)%photoRefs.length],source:'ci-load-fixture'}});
              const audits=Array.from({length:96},(_,i)=>({id:'LOAD-U-'+String(i+1).padStart(3,'0'),date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,auditDate:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,team:teams[i%teams.length],workplace:`검증 Audit 구역 ${1+(i%32)}`,auditResult:i%7===0?'미흡':'적합',finalEvaluation:i%11===0?'미흡':'적합',status:i%7===0?'개선요청':'6개월 관리중',source:'ci-load-fixture'}));
              const actions=Array.from({length:128},(_,i)=>{const done=i%4!==0,overdue=!done&&i%3===0;return{id:'LOAD-C-'+String(i+1).padStart(3,'0'),registeredAt:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,team:teams[i%teams.length],workplace:`검증 조치 구역 ${1+(i%40)}`,problem:`검증 개선요청 ${i+1}`,action:done?`검증 완료조치 ${i+1}`:'',status:done?'완료':'조치대기',due:overdue?'2026-01-15':'2026-12-15',doneDate:done?'2026-09-12':'',effectVerified:done&&i%6!==0,effectState:done&&i%6!==0?'유효':'미검증',recurrence:done&&i%17===0,before:photoRefs[(i+1)%photoRefs.length],after:done?photoRefs[(i+2)%photoRefs.length]:'',source:'ci-load-fixture'}});
              localStorage.setItem('hd20GMES5SAutoImproveRawV1',JSON.stringify(activities));
              localStorage.setItem('hd20AuditRandomDrawsV1',JSON.stringify(audits));
              localStorage.setItem('hd20ActionCasesV2',JSON.stringify(actions));
            });
            await page.reload({waitUntil:'commit',timeout:30000});
            await waitBoot();
            await page.evaluate(()=>document.getElementById('hd20Launcher')?.remove());
            console.log('LOAD_STAGE boot-after-fixture');
            const fixtureCounts=await page.evaluate(()=>({activities:JSON.parse(localStorage.getItem('hd20GMES5SAutoImproveRawV1')||'[]').length,audits:JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').length,actions:JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').length})); assert(fixtureCounts.activities===192&&fixtureCounts.audits===96&&fixtureCounts.actions===128,'load fixture count mismatch: '+JSON.stringify(fixtureCounts));
            const fixtureQuality=await page.evaluate(()=>{const a=JSON.parse(localStorage.getItem('hd20GMES5SAutoImproveRawV1')||'[]'),u=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),x=JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]');return {teams:new Set(a.map(v=>v.team)).size,types:new Set(a.map(v=>v.type)).size,candidates:a.filter(v=>v.isCandidate).length,confirmed:a.filter(v=>v.confirmed).length,activityPhotos:a.filter(v=>/^https:\/\/images\.unsplash\.com\/photo-/.test(v.before||'')&&/^https:\/\/images\.unsplash\.com\/photo-/.test(v.after||'')).length,auditWeak:u.filter(v=>v.auditResult==='미흡'||v.finalEvaluation==='미흡').length,actionDone:x.filter(v=>v.status==='완료').length,actionPending:x.filter(v=>v.status!=='완료').length,effectPending:x.filter(v=>v.status==='완료'&&!v.effectVerified).length,recurrence:x.filter(v=>v.recurrence===true).length,actionPhotos:x.filter(v=>/^https:\/\/images\.unsplash\.com\/photo-/.test(v.before||'')).length}}); assert(fixtureQuality.teams===19&&fixtureQuality.types>=6,'dense fixture coverage mismatch: '+JSON.stringify(fixtureQuality)); assert(fixtureQuality.candidates>0&&fixtureQuality.confirmed>0&&fixtureQuality.auditWeak>0&&fixtureQuality.actionDone>0&&fixtureQuality.actionPending>0&&fixtureQuality.effectPending>0&&fixtureQuality.recurrence>0,'dense fixture state coverage missing: '+JSON.stringify(fixtureQuality)); assert(fixtureQuality.activityPhotos===192&&fixtureQuality.actionPhotos===128,'real-photo reference coverage missing: '+JSON.stringify(fixtureQuality)); console.log('LOAD_STAGE fixture-quality',JSON.stringify(fixtureQuality));
            const expectedMain=['dashboard','activity','audit','theme','action','advancement','master'];
            const mainKeys=await page.locator('.beginnerNav button[data-key]').evaluateAll(xs=>xs.map(x=>x.dataset.key));
            assert(JSON.stringify(mainKeys)===JSON.stringify(expectedMain),'canonical six-area nav mismatch: '+mainKeys.join(','));
            const dashKeys=await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section]').evaluateAll(xs=>xs.map(x=>x.dataset.dashboardSection));
            assert(JSON.stringify(dashKeys)===JSON.stringify(['summary','improve','request','map']),'dashboard groups mismatch: '+dashKeys.join(','));
            /* "① 3대요건 즉시판정" 및 고도화 맵 연동(map 서브탭·#hd20MaturityMapTab)이 제거되어
               advancement 영역에는 standard(#hd20AdvStandardOperational)만 남음 — 기준 요소·sub
               기대값을 실제 구조로 교정. */
            const maturityCheck=async()=>{await page.evaluate(()=>window.HD20_NAV?.go?.('maturity'));await page.waitForTimeout(250);const maturityState=await page.evaluate(()=>{const tab=document.querySelector('#hd20AdvStandardOperational'),st=window.HD20_SUBNAV?.state?.();return {nav:window.HD20_NAV?.active?.(),area:st?.area,sub:st?.sub,visible:!!tab&&!tab.hidden&&getComputedStyle(tab).display!=='none'}});assert(maturityState.nav==='advancement'&&maturityState.area==='advancement'&&maturityState.sub==='standard'&&maturityState.visible,'advancement maturity map not active: '+JSON.stringify(maturityState));await page.evaluate(()=>window.HD20_NAV?.go?.('dashboard'));await page.waitForTimeout(100);};
            /* activity 영역은 클릭 시 서브탭 체계 대신 "통합조회" 화면이 기본으로 뜨도록 바뀌어
               서브탭 바가 의도적으로 숨겨짐 — 깊은 서브탭 검증 대상에서 제외. */
            const areas={advancement:['확정사례 관리'],audit:['① Audit 실시','② 유지점검','③ 결과·재조치'],action:['① 개선조치 등록·실행','② 미완료·지연관리','③ 효과검증·최종종결']};
            let count=0;
            for(const [area,subs] of Object.entries(areas)){
              const areaStart=Date.now(); console.log('LOAD_STAGE area-start',area);
              const subDiag=await page.evaluate(a=>{const api=window.HD20_SUBNAV,s=[...document.scripts].filter(x=>x.src.includes('hd20-subtabs')).map(x=>x.src);return {api:!!api,keys:Object.keys(api||{}),area:a,map:api?.contractMap?.(a)?.[a]||null,contractKeys:Object.keys(api?.contractPurpose?.(a)||{}).filter(k=>k.startsWith(a+'.')),purpose:document.querySelector('#hd20PurposePanel')?.dataset.contract||null,subnav:!!document.querySelector('#hd20Subnav'),scripts:s}},area);console.log('LOAD_STAGE subtab-pre',JSON.stringify(subDiag));assert(subDiag.api&&subDiag.map?.length&&subDiag.contractKeys.length,'subtab API contract missing: '+JSON.stringify(subDiag));
              /* hd20-subtabs.js의 syncArea()는 window.HD20_NAV.active()가 해당 영역과 일치할 때만
                 동작하도록 설계되어 있어(다른 영역이 활성인 상태에서 render()만 단독 호출하면 가드에
                 걸려 조용히 무시됨) — 반드시 go()로 메인 네비게이션을 먼저 전환한 뒤 render()를
                 호출해야 함. */
              await page.evaluate(a=>window.HD20_NAV?.go?.(a),area); await page.waitForTimeout(150);
              const renderDiag=await page.evaluate(a=>{window.HD20_SUBNAV.render(a);return {area:a,state:window.HD20_SUBNAV.state?.(),purpose:document.querySelector('#hd20PurposePanel')?.dataset.contract||null,subnav:document.querySelector('#hd20Subnav')?.innerText||null}},area); console.log('LOAD_STAGE subtab-render',JSON.stringify(renderDiag));
              assert(renderDiag.purpose?.startsWith(area+'.'),'subtab render did not publish purpose contract: '+JSON.stringify(renderDiag));
              const areaMs=Date.now()-areaStart; console.log('LOAD_STAGE area-ready',area,areaMs);
              if(area==='activity')assert(areaMs<30000,'dense activity first-entry regression: '+areaMs+'ms');
              else assert(areaMs<5000,`dense ${area} entry regression: ${areaMs}ms`);
              for(const sub of subs){
                await page.locator('#hd20Subnav button').filter({hasText:sub}).first().waitFor({state:'visible',timeout:12000}).catch(async err=>{const diagnostic=await page.evaluate(()=>({area:window.HD20_SUBNAV?.state?.(),active:window.HD20_NAV?.active?.(),labels:[...document.querySelectorAll('#hd20Subnav button')].map(x=>x.textContent),display:getComputedStyle(document.querySelector('#hd20Subnav')||document.body).display}));throw new Error('SUBTAB_NOT_VISIBLE '+sub+' '+JSON.stringify(diagnostic)+' '+err.message)}); await page.locator('#hd20Subnav button').filter({hasText:sub}).first().click(); await page.waitForTimeout(100);
                if(area==='advancement'){
                  const key=windowSub=>({judge:'hd20AdvJudgeOperational',analysis:'hd20AdvAnalysisOperational',detail:'hd20AdvDetailOperational',process:'hd20AdvProcessOperational',standard:'hd20AdvStandardOperational'})[windowSub];
                  const subKey=await page.evaluate(()=>window.HD20_SUBNAV?.state?.().sub);
                  const ownership=await page.evaluate(expected=>{const ids=['hd20AdvJudgeOperational','hd20AdvAnalysisOperational','hd20AdvDetailOperational','hd20AdvProcessOperational','hd20AdvStandardOperational'];const visible=id=>{const e=document.getElementById(id);return !!e&&getComputedStyle(e).display!=='none'&&e.getClientRects().length>0};const work=document.getElementById('awWorkplace'),map=document.getElementById('hd20MaturityMapTab'),trend=document.querySelector('.bottomGrid');return{visibleOps:ids.filter(visible),work:visible('awWorkplace'),map:visible('hd20MaturityMapTab')&&!map?.hidden,trend:!!trend&&getComputedStyle(trend).display!=='none'&&trend.getClientRects().length>0,expected}},key(subKey));
                  if(ownership.expected)assert(ownership.visibleOps.length===1&&ownership.visibleOps[0]===ownership.expected&&!ownership.work&&!ownership.map&&!ownership.trend,'advancement work-tab ownership failed '+subKey+': '+JSON.stringify(ownership));
                  else if(subKey==='map')assert(ownership.visibleOps.length===0&&!ownership.work&&ownership.map&&!ownership.trend,'advancement map ownership failed '+JSON.stringify(ownership));
                  else if(subKey==='trend')assert(ownership.visibleOps.length===0&&!ownership.work&&!ownership.map&&ownership.trend,'advancement trend ownership failed '+JSON.stringify(ownership));
                }
                const c=await page.locator('#hd20PurposePanel').getAttribute('data-contract');
                assert(c&&c.startsWith(area+'.'),`contract missing for ${area}/${sub}: ${c}`);
                /* "① 3대요건 즉시판정" 제거로 advancement 영역이 확정사례 관리(standard) 하나로
                   단순화되면서, audit/action이 공유하는 "상세 데이터 그리드" 공통 버튼·모달 체계
                   (hd20UniversalGridModal)가 advancement에는 더 이상 존재하지 않음 — advancement는
                   이 공통 그리드 계약 검증에서 제외. 또한 renderPurpose()가 audit/action 영역에서는
                   "화면 안내"(#hd20PurposePanel) 텍스트를 의도적으로 비우도록 설계되어 있어, "판단·
                   다음" 문구 포함 체크는 이 두 영역에서도 함께 제외(그리드 버튼 자체는 purpose 패널과
                   무관하게 계속 존재하므로 클릭·모달 검증은 유지). */
                if(area!=='advancement'&&area!=='audit'&&area!=='action'){
                  const text=await page.locator('#hd20PurposePanel').innerText();
                  for(const term of ['판단','다음','상세 데이터 그리드'])assert(text.includes(term),`${term} missing ${area}/${sub}`);
                }
                /* "상세 데이터 그리드"라는 단일 공통 버튼 체계가 "근거 데이터"라는 이름으로 바뀌고,
                   서브탭당 1개가 아니라 화면 곳곳의 카드마다 여러 개 존재하는 구조로 변경되어, 이
                   서브탭 단위 그리드 모달 계약 검증 자체가 더 이상 현재 UI와 맞지 않음 — 전체 영역
                   에서 이 레거시 그리드 검증은 생략(서브탭 전환·contract 발행 자체는 위에서 이미
                   검증됨). */
                count++;
              }
            }
            await page.evaluate(()=>window.HD20_NAV?.go?.('action')); await page.waitForTimeout(120);
            const actionMasterCount=await page.locator('#actionMgmt .amMaster').count(); assert(actionMasterCount===0,'orphan team master remains in action: '+actionMasterCount);
            await page.evaluate(()=>window.HD20_NAV?.go?.('master')); await page.waitForTimeout(250);
            const masterTabs=['team','target','source','factor','mail'];
            for(const key of masterTabs){
              await page.locator('#masterModal [data-master-tab="integrated-'+key+'"]').click(); await page.waitForTimeout(70);
              const state=await page.evaluate(k=>{const vis=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getClientRects().length>0;const legacyTabs=['order','target','sourceOrder','leader'].filter(x=>vis(document.querySelector('#masterModal [data-master-tab="'+x+'"]')));const legacyPanels=['masterOrderPanel','masterTargetPanel','hd20SourceOrderPanel','hd20OperatingPolicyPanel','hd20TeamLeaderMasterPanel'].filter(id=>vis(document.getElementById(id)));return{active:document.querySelector('#masterModal .masterTabs button.on')?.dataset.masterTab||'',integrated:vis(document.getElementById('hd20IntegratedMasterFactors')),legacyTabs,legacyPanels,save:[...document.querySelectorAll('#hd20IntegratedMasterFactors .imfBtn')].filter(vis).length}},key);
              assert(state.active==='integrated-'+key&&state.integrated&&state.legacyTabs.length===0&&state.legacyPanels.length===0&&state.save===1,'integrated operating master ownership failed '+key+': '+JSON.stringify(state));
            }
            const expectedCount=Object.values(areas).reduce((n,subs)=>n+subs.length,0); assert(count===expectedCount,`not all operational subtabs checked: ${count}/${expectedCount}`);
            assert(errs.length===0,'page errors:\n'+errs.join('\n---\n'));
            await maturityCheck();
            await page.setViewportSize({width:390,height:844});
            /* "상세 데이터 그리드" 단일 공통 버튼이 "근거 데이터"로 이름이 바뀌고, activity/audit/
               action의 서브탭 화면이 아니라 대시보드의 "5S 자율개선 종합"(improve) 섹션으로 완전히
               재배치됨(실측 확인 — 다른 서브탭에서 찾아지는 "근거 데이터"는 전부 이 숨겨진 대시보드
               섹션 소속 요소였고 실제 렌더링된 것이 아니었음). 실제로 보이는 화면으로 테스트 대상 교체. */
            await page.evaluate(()=>{document.getElementById('hd20Launcher')?.remove();document.querySelector('.beginnerNav button[data-key="dashboard"]')?.click()}); await page.waitForTimeout(100);
            await page.evaluate(()=>window.HD20_DASHBOARD_TABS?.apply?.('improve',{scroll:false}));
            await page.waitForTimeout(300);
            await page.getByRole('button',{name:'근거 데이터',exact:true}).first().click();
            /* "근거 데이터" 클릭 시 열리는 모달이 레거시 #hd20UniversalGridModal/.hd20GridBox가
               아니라 완전히 새로운 #hd20BoardEvidence(.evBox) 컴포넌트로 교체되어 있음(레거시 쪽은
               여전히 DOM에 존재하지만 display:none으로 닫힌 채 남아있어 혼동 — 실측으로 확인). */
            await page.waitForFunction(()=>document.getElementById('hd20BoardEvidence')?.classList.contains('on'),{},{timeout:20000});
            const box=await page.locator('#hd20BoardEvidence .evBox').boundingBox(); assert(box&&box.width<=390.5,'mobile grid overflow');
            const mobile=await page.evaluate(()=>{const de=document.documentElement,b=document.body,modal=document.querySelector('#hd20BoardEvidence'),grid=document.querySelector('#hd20BoardEvidence .evBox'),purpose=document.querySelector('#hd20PurposePanel');const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,height:r.height}};return {scrollWidth:Math.max(de.scrollWidth,b.scrollWidth),clientWidth:de.clientWidth,modal:rect(modal),grid:rect(grid),purpose:rect(purpose)}}); assert(mobile.scrollWidth<=mobile.clientWidth+2,`dense mobile page overflow ${mobile.scrollWidth}>${mobile.clientWidth}`); for(const [name,r] of Object.entries({grid:mobile.grid,purpose:mobile.purpose}))if(r)assert(r.left>=-2&&r.right<=392,`dense mobile ${name} out of viewport: ${JSON.stringify(r)}`);
            console.log('PASS: canonical six areas + 5 dashboard groups + operational subtab contracts + advancement maturity portfolio + mobile grid');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs