name: HD20 subtab contract grid smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subtab-contract-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-subtab-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-subtab-http.log; exit 1
      - name: Validate five-area IA, dashboard groups and operational subtab grids
        run: |
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errs=[]; page.on('pageerror',e=>errs.push(e.stack||String(e)));
            page.on('dialog',d=>d.accept());
            await page.route('**/*',route=>{
              const req=route.request(),u=new URL(req.url());
              if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();
              if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:'/* HD20 CI external script stub */'});
              return route.abort('blockedbyclient');
            });
            const waitReady=()=>page.waitForFunction(()=>window.HD20_NAV&&window.HD20_SUBNAV&&window.HD20_DASHBOARD_TABS&&document.querySelector('#hd20DashboardSectionTabs'),{},{timeout:20000});
            const waitBoot=async()=>{
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav'),{},{timeout:10000});
              await page.waitForFunction(()=>!!window.HD20_NAV,{},{timeout:20000});
              await page.waitForFunction(()=>!!document.querySelector('.beginnerNav button[data-key="dashboard"]'),{},{timeout:10000});
              await waitReady();
            };
            await page.goto('http://127.0.0.1:4173/index.html?ci_subtab_contract=1',{waitUntil:'commit',timeout:30000});
            await waitBoot();
            await page.evaluate(()=>{
              const teams=window.HD20ProductionTeamMaster?.teamNames?.()||[];
              if(teams.length!==16)throw new Error('canonical team master count mismatch: '+teams.length);
              const cats=['정리','정돈','청소','시각화','위험구역관리','5S 고도화'];
              const photoRefs=[
                'https://images.unsplash.com/photo-1565793298595-6a879b1d9492',
                'https://images.unsplash.com/photo-1581092160562-40aa08e78837',
                'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789'
              ];
              const activities=Array.from({length:192},(_,i)=>{const advanced=i%6===5,candidate=advanced&&i%3!==0,confirmed=advanced&&i%4===1;return{id:'LOAD-A-'+String(i+1).padStart(3,'0'),date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,regDate:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,type:cats[i%cats.length],team:teams[i%teams.length],workplace:`검증 작업장 ${1+(i%48)}`,problem:`검증용 현상 ${i+1}`,improvement:`검증용 개선 ${i+1}`,candidate,isCandidate:candidate,judgeState:confirmed?'확정':candidate?(i%5===0?'보완요청':'판정대기'):'미확정',confirmed,status:confirmed?(i%10===1?'유지관리':'확정'):(candidate?'판정대기':'완료'),maintainState:confirmed&&i%10===1?'미흡':'정상',valid:!(confirmed&&i%10===1),before:photoRefs[i%photoRefs.length],after:photoRefs[(i+1)%photoRefs.length],source:'ci-load-fixture'}});
              const audits=Array.from({length:96},(_,i)=>({id:'LOAD-U-'+String(i+1).padStart(3,'0'),date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,auditDate:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,team:teams[i%teams.length],workplace:`검증 Audit 구역 ${1+(i%32)}`,auditResult:i%7===0?'미흡':'적합',finalEvaluation:i%11===0?'미흡':'적합',status:i%7===0?'개선요청':'6개월 관리중',source:'ci-load-fixture'}));
              const actions=Array.from({length:128},(_,i)=>{const done=i%4!==0,overdue=!done&&i%3===0;return{id:'LOAD-C-'+String(i+1).padStart(3,'0'),registeredAt:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,date:`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`,team:teams[i%teams.length],workplace:`검증 조치 구역 ${1+(i%40)}`,problem:`검증 개선요청 ${i+1}`,action:done?`검증 완료조치 ${i+1}`:'',status:done?'완료':'조치대기',due:overdue?'2026-01-15':'2026-12-15',doneDate:done?'2026-09-12':'',effectVerified:done&&i%6!==0,effectState:done&&i%6!==0?'유효':'미검증',recurrence:done&&i%17===0,before:photoRefs[(i+1)%photoRefs.length],after:done?photoRefs[(i+2)%photoRefs.length]:'',source:'ci-load-fixture'}});
              localStorage.setItem('hd20GMES5SAutoImproveRawV1',JSON.stringify(activities));
              localStorage.setItem('hd20AuditRandomDrawsV1',JSON.stringify(audits));
              localStorage.setItem('hd20ActionCasesV2',JSON.stringify(actions));
            });
            await page.reload({waitUntil:'commit',timeout:30000});
            await waitBoot();
            console.log('LOAD_STAGE boot-after-fixture');
            const fixtureCounts=await page.evaluate(()=>({activities:JSON.parse(localStorage.getItem('hd20GMES5SAutoImproveRawV1')||'[]').length,audits:JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]').length,actions:JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]').length})); assert(fixtureCounts.activities===192&&fixtureCounts.audits===96&&fixtureCounts.actions===128,'load fixture count mismatch: '+JSON.stringify(fixtureCounts));
            const fixtureQuality=await page.evaluate(()=>{const a=JSON.parse(localStorage.getItem('hd20GMES5SAutoImproveRawV1')||'[]'),u=JSON.parse(localStorage.getItem('hd20AuditRandomDrawsV1')||'[]'),x=JSON.parse(localStorage.getItem('hd20ActionCasesV2')||'[]');return {teams:new Set(a.map(v=>v.team)).size,types:new Set(a.map(v=>v.type)).size,candidates:a.filter(v=>v.isCandidate).length,confirmed:a.filter(v=>v.confirmed).length,activityPhotos:a.filter(v=>/^https:\/\/images\.unsplash\.com\/photo-/.test(v.before||'')&&/^https:\/\/images\.unsplash\.com\/photo-/.test(v.after||'')).length,auditWeak:u.filter(v=>v.auditResult==='미흡'||v.finalEvaluation==='미흡').length,actionDone:x.filter(v=>v.status==='완료').length,actionPending:x.filter(v=>v.status!=='완료').length,effectPending:x.filter(v=>v.status==='완료'&&!v.effectVerified).length,recurrence:x.filter(v=>v.recurrence===true).length,actionPhotos:x.filter(v=>/^https:\/\/images\.unsplash\.com\/photo-/.test(v.before||'')).length}}); assert(fixtureQuality.teams===16&&fixtureQuality.types>=6,'dense fixture coverage mismatch: '+JSON.stringify(fixtureQuality)); assert(fixtureQuality.candidates>0&&fixtureQuality.confirmed>0&&fixtureQuality.auditWeak>0&&fixtureQuality.actionDone>0&&fixtureQuality.actionPending>0&&fixtureQuality.effectPending>0&&fixtureQuality.recurrence>0,'dense fixture state coverage missing: '+JSON.stringify(fixtureQuality)); assert(fixtureQuality.activityPhotos===192&&fixtureQuality.actionPhotos===128,'real-photo reference coverage missing: '+JSON.stringify(fixtureQuality)); console.log('LOAD_STAGE fixture-quality',JSON.stringify(fixtureQuality));
            const expectedMain=['dashboard','activity','advancement','audit','action'];
            const mainKeys=await page.locator('.beginnerNav button[data-key]').evaluateAll(xs=>xs.map(x=>x.dataset.key));
            assert(JSON.stringify(mainKeys)===JSON.stringify(expectedMain),'canonical five-area nav mismatch: '+mainKeys.join(','));
            const dashKeys=await page.locator('#hd20DashboardSectionTabs button[data-dashboard-section]').evaluateAll(xs=>xs.map(x=>x.dataset.dashboardSection));
            assert(JSON.stringify(dashKeys)===JSON.stringify(['summary','execution','maturity','standard','field']),'dashboard groups mismatch: '+dashKeys.join(','));
            const maturityCheck=async()=>{await page.evaluate(()=>document.querySelector('#hd20DashboardSectionTabs button[data-dashboard-section="maturity"]')?.click()); await page.waitForTimeout(150);const maturityActive=await page.evaluate(()=>window.HD20_DASHBOARD_TABS?.active?.());assert(maturityActive==='maturity','dashboard maturity panel not active: '+maturityActive);await page.waitForFunction(()=>{const tab=document.querySelector('#hd20MaturityMapTab'),map=tab?.querySelector('.mmtMap');return !!(tab?.classList.contains('on')&&map&&map.getBoundingClientRect().height>300)},{},{timeout:10000});const maturityState=await page.evaluate(()=>({dots:document.querySelectorAll('#hd20MaturityMapTab .mmtDot').length,teams:document.querySelectorAll('#hd20MaturityMapTab .mmtTeam').length,visible:document.querySelector('#hd20MaturityMapTab')?.getBoundingClientRect().height>0}));assert(maturityState.visible&&maturityState.dots>0&&maturityState.teams>0,'maturity map not rendered from dense data: '+JSON.stringify(maturityState));await page.evaluate(()=>window.HD20_DASHBOARD_TABS?.apply?.('summary'));await page.waitForTimeout(100);};
            const areas={activity:['활동관리','실적분석'],advancement:['후보·판정','확정·수평전개'],audit:['Audit 관리','유지관리'],action:['개선조치','효과·재발관리']};
            let count=0;
            for(const [area,subs] of Object.entries(areas)){
              const areaStart=Date.now(); console.log('LOAD_STAGE area-start',area);
              const subDiag=await page.evaluate(a=>{const api=window.HD20_SUBNAV,s=[...document.scripts].filter(x=>x.src.includes('hd20-subtabs')).map(x=>x.src);return {api:!!api,keys:Object.keys(api||{}),area:a,map:api?.contractMap?.(a)?.[a]||null,contractKeys:Object.keys(api?.contractPurpose?.(a)||{}).filter(k=>k.startsWith(a+'.')),purpose:document.querySelector('#hd20PurposePanel')?.dataset.contract||null,subnav:!!document.querySelector('#hd20Subnav'),scripts:s}},area);console.log('LOAD_STAGE subtab-pre',JSON.stringify(subDiag));assert(subDiag.api&&subDiag.map?.length&&subDiag.contractKeys.length,'subtab API contract missing: '+JSON.stringify(subDiag));
              await page.evaluate(a=>window.HD20_SUBNAV.render(a),area);
              await page.waitForFunction(a=>document.querySelector('#hd20PurposePanel')?.dataset.contract?.startsWith(a+'.'),area,{timeout:10000});
              await page.evaluate(a=>window.HD20_NAV?.go?.(a),area); await page.waitForTimeout(150);
              const areaMs=Date.now()-areaStart; console.log('LOAD_STAGE area-ready',area,areaMs);
              if(area==='activity')assert(areaMs<30000,'dense activity first-entry regression: '+areaMs+'ms');
              else assert(areaMs<5000,`dense ${area} entry regression: ${areaMs}ms`);
              for(const sub of subs){
                await page.getByRole('button',{name:sub,exact:true}).click(); await page.waitForTimeout(100);
                const c=await page.locator('#hd20PurposePanel').getAttribute('data-contract');
                assert(c&&c.startsWith(area+'.'),`contract missing for ${area}/${sub}: ${c}`);
                const text=await page.locator('#hd20PurposePanel').innerText();
                for(const term of ['판단','다음','상세 데이터 그리드'])assert(text.includes(term),`${term} missing ${area}/${sub}`);
                const gridStart=Date.now(); console.log('LOAD_STAGE sub-start',area,sub);
                await page.getByRole('button',{name:'상세 데이터 그리드',exact:true}).click();
                await page.waitForFunction(()=>document.querySelector('#hd20UniversalGridModal')?.classList.contains('on'),{},{timeout:20000});
                const meta=await page.locator('#hd20GridMeta').innerText(); assert(meta.length>0,'grid meta missing'); const gridMs=Date.now()-gridStart; console.log('LOAD_STAGE grid-ready',area,sub,gridMs,meta); assert(gridMs<5000,`dense grid regression ${area}/${sub}: ${gridMs}ms`);
                await page.keyboard.press('Escape'); count++;
              }
            }
            assert(count===8,'not all operational subtabs checked');
            assert(errs.length===0,'page errors:\n'+errs.join('\n---\n'));
            await maturityCheck();
            await page.setViewportSize({width:390,height:844});
            await page.evaluate(()=>document.querySelector('.beginnerNav button[data-key="activity"]')?.click()); await page.waitForTimeout(100);
            await page.getByRole('button',{name:'활동관리',exact:true}).click();
            await page.getByRole('button',{name:'상세 데이터 그리드',exact:true}).click();
            const box=await page.locator('.hd20GridBox').boundingBox(); assert(box&&box.width<=390.5,'mobile grid overflow');
            const mobile=await page.evaluate(()=>{const de=document.documentElement,b=document.body,modal=document.querySelector('#hd20UniversalGridModal'),grid=document.querySelector('.hd20GridBox'),purpose=document.querySelector('#hd20PurposePanel');const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,height:r.height}};return {scrollWidth:Math.max(de.scrollWidth,b.scrollWidth),clientWidth:de.clientWidth,modal:rect(modal),grid:rect(grid),purpose:rect(purpose)}}); assert(mobile.scrollWidth<=mobile.clientWidth+2,`dense mobile page overflow ${mobile.scrollWidth}>${mobile.clientWidth}`); for(const [name,r] of Object.entries({grid:mobile.grid,purpose:mobile.purpose}))if(r)assert(r.left>=-2&&r.right<=392,`dense mobile ${name} out of viewport: ${JSON.stringify(r)}`);
            console.log('PASS: canonical five areas + 5 dashboard groups + 8 operational subtab contracts + dashboard maturity portfolio + mobile grid');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs