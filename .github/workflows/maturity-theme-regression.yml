name: HD20 maturity counts and theme audit history regression
on:
  pull_request:
    paths:
      - 'maturity-team-case-drilldown.js'
      - 'hd20-direct-criteria.js'
      - 'theme-master.js'
      - 'theme-inspection.js'
      - 'theme-inspection-v5.css'
      - 'supabase-sync.js'
      - 'DEVELOPMENT_LOG.md'
      - 'DEVELOPER_GUIDE.md'
      - 'docs/session-logs/CODING_LOG_20261028_THEME_AUDIT_SYNC_LINKAGE.md'
      - 'docs/session-logs/CODING_LOG_20261029_THEME_INSPECTION_REBUILD_V5.md'
      - 'index.html'
      - '.github/workflows/maturity-theme-regression.yml'
  push:
    paths:
      - 'maturity-team-case-drilldown.js'
      - 'hd20-direct-criteria.js'
      - 'theme-master.js'
      - 'theme-inspection.js'
      - 'supabase-sync.js'
      - 'DEVELOPMENT_LOG.md'
      - 'DEVELOPER_GUIDE.md'
      - 'docs/session-logs/CODING_LOG_20261028_THEME_AUDIT_SYNC_LINKAGE.md'
      - 'index.html'
      - '.github/workflows/maturity-theme-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check maturity-team-case-drilldown.js
          node --check hd20-direct-criteria.js
          node --check theme-master.js
          node --check theme-inspection.js
          node --check supabase-sync.js
      - name: Official count and audit history contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const drill = fs.readFileSync('maturity-team-case-drilldown.js', 'utf8');
          const criteria = fs.readFileSync('hd20-direct-criteria.js', 'utf8');
          const theme = fs.readFileSync('theme-inspection.js', 'utf8');
          const themeMaster = fs.readFileSync('theme-master.js', 'utf8');
          const sync = fs.readFileSync('supabase-sync.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const checks = {
            'team detail requires official confirmed state': /state==='확정'/.test(drill),
            'team detail requires final adoption flag': /x\.finalAdopted===true\|\|x\.advancementAdopted===true/.test(drill),
            'team detail requires all three criteria': /s\.explicit===true&&s\.count===3/.test(drill),
            'final adoption auto-selects at one or more criteria for master': /cb\.disabled=!master\|\|n===0;cb\.checked=master&&n>=1/.test(criteria),
            'manual toggle cannot contradict automatic adoption threshold': /if\(cb\)cb\.addEventListener\('change',update\)/.test(criteria),
            'criteria cache refreshed': /hd20-direct-criteria\.js\?v=20261028-auto-final-adopt-v2/.test(fs.readFileSync('index.html','utf8')),
            'audit saves append a history record': /checks\.push\(rec\)/.test(theme),
            'audit does not overwrite same line/month slot': !/findIndex\(x=>x\.line===line&&x\.month===month\)/.test(theme),
            'checklist loads latest audit': /sort\(\(a,b\)=>String\(b\.auditedAt\|\|''\)\.localeCompare\(String\(a\.auditedAt\|\|''\)\)\)\[0\]/.test(theme),
            'KPI counts latest audit per line': /latestByLine\.set\(rec\.line,rec\)/.test(theme),
            'theme action records selected audit month': theme.includes('auditMonth:month'),
            'theme matrix groups by audit month': theme.includes('monthKey(x.auditMonth||x.createdAt||x.date)'),
            'active theme action dedupe uses stable issue identity': theme.includes("a.source==='테마Audit'&&a.workplace===line&&a.themeCategory===cat&&a.problem===problem&&activeStatuses.includes(String(a.status||''))"),
            'matrix is based on latest audit checklist': /function matrixData\(month\)\{[\s\S]*?const audits=loadChecks\(\)/.test(theme),
            'visible audit history table exists': theme.includes('themeHistoryTable'),
            'repeat audit trace is attached to active action': theme.includes('relatedAuditRecordIds') && theme.includes('lastAuditRecordId'),
            'Seoul-local date handling is explicit': theme.includes("timeZone:'Asia/Seoul'"),
            'audit history store is included in canonical sync': /const KEYS=\[[^\]]*'hd20ThemeAuditChecksV1'[^\]]*'hd20ThemeAuditPlansV1'/.test(sync),
            'local audit history is preserved if remote key is missing': /k==='hd20ThemeAuditChecksV1'\|\|k==='hd20ThemeAuditPlansV1'\)\{const localAudit=localClean\(k\);if\(Array\.isArray\(localAudit\)&&localAudit\.length\)preservedKeys\.push\(k\)/.test(sync),
            'local theme master is preserved if remote key is missing': /k==='hd20ThemeCatalogMasterV1'/.test(sync),
            'sync cache refreshed': /supabase-sync\.js\?v=20261029-theme-plan-sync-v2/.test(html),
            'maturity drilldown cache refreshed': /maturity-team-case-drilldown\.js\?v=20261028-strict-3criteria-2/.test(html),
            'theme inspection cache refreshed': /theme-inspection\.js\?v=20261030-master-catalog-v2/.test(html),
            'theme workflow has four task views': ['plan','audit','actions','history'].every(v=>theme.includes('data-theme-view="'+v+'"')),
            'theme plans are stored by month and line': theme.includes("PLAN_KEY='hd20ThemeAuditPlansV1'") && theme.includes('themes:selected'),
            'only planned themes are shown in checklist': /THEMES\.filter\(cat=>activeThemes\.includes\(cat\)\)/.test(theme),
            'active Ulsan workplace master is used for line choices': theme.includes('window.HD20WorkplaceMaster?.active?.()'),
            'theme plan store is included in canonical sync': /const KEYS=\[[^\]]*'hd20ThemeAuditPlansV1'/.test(sync),
            'local theme plans are preserved if remote key is missing': /k==='hd20ThemeAuditChecksV1'\|\|k==='hd20ThemeAuditPlansV1'/.test(sync),
            'theme workflow CSS cache refreshed': /theme-inspection-v5\.css\?v=20261029-line-first-v6/.test(html),
            'new line-month has no implicit all-theme plan': /function plannedThemes\(month,line\)\{[\s\S]*?return \[\];/.test(theme),
            'new audit round starts blank': /function checklistState\(line\)\{return \{\}\}/.test(theme),
            'previous judgements are loaded only by explicit action': theme.includes('id="themeLoadPrevious"') && theme.includes('addEventListener(\'click\',loadPreviousJudgements)'),
            'audit saving is blocked without a planned theme': theme.includes("if(!applicable.length){alert('먼저 [점검계획·취약현황]에서 해당 월·라인의 점검 테마를 지정하고 저장해 주세요.')"),
            'action tracker has text and status filters': theme.includes('id="themeActionSearch"') && theme.includes('id="themeActionStatus"'),
            'action tracker includes latest reinspection month': /monthKey\(x\.auditMonth\|\|x\.createdAt\|\|x\.date\)===month\|\|monthKey\(x\.lastAuditMonth\|\|x\.lastAuditedAt\)===month/.test(theme),
            'KPI month filter supports legacy audit timestamps': /loadChecks\(\)\.filter\(x=>monthKey\(x\.month\|\|x\.auditedAt\)===month\)/.test(theme),
            'theme workflow uses explicit four-step process rail': theme.includes('themeWorkflowRail') && ['점검계획','현장 Audit','개선조치','재점검'].every(v=>theme.includes(v)),
            'line overview is compact and line-first': theme.includes('themeLineSummaryBody') && theme.includes('themeLineAction') && theme.includes('계획된 취약 테마'),
            'line overview no longer renders a wide heatmap table': !theme.includes('<table class="themeMatrix">'),
            'dashboard-like KPI tile row removed from theme screen': !theme.includes('<div class="themeKpiRow">'),
            'theme catalog has five requested parent themes': ['정리','정돈','시각화관리','청소','설비자주보전'].every(v=>themeMaster.includes("name:'"+v+"'")),
            'theme catalog supports child create edit and soft delete': themeMaster.includes('tmAddChild') && themeMaster.includes('tmApply') && themeMaster.includes('c.active=false'),
            'theme audit reads integrated master checklist': theme.includes('window.HD20ThemeMaster?.checklist?.()'),
            'theme catalog is included in canonical sync': /const KEYS=\[[^\]]*'hd20ThemeCatalogMasterV1'/.test(sync),
            'theme master asset loaded before theme audit': html.indexOf('theme-master.js') < html.indexOf('theme-inspection.js'),
            'theme master cache refreshed': /theme-master\.js\?v=20261030-granular-crud-v3/.test(html),
            'theme v6 assets cache refreshed': /theme-inspection-v5\\.css\\?v=20261029-line-first-v6/.test(html)
          };
          for (const [name, ok] of Object.entries(checks)) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            assert.ok(ok, name);
          }
          NODE
