name: HD20 maturity GMES isolation smoke
on:
  push:
    branches: [main]
    paths:
      - 'hd20-maturity-map-tab.js'
      - 'gmes-5s-case-import.js'
      - 'index.html'
      - 'tests/maturity-gmes-isolation-smoke.cjs'
      - '.github/workflows/maturity-gmes-isolation-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maturity-gmes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hd20-maturity-gmes.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/hd20-maturity-gmes.log; exit 1
      - name: Verify maturity map excludes GMES workspace
        run: node tests/maturity-gmes-isolation-smoke.cjs
